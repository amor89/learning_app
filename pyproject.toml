[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-app"
version = "0.1.0"
description = "Build tooling, checkers and practice harness for the learning app."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12,<3",
    "pyyaml>=6",
    "markdown>=3.7",
    "pygments>=2.19",
    "python-docx>=1.2,<1.3",
    "weasyprint>=70,<71",
    "nbformat>=5.10",
]

[dependency-groups]
dev = [
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<2.4",
    "pytest>=9,<10",
    "pandas>=3.0,<3.1",
    "numpy>=2,<3",
    "scikit-learn>=1.9,<1.10",
    "polars>=1.33,<2",
    "duckdb>=1.5,<2",
    "pyarrow>=22",
    "matplotlib>=3.10,<4",
    "scipy>=1.17,<2",
    "statsmodels>=0.14,<0.16",
    "pandera>=0.33,<0.34",
    "hypothesis>=6.100,<7",
    "types-PyYAML",
    "types-Markdown",
    "types-Pygments",
]
# Separate environment: PySpark 4.0.4 fails to import pandas-on-Spark with pandas 3.x,
# so the Spark harness pins pandas 2.x and cannot share an environment with `dev`.
spark = [
    "pyspark==4.0.4",
    "delta-spark==4.0.1",
    "pandas>=2.2,<3",
    "pyarrow>=15",
    "pytest>=9,<10",
]

[tool.setuptools]
packages = ["checkers", "learnkit"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["reference", "site", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
# `functions as F` is the house standard for PySpark (see CLAUDE.md).
ignore = ["N812"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["learnkit", "checkers", "scripts", "practice"]
exclude = ["practice/exercises/"]
# Pygments and nbformat ship without full type hints.
untyped_calls_exclude = ["pygments", "nbformat"]

[[tool.mypy.overrides]]
module = ["docx.*", "weasyprint.*", "nbformat.*", "pyspark.*", "delta.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/content"]
pythonpath = ["."]
