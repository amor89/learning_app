id: B4-L1
title: Polars expressions and lazy frames

concept: |
  **Polars** is a DataFrame library written in Rust. It runs on all your cores and has no row index. You describe work with **expressions**: `pl.col("weight").sum()` is a recipe, not a result. Polars runs it inside a context.

  ```python
  import polars as pl

  shares = (
      df.group_by("wave", "brand")
      .agg(pl.col("weight").sum().alias("brand_weight"))
      .with_columns(total=pl.col("brand_weight").sum().over("wave"))
  )
  ```

  - `select` returns only the expressions you list. `with_columns` adds or replaces columns. `filter` keeps rows. `group_by(...).agg(...)` aggregates.
  - `.over("wave")` computes a group total and broadcasts it back to each row, like a window function in SQL.
  - `pl.when(...).then(...).otherwise(...)` replaces `np.where`.

  Polars has two modes. A `DataFrame` runs each step at once. A **`LazyFrame`**, from `df.lazy()` or `pl.scan_parquet(path)`, records the steps and runs nothing until `.collect()`. Before running, the optimiser rewrites the plan. It pushes filters down to the scan, so rows you drop are never read, and reads only the columns you use. `lf.explain()` prints the plan.

  Two behaviours to know (Polars 1.33):

  - **`sum()` of a group with only nulls returns `0`**, not null. Check `null_count()` before you trust a total.
  - **`mean()` skips nulls.** `sum() / pl.len()` counts null rows in the denominator and gives a different answer.

  Use lazy mode for files. Scan, filter, select, aggregate, then collect once at the end.

why_it_matters: |
  A weekly job reads a 9 GB Parquet extract with `pl.read_parquet`, then filters to the current wave. Memory peaks at 14 GB and the job fails on a 16 GB runner on the week the extract grows.

  `pl.scan_parquet(path).filter(pl.col("wave") == wave).select(cols).collect()` lets Polars skip other waves' row groups and unused columns at read time, so memory scales with one wave, not the whole file.

worked_example:
  language: python
  weak:
    code: |
      df = pl.read_parquet("responses.parquet")
      df = df.filter(pl.col("wave") == "2026-09")
      totals = df.group_by("brand").agg(pl.col("weight").sum())
      totals = totals.with_columns(mean_w=pl.col("weight") / df.height)
    annotations:
      - find: 'df = pl.read_parquet("responses.parquet")'
        note: "Eager read: every wave and every column loads before the filter."
      - find: 'totals = totals.with_columns(mean_w=pl.col("weight") / df.height)'
        note: "Divides a brand total by the whole wave's row count: not the brand mean, and null rows count."
  strong:
    code: |
      import polars as pl


      def brand_weights(path: str, wave: str) -> pl.DataFrame:
          """Weighted totals and means per brand for one wave. Grain: one row per brand."""
          return (
              pl.scan_parquet(path)
              .filter(pl.col("wave") == wave)
              .group_by("brand")
              .agg(
                  total=pl.col("weight").sum(),
                  mean_w=pl.col("weight").mean(),
                  missing=pl.col("weight").null_count(),
              )
              .sort("brand")
              .collect()
          )
    annotations:
      - find: "pl.scan_parquet(path)"
        note: "Lazy scan: nothing is read yet."
      - find: '.filter(pl.col("wave") == wave)'
        note: "Pushed down to the scan: other waves are skipped at read time."
      - find: 'missing=pl.col("weight").null_count(),'
        note: "Reports nulls, because an all-null group sums to 0."
      - find: ".collect()"
        note: "One collect at the end runs the optimised plan."
  takeaway: |
    Scan lazily, filter and select early, aggregate with expressions, and collect once.

exercises:
  - id: B4-L1-E1
    type: mcq
    difficulty: 1
    prompt: |
      `lf = pl.scan_parquet("big.parquet").filter(pl.col("wave") == "w9")`. What has happened after this line runs?
    options:
      - {id: a, text: "The whole file is in memory, filtered to wave w9."}
      - {id: b, text: "Nothing is read yet. lf holds a query plan."}
      - {id: c, text: "Only the w9 rows are in memory."}
      - {id: d, text: "Polars wrote a filtered copy of the file."}
    answer: b
    reasons:
      - {id: r1, text: "A LazyFrame records steps and runs them only on collect()."}
      - {id: r2, text: "Parquet files cannot be read without DuckDB."}
    reason_answer: r1
    wrong_answers:
      - answer: a
        feedback: "That is what pl.read_parquet followed by filter does. scan_parquet is lazy."
      - answer: c
        feedback: "Close, but no rows are read until collect(). Then only w9 rows are read."
      - answer: d
        feedback: "Nothing is written. A LazyFrame is a plan in memory."
      - answer: b|r2
        feedback: "Right answer, wrong reason. Polars reads Parquet itself."
    hints:
      - "scan_ versus read_."
      - "When does a LazyFrame run?"
      - "On collect()."
    explanation: |
      `scan_parquet` builds a plan. `collect()` optimises and runs it, pushing the filter to the reader.

  - id: B4-L1-E2
    type: predict_output
    difficulty: 2
    language: python
    prompt: |
      What does this print on Polars 1.33?
    code: |
      import polars as pl

      df = pl.DataFrame({"wave": ["w1", "w1", "w2"], "w": [1.0, 2.0, None]})
      out = df.group_by("wave").agg(pl.col("w").sum()).sort("wave")
      print(out["w"].to_list())
    answer: "[3.0, 0.0]"
    wrong_answers:
      - answer: "[3.0, None]"
        feedback: "Polars sums an all-null group to 0, not null. Check null_count() when that matters."
      - answer: "[3.0]"
        feedback: "Every group appears in the output, including w2."
    hints:
      - "Which values are in group w2?"
      - "What is the sum of no non-null values?"
      - "Polars returns the additive identity."
    explanation: |
      The sum of an empty set of values is 0 in Polars. A real zero and "no data" look the same, so report `null_count()` alongside totals.

  - id: B4-L1-E3
    type: fill_gap
    difficulty: 2
    language: python
    prompt: |
      Add a `share` column with each brand's weight over its wave's total, then run the lazy plan.
    template: |
      out = (
          lf.with_columns(share=pl.col("weight") / pl.col("weight").sum().[[g1]]("wave"))
          .[[g2]]()
      )
    gaps:
      g1: {accepted: [over]}
      g2: {accepted: [collect]}
    wrong_answers:
      - answer: {g1: group_by}
        feedback: "group_by collapses rows. over computes the group total and keeps every row."
      - answer: {g2: execute}
        feedback: "A LazyFrame runs with collect()."
    hints:
      - "A window over groups that keeps every row."
      - "The method that runs a LazyFrame."
      - "`over` and `collect`."
    explanation: |
      `.over("wave")` broadcasts the wave total to each row. `collect()` runs the plan.

  - id: B4-L1-E4
    type: write_function
    difficulty: 3
    language: python
    packages: [polars]
    prompt: |
      Write `brand_share(df: pl.DataFrame) -> pl.DataFrame`. Input columns: `wave`, `brand`, `weight`. Return one row per wave and brand with columns `wave`, `brand`, `share`, where `share` is the brand's weight total over the wave's weight total. When a wave's total is 0, `share` is null. Sort by `wave`, then `brand`.
    starter: |
      import polars as pl


      def brand_share(df):
          ...
    checker:
      kind: python
      setup: |
        import polars as pl
        DF = pl.DataFrame({
            "wave": ["w1", "w1", "w1", "w2", "w3"],
            "brand": ["b", "a", "a", "a", "a"],
            "weight": [2.0, 1.0, 1.0, 4.0, 0.0],
        })
      ast_rules:
        - id: typed_documented
          kind: requires_function
          name: brand_share
          typed: true
          docstring: true
          message: "Give `brand_share` type hints and a docstring."
        - id: no_pandas
          kind: forbids_pattern
          pattern: "to_pandas|import pandas"
          message: "Solve it in Polars. Converting to pandas loses the point of the exercise."
      tests:
        - id: shares
          code: |
            out = brand_share(DF)
            assert out.filter(pl.col("wave") == "w1").rows() == [("w1", "a", 0.5), ("w1", "b", 0.5)]
          message: "Each brand's share must be its weight over the wave total, one row per wave and brand."
        - id: zero_total
          code: |
            out = brand_share(DF)
            assert out.filter(pl.col("wave") == "w3")["share"].to_list() == [None]
          message: "A wave with zero total weight must give a null share, not NaN or an error."
        - id: columns_sorted
          code: |
            out = brand_share(DF)
            assert out.columns == ["wave", "brand", "share"]
            assert out.rows() == sorted(out.rows(), key=lambda r: (r[0], r[1]))
          message: "Return exactly wave, brand, share, sorted by wave then brand."
    solution: |
      import polars as pl


      def brand_share(df: pl.DataFrame) -> pl.DataFrame:
          """Weighted share of each brand within its wave. Grain: one row per wave and brand.

          Args:
              df: Columns wave, brand, weight.

          Returns:
              Columns wave, brand, share. share is null when the wave total is 0.
          """
          return (
              df.group_by("wave", "brand")
              .agg(brand_weight=pl.col("weight").sum())
              .with_columns(total=pl.col("brand_weight").sum().over("wave"))
              .with_columns(
                  share=pl.when(pl.col("total") > 0)
                  .then(pl.col("brand_weight") / pl.col("total"))
                  .otherwise(None)
              )
              .select("wave", "brand", "share")
              .sort("wave", "brand")
          )
    seeded_bugs:
      - |
        import polars as pl


        def brand_share(df: pl.DataFrame) -> pl.DataFrame:
            """No zero guard."""
            return (
                df.group_by("wave", "brand")
                .agg(brand_weight=pl.col("weight").sum())
                .with_columns(share=pl.col("brand_weight") / pl.col("brand_weight").sum().over("wave"))
                .select("wave", "brand", "share")
                .sort("wave", "brand")
            )
      - |
        import polars as pl


        def brand_share(df: pl.DataFrame) -> pl.DataFrame:
            """Divides by the grand total, not the wave total."""
            return (
                df.group_by("wave", "brand")
                .agg(brand_weight=pl.col("weight").sum())
                .with_columns(total=pl.col("brand_weight").sum())
                .with_columns(
                    share=pl.when(pl.col("total") > 0)
                    .then(pl.col("brand_weight") / pl.col("total"))
                    .otherwise(None)
                )
                .select("wave", "brand", "share")
                .sort("wave", "brand")
            )
    wrong_answers:
      - answer: |
          import polars as pl


          def brand_share(df: pl.DataFrame) -> pl.DataFrame:
              """No zero guard."""
              return (
                  df.group_by("wave", "brand")
                  .agg(brand_weight=pl.col("weight").sum())
                  .with_columns(share=pl.col("brand_weight") / pl.col("brand_weight").sum().over("wave"))
                  .select("wave", "brand", "share")
                  .sort("wave", "brand")
              )
        triggers: zero_total
      - answer: |
          import polars as pl


          def brand_share(df: pl.DataFrame) -> pl.DataFrame:
              """Divides by the grand total, not the wave total."""
              return (
                  df.group_by("wave", "brand")
                  .agg(brand_weight=pl.col("weight").sum())
                  .with_columns(total=pl.col("brand_weight").sum())
                  .with_columns(
                      share=pl.when(pl.col("total") > 0)
                      .then(pl.col("brand_weight") / pl.col("total"))
                      .otherwise(None)
                  )
                  .select("wave", "brand", "share")
                  .sort("wave", "brand")
              )
        triggers: shares
    hints:
      - "Aggregate to wave and brand first."
      - "Get the wave total with `.sum().over(\"wave\")`."
      - "Guard with `pl.when(total > 0).then(...).otherwise(None)`."
    explanation: |
      Aggregate to the output grain, broadcast the wave total with `over`, and guard the division so a zero total gives null instead of NaN.

  - id: B4-L1-E5
    type: spot_bug
    difficulty: 4
    language: python
    packages: [polars]
    prompt: |
      The mean satisfaction score per region looks too low in regions with many skipped answers. Tap the line with the bug and fix it.
    code: |
      import polars as pl


      def mean_score(df: pl.DataFrame) -> pl.DataFrame:
          """Mean score per region among respondents who answered."""
          return (
              df.group_by("region")
              .agg(mean_score=pl.col("score").sum() / pl.len())
              .sort("region")
          )
    bug_lines: [8]
    fix_checker:
      kind: python
      setup: |
        import polars as pl
        DF = pl.DataFrame({"region": ["n", "n", "n", "s"], "score": [4.0, 2.0, None, 5.0]})
      tests:
        - id: skips_nulls
          code: |
            assert mean_score(DF).rows() == [("n", 3.0), ("s", 5.0)]
          message: "Skipped answers must be left out of the mean, not counted as zero."
    fix_solution: |
      import polars as pl


      def mean_score(df: pl.DataFrame) -> pl.DataFrame:
          """Mean score per region among respondents who answered."""
          return (
              df.group_by("region")
              .agg(mean_score=pl.col("score").mean())
              .sort("region")
          )
    wrong_answers:
      - lines: [7]
        feedback: "Grouping by region is right. The formula inside agg is the problem."
      - lines: [9]
        feedback: "Sorting does not change values."
    hints:
      - "What does pl.len() count?"
      - "Does it count rows with a null score?"
      - "mean() skips nulls."
    explanation: |
      `pl.len()` counts every row, including skipped answers, so the denominator is too big. `pl.col("score").mean()` divides by the non-null count.

recap:
  - front: "Polars eager vs lazy"
    back: "DataFrame runs each step at once. LazyFrame (scan_*, .lazy()) builds a plan and runs on collect()."
  - front: "Group total on every row in Polars"
    back: "pl.col(\"x\").sum().over(\"group\")."
  - front: "Polars sum() of an all-null group"
    back: "0, not null. Report null_count() with totals."
  - front: "Mean that skips nulls in Polars"
    back: "pl.col(\"x\").mean(). sum() / pl.len() counts null rows."

claims:
  - claim: "Polars sum() of a group with only nulls returns 0."
    status: verified
    source: "Run on Polars 1.33.1 and 1.44.2 in this repository."
  - claim: "LazyFrame optimisation pushes filters and column selection down to the scan."
    status: verified
    source: "Polars user guide, lazy API and optimisations; plan checked with explain() on Polars 1.33.1."
