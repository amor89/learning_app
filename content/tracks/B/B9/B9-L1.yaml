id: B9-L1
title: Power and sample size, before fieldwork

concept: |
  A test with too few people cannot see the effect you care about. It returns "no significant difference", and the team concludes the change did nothing. Decide the sample size **before** fieldwork, from four inputs:

  - **Baseline**: the current rate, for example 40% consideration.
  - **Minimum detectable effect (MDE)**: the smallest change worth acting on, for example 5 points, to 45%.
  - **Significance level** (alpha): usually 0.05, two-sided.
  - **Power**: the chance of detecting the MDE if it is real. Usually 0.8.

  For two proportions, the sample per group is:

  ```python
  z_a = NormalDist().inv_cdf(1 - alpha / 2)
  z_b = NormalDist().inv_cdf(power)
  p_bar = (p1 + p2) / 2
  n = ((z_a * sqrt(2 * p_bar * (1 - p_bar)) + z_b * sqrt(p1 * (1 - p1) + p2 * (1 - p2))) / (p2 - p1)) ** 2
  ```

  Round up. For 40% to 45% at alpha 0.05 and power 0.8: **1,534 per group**. statsmodels 0.14 agrees: `NormalIndPower().solve_power(effect_size=proportion_effectsize(0.45, 0.40), alpha=0.05, power=0.8)` returns 1,533.05.

  The MDE drives everything. Required `n` grows with the inverse square of the effect:

  | Change | n per group |
  |---|---|
  | 40% to 45% | 1,534 |
  | 40% to 42% | 9,493 |

  Halving the effect you want to detect needs roughly four times the sample.

  Two adjustments for survey work:

  - **Design effect.** Weighted or clustered samples carry less information (lesson B8-L1). Multiply `n` by the expected design effect: with a design effect of 1.5, 1,533.05 × 1.5 rounds up to 2,300.
  - **Subgroups.** If the decision needs the effect within each of four regions, each region needs the full `n`, not a quarter of it.

  Write the power calculation into the research plan, with its inputs. If the budget cannot buy the `n`, say so before fieldwork, and agree a larger MDE or a different design.

why_it_matters: |
  A packaging test used 300 respondents per cell to compare purchase intent. The new pack scored 43% against 40%. The report said "no significant difference, keep the current pack". With 300 per cell, the test had about a 1 in 4 chance of detecting a real 5-point lift. The result said nothing about the pack. It said the test was too small.

worked_example:
  language: python
  weak:
    code: |
      N_PER_CELL = 300  # what the budget allows
      result = run_test(N_PER_CELL)
      if result.p_value > 0.05:
          conclusion = "No effect"
    annotations:
      - find: "N_PER_CELL = 300  # what the budget allows"
        note: "Sample size from budget, with no check of what it can detect."
      - find: 'conclusion = "No effect"'
        note: "Absence of evidence from an underpowered test read as evidence of absence."
  strong:
    code: |
      import math
      from statistics import NormalDist


      def n_per_group(p1: float, p2: float, alpha: float = 0.05, power: float = 0.8) -> int:
          """Sample per group to detect p1 vs p2 with a two-sided test."""
          if p1 == p2:
              raise ValueError("p1 and p2 must differ")
          z_a = NormalDist().inv_cdf(1 - alpha / 2)
          z_b = NormalDist().inv_cdf(power)
          p_bar = (p1 + p2) / 2
          top = z_a * math.sqrt(2 * p_bar * (1 - p_bar)) + z_b * math.sqrt(p1 * (1 - p1) + p2 * (1 - p2))
          return math.ceil((top / (p2 - p1)) ** 2)
    annotations:
      - find: "def n_per_group(p1: float, p2: float, alpha: float = 0.05, power: float = 0.8) -> int:"
        note: "Every input to the decision is a named parameter."
      - find: "raise ValueError(\"p1 and p2 must differ\")"
        note: "A zero effect needs infinite n. Fail clearly instead of dividing by zero."
      - find: "return math.ceil((top / (p2 - p1)) ** 2)"
        note: "Round up: 1,533.05 means 1,534 people."
  takeaway: |
    Fix baseline, MDE, alpha and power first, compute n, adjust for design effect and subgroups, then field.

exercises:
  - id: B9-L1-E1
    type: mcq
    difficulty: 1
    prompt: |
      A test with 300 per cell finds no significant difference. Power for the effect you care about was 0.25. What can you conclude?
    options:
      - {id: a, text: "There is no effect."}
      - {id: b, text: "Very little. The test was unlikely to detect the effect even if it were real."}
      - {id: c, text: "The effect is negative."}
      - {id: d, text: "The effect is exactly zero with 75% confidence."}
    answer: b
    reasons:
      - {id: r1, text: "Power 0.25 means a real effect of that size is missed 75% of the time."}
      - {id: r2, text: "Non-significant results are always meaningless."}
    reason_answer: r1
    wrong_answers:
      - answer: a
        feedback: "An underpowered test misses real effects most of the time. No significance is not no effect."
      - answer: c
        feedback: "Nothing in the result points to a negative effect."
      - answer: d
        feedback: "Power is not a confidence level about the effect being zero."
      - answer: b|r2
        feedback: "Right answer, wrong reason. A well-powered non-significant result is informative."
    hints:
      - "What does power 0.25 mean?"
      - "How often would a real effect be missed?"
      - "Three times in four."
    explanation: |
      The test could not answer the question. Report it as inconclusive and, next time, size the sample first.

  - id: B9-L1-E2
    type: predict_output
    difficulty: 2
    language: python
    prompt: |
      Required n per group is 1,534 to detect 40% vs 45%. Roughly how many per group to detect 40% vs 42.5%, with the same alpha and power? The code prints the ratio of the two sample sizes, rounded.
    code: |
      import math
      from statistics import NormalDist


      def n_per_group(p1, p2, alpha=0.05, power=0.8):
          z_a = NormalDist().inv_cdf(1 - alpha / 2)
          z_b = NormalDist().inv_cdf(power)
          p_bar = (p1 + p2) / 2
          top = z_a * math.sqrt(2 * p_bar * (1 - p_bar)) + z_b * math.sqrt(p1 * (1 - p1) + p2 * (1 - p2))
          return math.ceil((top / (p2 - p1)) ** 2)


      print(round(n_per_group(0.40, 0.425) / n_per_group(0.40, 0.45)))
    answer: "4"
    wrong_answers:
      - answer: "2"
        feedback: "n grows with the inverse square of the effect. Half the effect needs about four times the sample."
    hints:
      - "The effect sits squared in the denominator."
      - "Halve the effect."
      - "(1/0.5)^2."
    explanation: |
      Half the effect, about four times the sample: 1,534 becomes roughly 6,000 per group.

  - id: B9-L1-E3
    type: fill_gap
    difficulty: 2
    language: python
    prompt: |
      Compute the sample size with statsmodels for 40% vs 45%.
    template: |
      h = proportion_effectsize(0.45, 0.40)
      n = NormalIndPower().[[g1]](effect_size=h, alpha=0.05, [[g2]]=0.8)
    gaps:
      g1: {accepted: [solve_power]}
      g2: {accepted: [power]}
    wrong_answers:
      - answer: {g1: power}
        feedback: "power() returns power for a given n. solve_power finds the missing quantity, here n."
    hints:
      - "The method that solves for whichever argument you leave out."
      - "Which input is 0.8?"
      - "`solve_power` and `power`."
    explanation: |
      `solve_power` leaves `nobs1` unset and solves for it: 1,533.05, so 1,534 per group.

  - id: B9-L1-E4
    type: write_function
    difficulty: 3
    language: python
    prompt: |
      Write `n_per_group(p1, p2, alpha=0.05, power=0.8, design_effect=1.0) -> int`, using the formula in the concept with `statistics.NormalDist`. Multiply by `design_effect` before rounding up. Raise `ValueError` if `p1 == p2`, or if either share is outside (0, 1).
    starter: |
      import math


      def n_per_group(p1, p2, alpha=0.05, power=0.8, design_effect=1.0):
          return 300
    checker:
      kind: python
      ast_rules:
        - id: typed_documented
          kind: requires_function
          name: n_per_group
          typed: true
          docstring: true
          message: "Give `n_per_group` type hints and a docstring."
      tests:
        - id: base
          code: |
            assert n_per_group(0.40, 0.45) == 1534
            assert n_per_group(0.45, 0.40) == 1534
          message: "40% vs 45% at alpha 0.05, power 0.8 must give 1,534, in either order."
        - id: power_alpha
          code: |
            assert n_per_group(0.40, 0.45, power=0.9) == 2053
            assert n_per_group(0.10, 0.12) == 3841
          message: "Use the alpha and power arguments in the z values."
        - id: deff
          code: |
            assert n_per_group(0.40, 0.45, design_effect=1.5) == 2300
          message: "Multiply by design_effect before rounding up."
        - id: invalid
          code: |
            for args in [(0.4, 0.4), (0.0, 0.1), (0.5, 1.0)]:
                try:
                    n_per_group(*args)
                except ValueError:
                    continue
                raise AssertionError(args)
          message: "Raise ValueError for equal shares or shares outside (0, 1)."
    solution: |
      import math
      from statistics import NormalDist


      def n_per_group(
          p1: float, p2: float, alpha: float = 0.05, power: float = 0.8, design_effect: float = 1.0
      ) -> int:
          """Sample per group to detect p1 vs p2 with a two-sided test.

          Args:
              p1: Baseline share.
              p2: Share under the minimum detectable effect.
              alpha: Two-sided significance level.
              power: Chance of detecting the effect if real.
              design_effect: Multiplier for weighted or clustered samples.

          Returns:
              Respondents per group, rounded up.

          Raises:
              ValueError: If p1 equals p2 or a share is outside (0, 1).
          """
          if p1 == p2 or not (0 < p1 < 1 and 0 < p2 < 1):
              raise ValueError("shares must differ and lie strictly between 0 and 1")
          z_a = NormalDist().inv_cdf(1 - alpha / 2)
          z_b = NormalDist().inv_cdf(power)
          p_bar = (p1 + p2) / 2
          top = z_a * math.sqrt(2 * p_bar * (1 - p_bar)) + z_b * math.sqrt(p1 * (1 - p1) + p2 * (1 - p2))
          return math.ceil((top / (p2 - p1)) ** 2 * design_effect)
    seeded_bugs:
      - |
        import math
        from statistics import NormalDist


        def n_per_group(
            p1: float, p2: float, alpha: float = 0.05, power: float = 0.8, design_effect: float = 1.0
        ) -> int:
            """One-sided z by mistake."""
            if p1 == p2 or not (0 < p1 < 1 and 0 < p2 < 1):
                raise ValueError("bad shares")
            z_a = NormalDist().inv_cdf(1 - alpha)
            z_b = NormalDist().inv_cdf(power)
            p_bar = (p1 + p2) / 2
            top = z_a * math.sqrt(2 * p_bar * (1 - p_bar)) + z_b * math.sqrt(p1 * (1 - p1) + p2 * (1 - p2))
            return math.ceil((top / (p2 - p1)) ** 2 * design_effect)
      - |
        import math
        from statistics import NormalDist


        def n_per_group(
            p1: float, p2: float, alpha: float = 0.05, power: float = 0.8, design_effect: float = 1.0
        ) -> int:
            """Rounds before the design effect."""
            if p1 == p2 or not (0 < p1 < 1 and 0 < p2 < 1):
                raise ValueError("bad shares")
            z_a = NormalDist().inv_cdf(1 - alpha / 2)
            z_b = NormalDist().inv_cdf(power)
            p_bar = (p1 + p2) / 2
            top = z_a * math.sqrt(2 * p_bar * (1 - p_bar)) + z_b * math.sqrt(p1 * (1 - p1) + p2 * (1 - p2))
            return int(math.ceil((top / (p2 - p1)) ** 2) * design_effect)
    wrong_answers:
      - answer: |
          import math
          from statistics import NormalDist


          def n_per_group(
              p1: float, p2: float, alpha: float = 0.05, power: float = 0.8, design_effect: float = 1.0
          ) -> int:
              """One-sided z by mistake."""
              if p1 == p2 or not (0 < p1 < 1 and 0 < p2 < 1):
                  raise ValueError("bad shares")
              z_a = NormalDist().inv_cdf(1 - alpha)
              z_b = NormalDist().inv_cdf(power)
              p_bar = (p1 + p2) / 2
              top = z_a * math.sqrt(2 * p_bar * (1 - p_bar)) + z_b * math.sqrt(p1 * (1 - p1) + p2 * (1 - p2))
              return math.ceil((top / (p2 - p1)) ** 2 * design_effect)
        triggers: base
    hints:
      - "Two-sided: z_a = NormalDist().inv_cdf(1 - alpha / 2)."
      - "Square (top / (p2 - p1)), then multiply by design_effect."
      - "math.ceil last."
    explanation: |
      The formula turns the four decisions into a number. The design effect scales it for the information weights remove.

  - id: B9-L1-E5
    type: design
    difficulty: 4
    prompt: |
      A client wants to know whether a new ad lifts consideration from 40% by at least 5 points, overall and within each of 4 regions. Weighting will give a design effect of about 1.5. The budget buys 4,000 completes. Choose the plan.
    slots:
      - id: total
        label: "Sample for the overall read"
        options:
          - {id: ok, text: "2 × 1,534 × 1.5 = 4,602: slightly above budget"}
          - {id: plenty, text: "4,000 is plenty for any read"}
        answer: ok
      - id: regions
        label: "Regional reads"
        options:
          - {id: need_full, text: "Each region needs about 4,600 on its own: 18,400 in total"}
          - {id: quarter, text: "A quarter of the overall sample per region is enough"}
        answer: need_full
      - id: decision
        label: "Recommendation"
        options:
          - {id: agree, text: "Agree before fieldwork: overall read only, or a larger MDE for regions, or more budget"}
          - {id: run, text: "Run with 4,000 and report regions anyway"}
        answer: agree
    model_answer: |
      - Overall: about 4,600 needed with the design effect. 4,000 is close but short.
      - Regions: each needs the full sample for the same MDE.
      - Settle the trade-off with the client before fieldwork, in writing.
    wrong_answers:
      - answer: {total: plenty}
        feedback: "Two cells of 1,534, times a design effect of 1.5, need about 4,600."
      - answer: {regions: quarter}
        feedback: "A quarter of the sample cannot detect the same 5-point lift. Each region is its own test."
      - answer: {decision: run}
        feedback: "Underpowered regional reads produce noise dressed as findings."
    hints:
      - "Two groups, 1,534 each, times 1.5."
      - "Does a region need less sample to detect the same effect?"
      - "Decide before fieldwork."
    explanation: |
      Power maths turns a budget conversation into explicit trade-offs, agreed before any data exists.

recap:
  - front: "Four inputs to a sample size"
    back: "Baseline, minimum detectable effect, alpha, power."
  - front: "n per group, 40% vs 45%, alpha 0.05, power 0.8"
    back: "1,534."
  - front: "Halve the effect you want to detect"
    back: "About four times the sample."
  - front: "Weighted or subgroup reads"
    back: "Multiply n by the design effect. Each subgroup needs the full n."

claims:
  - claim: "NormalIndPower().solve_power(effect_size=proportion_effectsize(0.45, 0.40), alpha=0.05, power=0.8) returns 1533.05."
    status: verified
    source: "Run on statsmodels 0.15.0 in this repository; matches the closed-form result of 1,534."
  - claim: "With 300 per cell, power to detect 40% vs 45% is 0.24."
    status: verified
    source: "Computed with statsmodels NormalIndPower in this repository."
