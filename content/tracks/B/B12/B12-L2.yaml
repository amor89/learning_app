id: B12-L2
title: Calibration, when the probability itself matters

concept: |
  A model is **calibrated** when its probabilities mean what they say: of all customers scored 0.30, about 30% churn. Ranking metrics such as ROC AUC ignore calibration. A model can rank perfectly and still say 0.9 where the truth is 0.1.

  Calibration matters whenever someone uses the number itself: expected revenue (`probability × value`), a forecast count of churners, a risk shown to a person, or thresholds agreed in probability terms.

  **Check it** with a calibration table: group predictions into bins, then compare the mean predicted probability with the observed rate in each bin. scikit-learn 1.8 gives the same with `calibration_curve(y, p, n_bins=10)`. Plot observed against predicted. A calibrated model follows the diagonal.

  Summarise with the **Brier score** (`brier_score_loss`), the mean squared error of the probabilities. Compare it with a constant model that always predicts the prevalence.

  A common cause of bad calibration is **reweighting for imbalance**. In this course's build, a logistic regression on data with 2.4% positives had a mean predicted probability of 0.024 and a Brier score of 0.021. The same model with `class_weight="balanced"` had a mean predicted probability of **0.42**, and a Brier score of **0.199**, worse than predicting 0.024 for everyone (0.024). Its AUC was slightly higher. Its probabilities were useless as probabilities.

  **Fix it** with `CalibratedClassifierCV(model, method="sigmoid", cv=5)`, which fits a calibration map on held-out folds. Use `method="isotonic"` only with plenty of data, roughly a thousand positives or more, because it overfits small samples. Check calibration again on the test set after fitting.

  If you only need a ranking or a top-k list, calibration does not matter. Say which one you deliver.

why_it_matters: |
  A retention team estimated campaign value as the sum of churn probabilities times customer margin. The model had been trained with balanced class weights. Its average churn probability was 0.41 on a base that churned at 3% a month. The business case promised ten times the saves the campaign could deliver, and budget was approved on it.

worked_example:
  language: python
  weak:
    code: |
      model = LogisticRegression(class_weight="balanced").fit(X_train, y_train)
      expected_churners = model.predict_proba(X_live)[:, 1].sum()
    annotations:
      - find: 'model = LogisticRegression(class_weight="balanced").fit(X_train, y_train)'
        note: "Balanced weights push probabilities towards 0.5."
      - find: "expected_churners = model.predict_proba(X_live)[:, 1].sum()"
        note: "Sums miscalibrated probabilities as if they were real rates."
  strong:
    code: |
      import numpy as np
      import pandas as pd


      def calibration_table(y: np.ndarray, p: np.ndarray, n_bins: int) -> pd.DataFrame:
          """Mean predicted and observed rate per equal-width bin. Empty bins are left out."""
          edges = np.linspace(0.0, 1.0, n_bins + 1)
          idx = np.searchsorted(edges[1:-1], p, side="right")
          df = pd.DataFrame({"bin": idx, "y": y, "p": p})
          table = df.groupby("bin").agg(mean_predicted=("p", "mean"), observed=("y", "mean"), n=("y", "size"))
          return table.reset_index(drop=True)
    annotations:
      - find: 'idx = np.searchsorted(edges[1:-1], p, side="right")'
        note: "Assigns each probability to an equal-width bin."
      - find: 'table = df.groupby("bin").agg(mean_predicted=("p", "mean"), observed=("y", "mean"), n=("y", "size"))'
        note: "Predicted against observed, with the count behind each row."
  takeaway: |
    When the probability is used as a number, check calibration, compare the Brier score with a constant baseline, and recalibrate on held-out data.

exercises:
  - id: B12-L2-E1
    type: mcq
    difficulty: 1
    prompt: |
      A model has ROC AUC 0.85. Of customers it scores between 0.8 and 0.9, 20% churn. What is true?
    options:
      - {id: a, text: "It ranks well but is poorly calibrated."}
      - {id: b, text: "It is well calibrated."}
      - {id: c, text: "The AUC must be wrong."}
      - {id: d, text: "It ranks badly."}
    answer: a
    reasons:
      - {id: r1, text: "AUC measures ordering only. The probabilities can be far off while the order is right."}
      - {id: r2, text: "Any model with AUC above 0.8 is calibrated."}
    reason_answer: r1
    wrong_answers:
      - answer: b
        feedback: "Calibrated would mean about 85% churn in that bin, not 20%."
      - answer: c
        feedback: "Nothing contradicts the AUC. Ranking and calibration are separate properties."
      - answer: d
        feedback: "0.85 AUC is good ranking."
      - answer: a|r2
        feedback: "Right answer, wrong reason. AUC says nothing about calibration."
    hints:
      - "What does AUC measure?"
      - "What would a calibrated model show in the 0.8 to 0.9 bin?"
      - "About 85% observed."
    explanation: |
      Good ranking, poor calibration. Fine for a top-k list, wrong for expected-value sums.

  - id: B12-L2-E2
    type: predict_output
    difficulty: 2
    language: python
    prompt: |
      What does this print? (scikit-learn 1.8)
    code: |
      from sklearn.metrics import brier_score_loss

      y = [0, 0, 0, 1]
      print(brier_score_loss(y, [0.25, 0.25, 0.25, 0.25]), brier_score_loss(y, [0.5, 0.5, 0.5, 0.5]))
    answer: "0.1875 0.25"
    wrong_answers:
      - answer: "0.25 0.25"
        feedback: "Predicting the prevalence (0.25) gives (3 × 0.0625 + 0.5625) / 4 = 0.1875."
    hints:
      - "Brier = mean of (p - y)^2."
      - "For p = 0.25: three rows of 0.0625 and one of 0.5625."
      - "For p = 0.5 every row is 0.25."
    explanation: |
      The prevalence is the best constant prediction. A model worse than 0.1875 here is worse than knowing only the base rate.

  - id: B12-L2-E3
    type: fill_gap
    difficulty: 2
    language: python
    prompt: |
      Recalibrate a classifier with a sigmoid map fitted on held-out folds.
    template: |
      calibrated = [[g1]](model, method="[[g2]]", cv=5).fit(X_train, y_train)
    gaps:
      g1: {accepted: [CalibratedClassifierCV]}
      g2: {accepted: [sigmoid]}
    wrong_answers:
      - answer: {g2: isotonic}
        feedback: "Isotonic works, but overfits small samples. The prompt asks for sigmoid."
    hints:
      - "The scikit-learn wrapper in sklearn.calibration."
      - "Platt scaling's other name."
      - "`CalibratedClassifierCV` and `sigmoid`."
    explanation: |
      `CalibratedClassifierCV` fits the model and a calibration map on separate folds, so calibration is learned on data the model did not train on.

  - id: B12-L2-E4
    type: write_function
    difficulty: 3
    language: python
    packages: [numpy, pandas]
    prompt: |
      Write `calibration_table(y, p, n_bins) -> pd.DataFrame`. Split [0, 1] into `n_bins` equal-width bins. Assign each probability with `np.searchsorted(edges[1:-1], p, side="right")`. Return one row per **non-empty** bin, in bin order, with columns `mean_predicted`, `observed` (mean of `y`) and `n`, and a default 0..k index.
    starter: |
      import numpy as np
      import pandas as pd


      def calibration_table(y, p, n_bins):
          return pd.DataFrame({"mean_predicted": [p.mean()], "observed": [y.mean()]})
    checker:
      kind: python
      setup: |
        import numpy as np
        Y = np.array([0, 1, 1, 0, 1])
        P = np.array([0.12, 0.23, 0.95, 0.91, 0.85])
      ast_rules:
        - id: typed_documented
          kind: requires_function
          name: calibration_table
          typed: true
          docstring: true
          message: "Give `calibration_table` type hints and a docstring."
      tests:
        - id: values
          code: |
            t = calibration_table(Y, P, 2)
            assert list(t.columns) == ["mean_predicted", "observed", "n"]
            assert [round(v, 4) for v in t["mean_predicted"]] == [0.175, 0.9033]
            assert [round(v, 4) for v in t["observed"]] == [0.5, 0.6667]
            assert t["n"].tolist() == [2, 3]
          message: "Each bin needs its mean predicted probability, observed rate and count."
        - id: empty_bins
          code: |
            t = calibration_table(Y, P, 10)
            assert len(t) == 4 and list(t.index) == [0, 1, 2, 3]
          message: "Leave out empty bins, and reset the index."
    solution: |
      import numpy as np
      import pandas as pd


      def calibration_table(y: np.ndarray, p: np.ndarray, n_bins: int) -> pd.DataFrame:
          """Mean predicted probability and observed rate per equal-width bin.

          Args:
              y: Binary outcomes.
              p: Predicted probabilities.
              n_bins: Number of equal-width bins on [0, 1].

          Returns:
              One row per non-empty bin: mean_predicted, observed, n.
          """
          edges = np.linspace(0.0, 1.0, n_bins + 1)
          idx = np.searchsorted(edges[1:-1], p, side="right")
          df = pd.DataFrame({"bin": idx, "y": y, "p": p})
          table = df.groupby("bin").agg(mean_predicted=("p", "mean"), observed=("y", "mean"), n=("y", "size"))
          return table.reset_index(drop=True)
    seeded_bugs:
      - |
        import numpy as np
        import pandas as pd


        def calibration_table(y: np.ndarray, p: np.ndarray, n_bins: int) -> pd.DataFrame:
            """Observed is the bin's share of all positives."""
            edges = np.linspace(0.0, 1.0, n_bins + 1)
            idx = np.searchsorted(edges[1:-1], p, side="right")
            df = pd.DataFrame({"bin": idx, "y": y, "p": p})
            table = df.groupby("bin").agg(mean_predicted=("p", "mean"), observed=("y", "sum"), n=("y", "size"))
            table["observed"] = table["observed"] / df["y"].sum()
            return table.reset_index(drop=True)
    wrong_answers:
      - answer: |
          import numpy as np
          import pandas as pd


          def calibration_table(y: np.ndarray, p: np.ndarray, n_bins: int) -> pd.DataFrame:
              """Observed is the bin's share of all positives."""
              edges = np.linspace(0.0, 1.0, n_bins + 1)
              idx = np.searchsorted(edges[1:-1], p, side="right")
              df = pd.DataFrame({"bin": idx, "y": y, "p": p})
              table = df.groupby("bin").agg(mean_predicted=("p", "mean"), observed=("y", "sum"), n=("y", "size"))
              table["observed"] = table["observed"] / df["y"].sum()
              return table.reset_index(drop=True)
        triggers: values
    hints:
      - "`edges = np.linspace(0.0, 1.0, n_bins + 1)`."
      - "Group a DataFrame of bin, y and p by bin."
      - "Named aggregation: mean of p, mean of y, size."
    explanation: |
      Observed is the positive rate **within** each bin, the number the predicted mean should match. groupby leaves empty bins out.

  - id: B12-L2-E5
    type: design
    difficulty: 4
    prompt: |
      A churn model will be used two ways. Decide what each use needs.
    slots:
      - id: calllist
        label: "Pick the top 500 customers to call each week"
        options: &needs
          - {id: ranking, text: "Good ranking only"}
          - {id: calibrated, text: "Calibrated probabilities"}
        answer: ranking
      - id: forecast
        label: "Forecast the number of churners next month for finance"
        options: *needs
        answer: calibrated
      - id: training
        label: "Class imbalance handling for the forecast model"
        options:
          - {id: calibrate_after, text: "Train as needed, then recalibrate with CalibratedClassifierCV and check on test"}
          - {id: balanced_only, text: "class_weight=\"balanced\" and use predict_proba directly"}
        answer: calibrate_after
    model_answer: |
      - A top-k list needs order, not calibrated values.
      - A count forecast sums probabilities, so they must be calibrated.
      - Reweighting distorts probabilities. Recalibrate on held-out data and check the Brier score against the constant baseline.
    wrong_answers:
      - answer: {calllist: calibrated}
        feedback: "Calibration does not change the order, so it does not change who is in the top 500."
      - answer: {forecast: ranking}
        feedback: "A sum of probabilities is only right if the probabilities are right."
      - answer: {training: balanced_only}
        feedback: "In this lesson's example, balanced weights moved the mean probability from 0.024 to 0.42."
    hints:
      - "Does the use read the order or the number?"
      - "What does summing probabilities assume?"
      - "What do balanced weights do to probabilities?"
    explanation: |
      Deliver ranking where order is enough. Deliver calibrated probabilities where the number is used.

recap:
  - front: "Calibrated means"
    back: "Of cases scored p, about p are positive."
  - front: "Check calibration"
    back: "Calibration table or calibration_curve, plus Brier score against the constant prevalence baseline."
  - front: "class_weight=\"balanced\" and probabilities"
    back: "Pushes them towards 0.5. Mean p went from 0.024 to 0.42 at 2.4% prevalence."
  - front: "Recalibrate"
    back: "CalibratedClassifierCV(model, method=\"sigmoid\", cv=5). Isotonic only with plenty of data."

claims:
  - claim: "Logistic regression at 2.4% prevalence: mean p 0.024 and Brier 0.021; with class_weight=\"balanced\", mean p 0.42 and Brier 0.199; constant baseline 0.024."
    status: verified
    source: "Run with scikit-learn 1.8.0 and 1.9.1 in this repository (make_classification, random_state=0)."
  - claim: "The table matches sklearn.calibration.calibration_curve with strategy=\"uniform\" on test data."
    status: verified
    source: "Compared with np.allclose on scikit-learn 1.8.0 in this repository."
