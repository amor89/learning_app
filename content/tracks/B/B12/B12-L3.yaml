                    {
                        segment: name,
                        "n": len(g),
                        "positives": n_pos,
                        "precision": tp_all / n_flag if n_flag > 0 else None,
                        "recall": tp_all / n_pos if n_pos > 0 else None,
                    }
                )
            return pd.DataFrame(rows)
    wrong_answers:
      - answer: |
