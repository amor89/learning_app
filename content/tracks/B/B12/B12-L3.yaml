          def metrics_by_segment(df: pd.DataFrame, segment: str) -> pd.DataFrame:
              """Zero instead of missing."""
              rows = []
              for name, g in df.groupby(segment, sort=True):
                  tp = int(((g["y"] == 1) & (g["flagged"] == 1)).sum())
                  n_flag = max(int(g["flagged"].sum()), 1)
                  n_pos = max(int(g["y"].sum()), 1)
                  rows.append(
                      {
                          segment: name,
                          "n": len(g),
                          "positives": int(g["y"].sum()),
                          "precision": tp / n_flag,
                          "recall": tp / n_pos,
                      }
                  )
              return pd.DataFrame(rows)
        triggers: none_values
    hints:
      - "Loop over `df.groupby(segment, sort=True)`."
      - "tp counts rows where y and flagged are both 1, within the segment."
      - "Build a list of dicts and return `pd.DataFrame(rows)`."
    explanation: |
      Per-segment counts and rates show where the model fails. Missing values for empty denominators stop a segment with no positives looking like a failure.

  - id: B12-L3-E5
    type: spot_bug
    difficulty: 4
    language: python
    packages: [numpy, pandas]
    prompt: |
      Validation reports recall 0.78, but production recall is 0.41. Tap the line that makes the evaluation unrepresentative, and fix the function.
    code: |
      import pandas as pd


      def prepare_sets(train: pd.DataFrame, test: pd.DataFrame, seed: int) -> tuple[pd.DataFrame, pd.DataFrame]:
          """Oversample positives so the model sees more of them."""
          pos_train = train[train["y"] == 1].sample(frac=5.0, replace=True, random_state=seed)
          pos_test = test[test["y"] == 1].sample(frac=5.0, replace=True, random_state=seed)
          return pd.concat([train, pos_train]), pd.concat([test, pos_test])
    bug_lines: [7, 8]
    fix_checker:
      kind: python
      setup: |
        import pandas as pd
        TRAIN = pd.DataFrame({"y": [0, 0, 0, 1]})
        TEST = pd.DataFrame({"y": [0, 0, 0, 0, 1]})
      tests:
        - id: test_untouched
          code: |
            tr, te = prepare_sets(TRAIN, TEST, 0)
            assert te["y"].tolist() == [0, 0, 0, 0, 1]
          message: "The test set must keep its natural class balance. Resample training rows only."
        - id: train_oversampled
          code: |
            tr, te = prepare_sets(TRAIN, TEST, 0)
            assert (tr["y"] == 1).sum() == 6
          message: "Training positives must still be oversampled: 1 original plus 5 copies."
    fix_solution: |
      import pandas as pd


      def prepare_sets(train: pd.DataFrame, test: pd.DataFrame, seed: int) -> tuple[pd.DataFrame, pd.DataFrame]:
          """Oversample training positives. The test set keeps its natural balance."""
          pos_train = train[train["y"] == 1].sample(frac=5.0, replace=True, random_state=seed)
          return pd.concat([train, pos_train]), test
    wrong_answers:
      - lines: [6]
        feedback: "Oversampling training positives is a legitimate choice. The problem is the other set."
    hints:
      - "Which set must look like production?"
      - "What does line 7 do to it?"
      - "Return test unchanged."
    explanation: |
      Oversampling the test set inflates positives and duplicates them, so recall is measured on a world that does not exist. Resample training data only.

recap:
  - front: "First response to rare positives"
    back: "Train normally and choose the threshold from capacity or cost."
  - front: "Resampling rule"
    back: "Only inside training folds. Never the test set."
  - front: "Error analysis"
    back: "Metrics per segment with counts, then read the most confident errors."
  - front: "Pooled vs segment recall"
    back: "Pooling weights large segments. Overall 0.7 can hide a segment at 0.2."

claims:
  - claim: "Plain logistic regression at 2.4% prevalence: threshold 0.1 gave precision 0.36, recall 0.42; threshold 0.02 gave recall 0.63, precision 0.04; balanced weights at 0.5 gave recall 0.64, precision 0.05."
    status: verified
    source: "Run with scikit-learn 1.9.1 in this repository (make_classification, random_state=0)."
