                losses.append(float(((X @ w - y) ** 2).mean()))
                w = w - lr * 2 / len(y) * X.T @ (X @ w - y)
            return w, losses
    wrong_answers:
      - answer: |
          import numpy as np


          def gradient_descent(
              X: np.ndarray, y: np.ndarray, lr: float, steps: int
          ) -> tuple[np.ndarray, list[float]]:
              """Records the loss after the update."""
              if lr <= 0 or steps < 1:
                  raise ValueError("bad arguments")
              w = np.zeros(X.shape[1])
              losses: list[float] = []
              for _ in range(steps):
                  w = w - lr * 2 / len(y) * X.T @ (X @ w - y)
                  losses.append(float(((X @ w - y) ** 2).mean()))
              return w, losses
        triggers: losses
    hints:
      - "Check the arguments, then start with `w = np.zeros(X.shape[1])`."
      - "In the loop: append the loss first, then update."
      - "The update subtracts: `w - lr * 2 / len(y) * X.T @ (X @ w - y)`."
    explanation: |
      Recording the loss before each update makes the first value the starting loss, so the curve shows the whole run. The minus sign steps downhill.

  - id: B23-L3-E6
    type: spot_bug
    difficulty: 4
    language: python
    packages: [numpy]
    prompt: |
      The loss rises on every step, even with a learning rate of 0.001. Tap the line responsible, then fix it.
    code: |
      import numpy as np


      def gradient_descent(X, y, lr, steps):
          w = np.zeros(X.shape[1])
          losses = []
          for _ in range(steps):
              losses.append(float(((X @ w - y) ** 2).mean()))
              grad = 2 / len(y) * X.T @ (X @ w - y)
              w = w + lr * grad
          return w, losses
    bug_lines: [10]
    fix_checker:
      kind: python
      setup: |
        import numpy as np
      tests:
        - id: descends
          code: |
            X = np.array([[1.0, 0.0], [0.0, 1.0], [1.0, 1.0]])
            y = X @ np.array([2.0, -1.0])
            w, losses = gradient_descent(X, y, 0.001, 20)
            assert losses[-1] < losses[0], losses
          message: "Step against the gradient: w = w - lr * grad."
    fix_solution: |
      import numpy as np


      def gradient_descent(X, y, lr, steps):
          w = np.zeros(X.shape[1])
          losses = []
          for _ in range(steps):
              losses.append(float(((X @ w - y) ** 2).mean()))
              grad = 2 / len(y) * X.T @ (X @ w - y)
              w = w - lr * grad
          return w, losses
    wrong_answers:
      - lines: [9]
        feedback: "The gradient formula is right. What happens to it on the next line?"
      - lines: [8]
        feedback: "Recording the loss is right. That is how you saw it rise."
    hints:
      - "The gradient points uphill."
      - "Which way should the weights move?"
      - "Subtract the step."
    explanation: |
      The gradient points in the direction the loss increases. Adding it climbs the loss surface, whatever the rate. Subtract it.

recap:
  - front: "The gradient descent update"
    back: "w = w - lr * grad. Against the gradient, scaled by the learning rate."
  - front: "Signs of a bad learning rate"
    back: "Too high: loss grows or turns into nan. Too low: loss barely falls."
  - front: "One optimiser step in PyTorch"
    back: "optimizer.zero_grad(), loss.backward(), optimizer.step()."
  - front: "AdamW and SGD defaults in PyTorch 2.15"
    back: "AdamW weight_decay 0.01, SGD weight_decay 0. A good start: AdamW with lr 1e-3."

claims:
  - claim: "Gradient descent on p^2 from 4 for five steps: 1.3107 at lr 0.1, -1.3107 at 0.9, -9.9533 at 1.1; torch.optim.SGD with lr 0.1 gives 2.048 after three steps; AdamW default weight_decay is 0.01 and SGD's is 0."
    status: verified
    source: "Run on PyTorch 2.15.0 (PyPI wheel, CPU) and Python 3.11 and 3.12, November 2026."
