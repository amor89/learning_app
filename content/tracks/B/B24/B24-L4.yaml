    prompt: |
      Complete the fixed evaluation steps: float32 in [0, 1], then per-channel normalisation.
    template: |
      eval_tf = v2.Compose([
          v2.ToImage(),
          v2.ToDtype(torch.float32, [[g1]]=True),
          v2.[[g2]](MEAN, STD),
      ])
