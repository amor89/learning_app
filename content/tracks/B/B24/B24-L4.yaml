id: B24-L4
title: Images as tensors, normalisation and augmentation

concept: |
  Image files arrive as unsigned 8-bit integers from 0 to 255, usually laid out `(H, W, C)`. Before a model sees them (PyTorch 2.15, torchvision 0.29):

  1. Move channels first: `torch.from_numpy(img).permute(2, 0, 1)` gives `(C, H, W)` (lesson B24-L2).
  2. Convert to float32 in [0, 1]: `.float() / 255`. In torchvision, `v2.ToImage()` then `v2.ToDtype(torch.float32, scale=True)` do steps 1 and 2 on an `(H, W, C)` uint8 array.
  3. Normalise each channel with the training images' mean and standard deviation: `v2.Normalize(mean, std)` computes `(x - mean) / std` per channel. A pretrained model needs the statistics it was trained with (lesson B24-L5).

  **Augmentation** makes small random changes to each training image every time it is loaded: a flip, a shift of a few pixels, a small rotation, a change of brightness. The model meets new variants every epoch, so it learns the object rather than the exact pixels.

  ```python
  train_tf = v2.Compose([v2.ToImage(), v2.RandomCrop(32, padding=4), v2.RandomHorizontalFlip(),
                         v2.ToDtype(torch.float32, scale=True), v2.Normalize(MEAN, STD)])
  eval_tf = v2.Compose([v2.ToImage(), v2.ToDtype(torch.float32, scale=True), v2.Normalize(MEAN, STD)])
  ```

  `v2.RandomCrop(32, padding=4)` pads by 4 pixels and cuts a random 32 by 32 window: a shift of up to 4 pixels. `v2.RandomHorizontalFlip()` flips half the time (`p=0.5`).

  Three rules:

  - **Augment training images only.** Validation and test images get the fixed steps alone. With random changes, the same validation set gave different inputs on two calls, so its metric would change between runs.
  - **Keep the label true.** A flipped photo of a shop still shows a shop. A flipped handwritten 2 is no longer a 2, and a 6 rotated half a turn reads as 9.
  - **Transform in `__getitem__`**, so every epoch draws fresh changes.

why_it_matters: |
  A model of shelf photos scored 0.91 accuracy on validation one day and 0.88 the next, with no code change. The validation `Dataset` had been built with the training transform, so its images were randomly cropped and flipped on every evaluation. With the fixed transform, validation accuracy was the same on every run, and early stopping chose its best epoch on a stable number.

worked_example:
  language: python
  weak:
    code: |
      tf = v2.Compose([v2.ToImage(), v2.RandomCrop(32, padding=4), v2.RandomVerticalFlip(), v2.ToDtype(torch.float32)])
      train_rows = ImageRows(train_images, train_labels, transform=tf)
      val_rows = ImageRows(val_images, val_labels, transform=tf)
    annotations:
      - find: "tf = v2.Compose([v2.ToImage(), v2.RandomCrop(32, padding=4), v2.RandomVerticalFlip(), v2.ToDtype(torch.float32)])"
        note: "No scaling to [0, 1], no normalisation, and an upside-down flip that changes what many images show."
      - find: "val_rows = ImageRows(val_images, val_labels, transform=tf)"
        note: "Random changes on validation: the metric moves between runs."
  strong:
    code: |
      import numpy as np
      import torch
      from torch.utils.data import Dataset
      from torchvision.transforms import v2


      def build_transforms(mean: list[float], std: list[float]) -> tuple[v2.Compose, v2.Compose]:
          """Training transform with augmentation, and the fixed transform for evaluation.

          Args:
              mean: Per-channel mean of the training images, in [0, 1].
              std: Per-channel standard deviation of the training images.

          Returns:
              (train_transform, eval_transform).
          """
          fixed = [v2.ToDtype(torch.float32, scale=True), v2.Normalize(mean, std)]
          train_tf = v2.Compose([v2.ToImage(), v2.RandomCrop(32, padding=4), v2.RandomHorizontalFlip(), *fixed])
          eval_tf = v2.Compose([v2.ToImage(), *fixed])
          return train_tf, eval_tf


      class ImageRows(Dataset[tuple[torch.Tensor, int]]):
          """(H, W, C) uint8 images with integer labels, transformed on every access."""

          def __init__(self, images: np.ndarray, labels: np.ndarray, transform: v2.Compose) -> None:
              self.images, self.labels, self.transform = images, labels, transform

          def __len__(self) -> int:
              return len(self.labels)

          def __getitem__(self, i: int) -> tuple[torch.Tensor, int]:
              return self.transform(self.images[i]), int(self.labels[i])
    annotations:
      - find: "fixed = [v2.ToDtype(torch.float32, scale=True), v2.Normalize(mean, std)]"
        note: "Scaling and normalisation, shared by both transforms so they cannot drift apart."
      - find: "train_tf = v2.Compose([v2.ToImage(), v2.RandomCrop(32, padding=4), v2.RandomHorizontalFlip(), *fixed])"
        note: "Small shifts and left-right flips: changes that keep a photo's label."
      - find: "eval_tf = v2.Compose([v2.ToImage(), *fixed])"
        note: "No randomness for validation and test."
      - find: "return self.transform(self.images[i]), int(self.labels[i])"
        note: "Transform on access, so each epoch sees new variants."
  takeaway: |
    Channels first, float32 in [0, 1], normalised with training statistics. Augment training images only, with changes that keep the label true.

exercises:
  - id: B24-L4-E1
    type: mcq
    difficulty: 1
    prompt: |
      Should the validation `Dataset` use the training transform, with `RandomCrop` and `RandomHorizontalFlip`?
    options:
      - {id: a, text: "No. Validation gets the fixed steps only, so its metric measures the same images on every run"}
      - {id: b, text: "Yes. Validation should see the same variety as training"}
      - {id: c, text: "Yes, but only for the final test set"}
      - {id: d, text: "No, because augmentation slows evaluation down"}
    answer: a
    reasons:
      - {id: r1, text: "Augmentation adds variety for learning. A metric needs fixed inputs, or it changes between runs for no reason."}
      - {id: r2, text: "Augmentation leaks the labels."}
    reason_answer: r1
    wrong_answers:
      - answer: b
        feedback: "Then validation loss changes between calls on the same model, and early stopping chases noise."
      - answer: c
        feedback: "The test set needs fixed inputs most of all. It is the number you report."
      - answer: d
        feedback: "Speed is not the problem. A random input makes the metric itself random."
      - answer: a|r2
        feedback: "Right answer, wrong reason. Augmentation does not leak labels. It makes the metric unstable."
    hints:
      - "What should a metric depend on?"
      - "Would two evaluations of the same model agree?"
      - "Fixed steps only."
    explanation: |
      Augmentation is for learning. Evaluation needs the same inputs every time, so the metric reflects the model alone.

  - id: B24-L4-E2
    type: predict_output
    difficulty: 2
    language: python
    prompt: |
      What does this print? (PyTorch 2.15)
    code: |
      import numpy as np
      import torch

      img = np.zeros((32, 48, 3), dtype=np.uint8)
      t = torch.from_numpy(img).permute(2, 0, 1)
      print(tuple(t.shape), t.dtype)
    answer: |
      (3, 32, 48) torch.uint8
    wrong_answers:
      - answer: "(3, 32, 48) torch.float32"
        feedback: "permute only reorders dimensions. The dtype stays uint8 until you convert it."
      - answer: "(3, 48, 32) torch.uint8"
        feedback: "permute(2, 0, 1) puts old dimension 2 first, then 0 (height), then 1 (width)."
    hints:
      - "Old dimensions: 0 is height, 1 is width, 2 is channels."
      - "New order: 2, 0, 1."
      - "Does permute change the dtype?"
    explanation: |
      `permute(2, 0, 1)` gives (channels, height, width) = (3, 32, 48). The values stay uint8 until `.float() / 255` or `v2.ToDtype(..., scale=True)`.

