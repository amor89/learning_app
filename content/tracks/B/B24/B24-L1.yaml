      - "`kh` and `sum`."
    explanation: |
      Take the patch the size of the kernel, multiply element by element, and sum.

  - id: B24-L1-E4
    type: write_function
    difficulty: 3
    language: python
    packages: [numpy]
    prompt: |
      Write `correlate2d(image, kernel) -> np.ndarray`, the sliding sum without padding.

      - The output has shape `(h - kh + 1, w - kw + 1)`.
      - Raise `ValueError` when either input is not 2-D, or the kernel is larger than the image in either direction.
    starter: |
      import numpy as np


      def correlate2d(image, kernel):
          return image * kernel
    checker:
      kind: python
      setup: |
        import numpy as np
      ast_rules:
        - id: typed_documented
          kind: requires_function
          name: correlate2d
          typed: true
          docstring: true
          message: "Give correlate2d type hints and a docstring."
      tests:
        - id: values
          code: |
            out = correlate2d(np.arange(9.0).reshape(3, 3), np.ones((2, 2)))
            assert out.shape == (2, 2) and np.allclose(out, [[8, 12], [20, 24]]), out
          message: "Sum the patch times the kernel at every position where the kernel fits."
        - id: not_flipped
          code: |
            image = np.arange(16.0).reshape(4, 4)
            kernel = np.array([[1.0, 0.0], [0.0, -1.0]])
            assert np.allclose(correlate2d(image, kernel), -5.0), correlate2d(image, kernel)
            out = correlate2d(np.arange(20.0).reshape(4, 5), np.ones((3, 2)))
            assert out.shape == (2, 4), out.shape
          message: "Do not flip the kernel, and size the output from the kernel's own shape."
        - id: guards
          code: |
            for image, kernel in [(np.ones((3, 3)), np.ones((4, 1))), (np.ones((3, 3)), np.ones((1, 4))), (np.ones(3), np.ones((1, 1))), (np.ones((3, 3)), np.ones(2))]:
                try:
                    correlate2d(image, kernel)
                except ValueError:
                    continue
                raise AssertionError(f"no ValueError for {image.shape} and {kernel.shape}")
          message: "Raise ValueError for inputs that are not 2-D, or a kernel larger than the image."
    solution: |
      import numpy as np


      def correlate2d(image: np.ndarray, kernel: np.ndarray) -> np.ndarray:
          """Slide a kernel over an image without padding, as nn.Conv2d does.

          Args:
              image: 2-D array, shape (h, w).
              kernel: 2-D array, shape (kh, kw), no larger than the image.

          Returns:
              The feature map, shape (h - kh + 1, w - kw + 1).

          Raises:
              ValueError: If either input is not 2-D or the kernel is larger than the image.
          """
          if image.ndim != 2 or kernel.ndim != 2:
              raise ValueError(f"need 2-D arrays, got {image.shape} and {kernel.shape}")
          kh, kw = kernel.shape
          out_h, out_w = image.shape[0] - kh + 1, image.shape[1] - kw + 1
          if out_h < 1 or out_w < 1:
              raise ValueError(f"kernel {kernel.shape} is larger than image {image.shape}")
          out = np.zeros((out_h, out_w))
          for i in range(out_h):
              for j in range(out_w):
                  out[i, j] = (image[i : i + kh, j : j + kw] * kernel).sum()
          return out
    seeded_bugs:
      - |
        import numpy as np


        def correlate2d(image: np.ndarray, kernel: np.ndarray) -> np.ndarray:
            """Flips the kernel: true convolution, not what nn.Conv2d computes."""
            if image.ndim != 2 or kernel.ndim != 2:
                raise ValueError("need 2-D arrays")
            kernel = kernel[::-1, ::-1]
            kh, kw = kernel.shape
            out_h, out_w = image.shape[0] - kh + 1, image.shape[1] - kw + 1
            if out_h < 1 or out_w < 1:
                raise ValueError("kernel too large")
            out = np.zeros((out_h, out_w))
            for i in range(out_h):
                for j in range(out_w):
                    out[i, j] = (image[i : i + kh, j : j + kw] * kernel).sum()
            return out
      - |
        import numpy as np


        def correlate2d(image: np.ndarray, kernel: np.ndarray) -> np.ndarray:
            """Square kernels only."""
            if image.ndim != 2 or kernel.ndim != 2:
                raise ValueError("need 2-D arrays")
            k = kernel.shape[0]
            out_h, out_w = image.shape[0] - k + 1, image.shape[1] - k + 1
            if out_h < 1 or out_w < 1:
                raise ValueError("kernel too large")
            out = np.zeros((out_h, out_w))
            for i in range(out_h):
                for j in range(out_w):
                    out[i, j] = (image[i : i + k, j : j + k] * kernel).sum()
            return out
    wrong_answers:
      - answer: |
          import numpy as np


          def correlate2d(image: np.ndarray, kernel: np.ndarray) -> np.ndarray:
              """Flips the kernel: true convolution, not what nn.Conv2d computes."""
              if image.ndim != 2 or kernel.ndim != 2:
                  raise ValueError("need 2-D arrays")
              kernel = kernel[::-1, ::-1]
              kh, kw = kernel.shape
              out_h, out_w = image.shape[0] - kh + 1, image.shape[1] - kw + 1
              if out_h < 1 or out_w < 1:
                  raise ValueError("kernel too large")
              out = np.zeros((out_h, out_w))
              for i in range(out_h):
                  for j in range(out_w):
                      out[i, j] = (image[i : i + kh, j : j + kw] * kernel).sum()
              return out
        triggers: not_flipped
    hints:
      - "Check `ndim` on both inputs, then compute the output size from `kernel.shape`."
      - "Raise when either output size is below 1."
      - "Two loops, each cell `(image[i : i + kh, j : j + kw] * kernel).sum()`."
    explanation: |
      The output size comes from the kernel, the guard stops impossible inputs, and the patch-times-kernel sum without a flip matches `nn.Conv2d`.

  - id: B24-L1-E5
    type: write_function
    difficulty: 3
    language: python
    prompt: |
      Write `conv_params(in_channels: int, out_channels: int, kernel_size: int) -> int`: the parameters in one square `nn.Conv2d` layer with a bias.

      - Each output channel has one `kernel_size` by `kernel_size` weight grid per input channel, plus one bias.
      - Raise `ValueError` when any argument is below 1.
    starter: |
      def conv_params(in_channels, out_channels, kernel_size):
          return in_channels * out_channels
    checker:
      kind: python
      ast_rules:
        - id: typed_documented
          kind: requires_function
          name: conv_params
          typed: true
          docstring: true
          message: "Give conv_params type hints and a docstring."
      tests:
        - id: counts
          code: |
            assert conv_params(3, 16, 3) == 448, conv_params(3, 16, 3)
            assert conv_params(1, 16, 3) == 160, conv_params(1, 16, 3)
            assert conv_params(16, 32, 3) == 4640, conv_params(16, 32, 3)
          message: "Count out_channels * in_channels * kernel_size ** 2 weights plus out_channels biases."
        - id: guards
          code: |
            for args in [(0, 16, 3), (3, 0, 3), (3, 16, 0)]:
                try:
                    conv_params(*args)
                except ValueError:
                    continue
                raise AssertionError(f"no ValueError for {args}")
          message: "Raise ValueError when any argument is below 1."
    solution: |
      def conv_params(in_channels: int, out_channels: int, kernel_size: int) -> int:
          """Parameters in a square Conv2d layer with bias.

          Args:
              in_channels: Channels in the input.
              out_channels: Filters, one feature map each.
              kernel_size: Height and width of each kernel.

          Returns:
              Weights plus biases.

          Raises:
              ValueError: If any argument is below 1.
          """
          if min(in_channels, out_channels, kernel_size) < 1:
              raise ValueError("every size must be at least 1")
          return out_channels * in_channels * kernel_size**2 + out_channels
    seeded_bugs:
      - |
        def conv_params(in_channels: int, out_channels: int, kernel_size: int) -> int:
            """Forgets the input channels."""
            if min(in_channels, out_channels, kernel_size) < 1:
                raise ValueError("bad sizes")
            return out_channels * kernel_size**2 + out_channels
      - |
        def conv_params(in_channels: int, out_channels: int, kernel_size: int) -> int:
            """Forgets the biases."""
            if min(in_channels, out_channels, kernel_size) < 1:
                raise ValueError("bad sizes")
            return out_channels * in_channels * kernel_size**2
    wrong_answers:
      - answer: |
          def conv_params(in_channels: int, out_channels: int, kernel_size: int) -> int:
              """Forgets the input channels."""
              if min(in_channels, out_channels, kernel_size) < 1:
                  raise ValueError("bad sizes")
              return out_channels * kernel_size**2 + out_channels
        triggers: counts
    hints:
      - "One kernel grid per input channel, per filter."
      - "Plus one bias per filter."
      - "`out_channels * in_channels * kernel_size ** 2 + out_channels`."
    explanation: |
      Each filter spans every input channel, so 16 filters of 3 by 3 over 3 channels hold 16 × 27 weights plus 16 biases: 448. The count does not depend on the image size.

  - id: B24-L1-E6
    type: spot_bug
    difficulty: 4
    language: python
    packages: [numpy]
    prompt: |
      The feature maps come out one row and one column short, and edges at the bottom and right of every image are never detected. Tap the line responsible, then fix it.
    code: |
      import numpy as np


      def correlate2d(image, kernel):
          kh, kw = kernel.shape
          out_h, out_w = image.shape[0] - kh, image.shape[1] - kw
          out = np.zeros((out_h, out_w))
          for i in range(out_h):
              for j in range(out_w):
                  out[i, j] = (image[i : i + kh, j : j + kw] * kernel).sum()
          return out
    bug_lines: [6]
    fix_checker:
      kind: python
      setup: |
        import numpy as np
      tests:
        - id: full_size
          code: |
            out = correlate2d(np.arange(9.0).reshape(3, 3), np.ones((2, 2)))
            assert out.shape == (2, 2) and np.allclose(out, [[8, 12], [20, 24]]), out
            assert correlate2d(np.ones((4, 4)), np.ones((4, 4))).shape == (1, 1)
          message: "The kernel fits h - kh + 1 times down and w - kw + 1 times across."
    fix_solution: |
      import numpy as np


      def correlate2d(image, kernel):
          kh, kw = kernel.shape
          out_h, out_w = image.shape[0] - kh + 1, image.shape[1] - kw + 1
          out = np.zeros((out_h, out_w))
          for i in range(out_h):
              for j in range(out_w):
                  out[i, j] = (image[i : i + kh, j : j + kw] * kernel).sum()
          return out
    wrong_answers:
      - lines: [10]
        feedback: "The patch and sum are right. Fewer positions are visited than exist."
      - lines: [8]
        feedback: "The loop follows out_h. The problem is how out_h was computed."
    hints:
      - "How many positions does a 2 by 2 kernel have on a 3 by 3 image?"
      - "Count: rows 0 and 1, so 2 = 3 - 2 + 1."
      - "Add 1 to both sizes."
    explanation: |
      A kernel of height kh fits at rows 0 to h - kh, which is h - kh + 1 positions. Without the + 1, the last row and column of positions are never computed.

recap:
  - front: "What a convolution computes"
    back: "At each position, the patch times the kernel, element by element, summed. The outputs form a feature map."
  - front: "Output size without padding"
    back: "(h - kh + 1, w - kw + 1)."
  - front: "Parameters in nn.Conv2d(in, out, k)"
    back: "out * in * k * k weights plus out biases. Independent of image size."
  - front: "Does nn.Conv2d flip the kernel?"
    back: "No. It computes cross-correlation, the plain sliding sum."

claims:
  - claim: "PyTorch 2.15: nn.Conv2d with copied weights equals the NumPy sliding sum (cross-correlation, no flip); Conv2d(3, 16, 3) has a (16, 3, 3, 3) weight and 448 parameters; the [[-1, 1], [-1, 1]] kernel gives 2 along a 0-to-1 vertical edge."
    status: verified
    source: "Run on PyTorch 2.15.0 (PyPI wheel, CPU) and NumPy, November 2026."
