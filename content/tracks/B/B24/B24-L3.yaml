id: B24-L3
title: Pooling, flattening and a complete small CNN

concept: |
  A CNN stacks convolution blocks, then a small classifier (PyTorch 2.15):

  ```python
  model = nn.Sequential(
      nn.Conv2d(1, 16, 3, padding=1), nn.ReLU(), nn.MaxPool2d(2),     # 8x8 to 4x4
      nn.Conv2d(16, 32, 3, padding=1), nn.ReLU(), nn.MaxPool2d(2),    # 4x4 to 2x2
      nn.Flatten(),                                                    # (N, 32 * 2 * 2)
      nn.Linear(32 * 2 * 2, 10),                                       # one logit per digit
  )
  ```

  **Pooling** shrinks each feature map. `nn.MaxPool2d(2)` keeps the largest value in each 2 by 2 block, moving 2 pixels at a time. A 32 by 32 map becomes 16 by 16, and an odd 5 by 5 map becomes 2 by 2: the last row and column are dropped. On `[[1, 3, 2, 0], [4, 2, 1, 5], [0, 1, 3, 2], [2, 6, 1, 1]]` it gives `[[4, 5], [6, 3]]`. `nn.AvgPool2d(2)` averages each block instead. Pooling has no weights. It makes features tolerate small shifts and cuts the work for later layers.

  The usual pattern: early layers find edges, later layers combine them into parts, and each block halves the map while it doubles the channels.

  **Flatten, then size the dense layer.** `nn.Flatten()` turns `(N, C, H, W)` into `(N, C * H * W)`. The `nn.Linear` after it must expect exactly that many inputs. Work it out with the size rule from lesson B24-L2: 8 by 8 digits after two blocks are 32 channels of 2 by 2, so 128. A wrong count fails on the first batch with "mat1 and mat2 shapes cannot be multiplied (64x128 and 2048x10)".

  **Global average pooling.** `nn.AdaptiveAvgPool2d(1)` averages each channel to one value, whatever the input size: `(8, 64, 7, 5)` becomes `(8, 64, 1, 1)`. Ending with it, then `nn.Flatten()` and `nn.Linear(64, classes)`, gives a model that accepts any image size.

  The digits model above has 6,090 parameters. A dense network with one hidden layer of 64 units has 4,810. The lab compares the two on the same data.

why_it_matters: |
  A model built for 32 by 32 product photos was reused on 64 by 64 photos. The Linear layer after Flatten expected 4,096 inputs and received 16,384, and the job failed on its first batch in production. Ending the convolutions with `nn.AdaptiveAvgPool2d(1)` made the classifier's input 64 for any photo size, and one model served both sizes.

worked_example:
  language: python
  weak:
    code: |
      model = nn.Sequential(
          nn.Conv2d(1, 16, 3), nn.ReLU(),
          nn.Conv2d(16, 32, 3), nn.ReLU(),
          nn.Flatten(),
          nn.Linear(2048, 10),
      )
    annotations:
      - find: "nn.Conv2d(1, 16, 3), nn.ReLU(),"
        note: "No padding and no pooling: the map only shrinks by 2 per layer, and the work stays high."
      - find: "nn.Linear(2048, 10),"
        note: "A number copied from somewhere. Nothing ties it to the image size."
  strong:
    code: |
      from torch import nn


      def make_cnn(channels: int, classes: int) -> nn.Sequential:
          """Two conv blocks, global average pooling and a linear classifier.

          Args:
              channels: Input channels, 1 for greyscale.
              classes: Number of classes, one logit each.

          Returns:
              A model that accepts images of any size of at least 4 by 4.
          """
          return nn.Sequential(
              nn.Conv2d(channels, 16, kernel_size=3, padding=1),
              nn.ReLU(),
              nn.MaxPool2d(2),
              nn.Conv2d(16, 32, kernel_size=3, padding=1),
              nn.ReLU(),
              nn.MaxPool2d(2),
              nn.AdaptiveAvgPool2d(1),
              nn.Flatten(),
              nn.Linear(32, classes),
          )
    annotations:
      - find: "nn.Conv2d(channels, 16, kernel_size=3, padding=1),"
        note: "Padding keeps the size, so only the MaxPool2d(2) layers shrink it, halving height and width with no weights."
      - find: "nn.AdaptiveAvgPool2d(1),"
        note: "One value per channel, whatever the image size."
      - find: "nn.Linear(32, classes),"
        note: "Its input equals the last conv's channels, so it never needs recomputing."
  takeaway: |
    Conv, ReLU and pool blocks shrink the maps and grow the channels. Size the dense layer from the shape rule, or end with global average pooling so the size never matters.

exercises:
  - id: B24-L3-E1
    type: mcq
    difficulty: 1
    prompt: |
      What does `nn.MaxPool2d(2)` add to a CNN?
    options:
      - {id: a, text: "It halves height and width with no weights, and makes features tolerate small shifts"}
      - {id: b, text: "It learns which pixels matter most"}
      - {id: c, text: "It doubles the number of channels"}
      - {id: d, text: "It replaces the activation function"}
    answer: a
    reasons:
      - {id: r1, text: "Keeping the largest value in each 2 by 2 block reports that a feature is present nearby, not its exact pixel, and quarters the work for later layers."}
      - {id: r2, text: "Pooling removes noise from the input images."}
    reason_answer: r1
    wrong_answers:
      - answer: b
        feedback: "Max pooling has no weights. It keeps the largest value by rule."
      - answer: c
        feedback: "Pooling works on each channel separately and keeps the channel count."
      - answer: d
        feedback: "Pooling comes after the activation. It does not replace it."
      - answer: a|r2
        feedback: "Right effect, wrong reason. It summarises feature maps, not the raw image."
    hints:
      - "Does max pooling have parameters?"
      - "What happens to a feature that moves by one pixel within a block?"
      - "Smaller maps, shift tolerance."
    explanation: |
      Max pooling summarises each block by its largest value: smaller maps, no weights, and some tolerance to small shifts.

  - id: B24-L3-E2
    type: predict_output
    difficulty: 2
    language: python
    prompt: |
      What does this print? (PyTorch 2.15)
    code: |
      import torch
      from torch import nn

      m = torch.tensor([[1.0, 3.0, 2.0, 0.0],
                        [4.0, 2.0, 1.0, 5.0],
                        [0.0, 1.0, 3.0, 2.0],
                        [2.0, 6.0, 1.0, 1.0]]).reshape(1, 1, 4, 4)
      print(nn.MaxPool2d(2)(m)[0, 0].tolist(), nn.AvgPool2d(2)(m)[0, 0].tolist())
    answer: |
      [[4.0, 5.0], [6.0, 3.0]] [[2.5, 2.0], [2.25, 1.75]]
    wrong_answers:
      - answer: "[[4.0, 3.0, 5.0], [4.0, 3.0, 5.0], [6.0, 6.0, 3.0]] [[2.5, 2.0], [2.25, 1.75]]"
        feedback: "MaxPool2d(2) moves 2 pixels at a time by default, so blocks do not overlap: a 2 by 2 result."
      - answer: "[[4.0, 5.0], [6.0, 3.0]] [[4.0, 5.0], [6.0, 3.0]]"
        feedback: "AvgPool2d averages each block: (1 + 3 + 4 + 2) / 4 = 2.5 for the first."
    hints:
      - "Split the 4 by 4 grid into four 2 by 2 blocks."
      - "Max of each block, then mean of each block."
      - "Top-left block: 1, 3, 4, 2."
    explanation: |
      The blocks are {1, 3, 4, 2}, {2, 0, 1, 5}, {0, 1, 2, 6} and {3, 2, 1, 1}. Their maxima are 4, 5, 6, 3, and their means 2.5, 2.0, 2.25, 1.75.

