id: B25-L6
title: The transformer block, residuals, layer norm and feed-forward

concept: |
  A transformer stacks identical **blocks**. Each block has two sub-layers, and each sub-layer sits inside a residual connection with a layer norm. The pre-norm form (PyTorch 2.15):

  ```python
  x = x + attention(norm_1(x))        # tokens exchange information
  x = x + feed_forward(norm_2(x))     # each token is transformed on its own
  ```

  - **Residual connections**, the `x + ...`, let each sub-layer add a correction to its input, and let gradients pass straight through deep stacks.
  - **Layer norm** rescales each token's vector to mean 0 and standard deviation 1 across its features, then applies a learned scale and shift. `nn.LayerNorm(4)` turns `[1, 2, 3, 4]` into `[-1.3416, -0.4472, 0.4472, 1.3416]`. It works per token, not across the batch, so it behaves the same in training and at prediction time.
  - **Feed-forward**: `nn.Linear(d, 4 * d)`, an activation, then `nn.Linear(4 * d, d)`, applied to each position separately.

  `nn.TransformerEncoderLayer(d_model, nhead)` builds one block. Check three defaults in PyTorch 2.15:

  - `batch_first=False`: a `(batch, length, d)` input is read as `(length, batch, d)`, and the output has the same shape, so nothing fails (lesson B25-L2).
  - `norm_first=False`: the original post-norm order. Pass `norm_first=True` for the pre-norm form above.
  - `dim_feedforward=2048`: with `d_model=16` the default layer holds 68,752 parameters, nearly all in a feed-forward layer 128 times wider than its input. With `dim_feedforward=64` it holds 3,280.

  To classify a sequence, pool the final token vectors, for example the mean over real positions only, then apply a linear head. Including padding in the mean makes a short answer's prediction depend on how much padding it has.

why_it_matters: |
  A team's first transformer for open-ended answers trained slowly on a laptop and overfitted a few thousand answers. Each of its four layers had kept the default feed-forward width of 2,048 for a model width of 32, so almost all its weights sat in layers far wider than the data needed. Setting `dim_feedforward` to four times the model width cut the parameters by more than ten times, and validation loss improved.

worked_example:
  language: python
  weak:
    code: |
      layer = nn.TransformerEncoderLayer(d_model=32, nhead=4)
      encoder = nn.TransformerEncoder(layer, num_layers=4)
      pooled = encoder(x).mean(dim=1)
    annotations:
      - find: "layer = nn.TransformerEncoderLayer(d_model=32, nhead=4)"
        note: "batch_first=False and dim_feedforward=2048: the batch is read as the sequence, and the layer is mostly feed-forward."
      - find: "pooled = encoder(x).mean(dim=1)"
        note: "No padding mask, and the mean includes padding positions."
  strong:
    code: |
      import torch
      from torch import nn


      class Block(nn.Module):
          """Pre-norm transformer block: attention, then feed-forward, each with a residual."""

          def __init__(self, d: int, heads: int) -> None:
              super().__init__()
              self.norm_1 = nn.LayerNorm(d)
              self.attn = nn.MultiheadAttention(d, heads, batch_first=True)
              self.norm_2 = nn.LayerNorm(d)
              self.ff = nn.Sequential(nn.Linear(d, 4 * d), nn.ReLU(), nn.Linear(4 * d, d))

          def forward(self, x: torch.Tensor, is_pad: torch.Tensor) -> torch.Tensor:
              h = self.norm_1(x)
              x = x + self.attn(h, h, h, key_padding_mask=is_pad)[0]
              return x + self.ff(self.norm_2(x))


      def mean_over_real(h: torch.Tensor, is_pad: torch.Tensor) -> torch.Tensor:
          """Mean of token vectors over non-padding positions, shape (batch, d)."""
          keep = (~is_pad).unsqueeze(-1).float()
          return (h * keep).sum(dim=1) / keep.sum(dim=1).clamp(min=1.0)
    annotations:
      - find: "x = x + self.attn(h, h, h, key_padding_mask=is_pad)[0]"
        note: "Residual around attention, on the normalised input, with padding ignored."
      - find: "return x + self.ff(self.norm_2(x))"
        note: "Residual around the feed-forward layer."
      - find: "self.ff = nn.Sequential(nn.Linear(d, 4 * d), nn.ReLU(), nn.Linear(4 * d, d))"
        note: "Four times the model width, not a fixed 2,048."
      - find: "return (h * keep).sum(dim=1) / keep.sum(dim=1).clamp(min=1.0)"
        note: "Averages real tokens only. clamp guards against a division by zero."
  takeaway: |
    A block is attention then feed-forward, each with layer norm and a residual. Set batch_first, norm_first and dim_feedforward yourself, and pool over real tokens only.

exercises:
  - id: B25-L6-E1
    type: mcq
    difficulty: 1
    prompt: |
      What do the residual connections, `x = x + sublayer(norm(x))`, give a deep transformer?
    options:
      - {id: a, text: "Each sub-layer only adds a correction, and gradients reach early layers through the plain x path"}
      - {id: b, text: "They double the number of parameters"}
      - {id: c, text: "They replace the need for attention"}
      - {id: d, text: "They make each token's vector sum to 1"}
    answer: a
    reasons:
      - {id: r1, text: "The identity path passes the input and its gradient through unchanged, so a stack of many blocks still trains."}
      - {id: r2, text: "Addition is cheaper than multiplication."}
    reason_answer: r1
    wrong_answers:
      - answer: b
        feedback: "An addition has no parameters."
      - answer: c
        feedback: "The residual wraps attention. Attention still does the mixing between tokens."
      - answer: d
        feedback: "That describes softmax weights, not residuals."
      - answer: a|r2
        feedback: "Right answer, wrong reason. It is about the clean path for inputs and gradients."
    hints:
      - "What does x + f(x) equal when f outputs zeros?"
      - "How does a gradient pass through an addition?"
      - "Corrections, and a clean gradient path."
    explanation: |
      With `x + f(x)`, a block starts close to the identity and learns a correction, and the gradient flows back through the `x` path without shrinking.

  - id: B25-L6-E2
    type: predict_output
    difficulty: 2
    language: python
    prompt: |
      What does this print? (PyTorch 2.15)
    code: |
      import torch
      from torch import nn

      out = nn.LayerNorm(4)(torch.tensor([[1.0, 2.0, 3.0, 4.0]]))
      print([round(v, 4) for v in out[0].tolist()])
    answer: |
      [-1.3416, -0.4472, 0.4472, 1.3416]
    wrong_answers:
      - answer: "[0.1, 0.2, 0.3, 0.4]"
        feedback: "Layer norm does not divide by the sum. It subtracts the mean and divides by the standard deviation."
      - answer: "[-1.1619, -0.3873, 0.3873, 1.1619]"
        feedback: "Those use the sample standard deviation (n - 1). LayerNorm divides by the population standard deviation (n)."
    hints:
      - "Mean 2.5."
      - "Population variance 1.25, standard deviation 1.118."
      - "(1 - 2.5) / 1.118."
    explanation: |
      Subtract the mean, 2.5, and divide by the standard deviation over the four values, 1.118. A new layer's learned scale is 1 and shift 0, so the result is unchanged by them.

  - id: B25-L6-E3
    type: fill_gap
    difficulty: 2
    language: python
    prompt: |
      Build a pre-norm encoder block that reads `(batch, length, features)`, with a feed-forward width of four times `d_model`.
    template: |
