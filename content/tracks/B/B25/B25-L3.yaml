id: B25-L3
title: Scaled dot-product attention

concept: |
  Attention lets every position look at every other position directly. Each token's vector is projected three ways: a **query**, what this position looks for, a **key**, what it offers, and a **value**, what it passes on. For queries `Q`, keys `K` and values `V`, each of shape `(length, d)`:

  ```python
  scores = Q @ K.T / np.sqrt(d)              # (length, length)
  weights = softmax(scores, axis=-1)         # each row sums to 1
  output = weights @ V                       # (length, d)
  ```

  Row `i` of `weights` says how much position `i` draws from each position, and output `i` is that weighted average of the values.

  **Why divide by `sqrt(d)`.** For random vectors with unit variance, the dot product's standard deviation grows like `sqrt(d)`: about 2 at `d = 4`, 8 at 64 and 22 at 512, in a simulation of 20,000 pairs. Large scores push softmax towards one 1 and zeros elsewhere, where its gradients are almost zero. Dividing by `sqrt(d)` brings the spread back to about 1.

  **A stable softmax.** `exp(1000)` overflows, so the textbook softmax of `[1000, 1001, 1002]` returns `nan`. Subtract each row's maximum first. Softmax does not change when you add a constant to every input, and the largest exponent becomes `exp(0) = 1`. The result is `[0.09, 0.2447, 0.6652]`.

  A small example: the query `[1, 0]` against keys `[1, 0]`, `[0, 1]` and `[1, 1]` scores 0.71, 0 and 0.71 after scaling. The weights are 0.4011, 0.1978 and 0.4011, so with values 10, 20 and 30 the output is 20.

  PyTorch 2.15 computes this with `torch.nn.functional.scaled_dot_product_attention(q, k, v)` on tensors shaped `(..., length, d)`. A NumPy version matched it to within 1e-5. The projections that make Q, K and V are learned `nn.Linear` layers (lesson B25-L5).

why_it_matters: |
  A team wrote its own attention layer for a text classifier, and training produced `nan` loss within the first epoch on long answers. Long inputs made a few scores huge, and the softmax divided infinity by infinity. Subtracting the row maximum before `exp` fixed it, and the scaled scores also trained faster, with no change to the rest of the model.

worked_example:
  language: python
  weak:
    code: |
      def attention(Q, K, V):
          weights = np.exp(Q @ K.T)
          weights = weights / weights.sum()
          return weights @ V
    annotations:
      - find: "weights = np.exp(Q @ K.T)"
        note: "No scaling and no max subtraction: overflows to inf, then nan."
      - find: "weights = weights / weights.sum()"
        note: "Normalises over the whole matrix, so rows do not each sum to 1."
  strong:
    code: |
      import numpy as np


      def softmax(x: np.ndarray, axis: int = -1) -> np.ndarray:
          """Softmax along an axis, with the maximum subtracted for stability."""
          shifted = x - x.max(axis=axis, keepdims=True)
          e = np.exp(shifted)
          return e / e.sum(axis=axis, keepdims=True)


      def attention(Q: np.ndarray, K: np.ndarray, V: np.ndarray) -> tuple[np.ndarray, np.ndarray]:
          """Scaled dot-product attention for one sequence.

          Args:
              Q: Queries, shape (n_queries, d).
              K: Keys, shape (n_keys, d).
              V: Values, shape (n_keys, d_v).

          Returns:
              Outputs (n_queries, d_v) and weights (n_queries, n_keys).

          Raises:
              ValueError: If Q and K differ in width or K and V in length.
          """
          if Q.shape[-1] != K.shape[-1] or len(K) != len(V):
              raise ValueError(f"shapes do not fit: Q {Q.shape}, K {K.shape}, V {V.shape}")
          weights = softmax(Q @ K.T / np.sqrt(Q.shape[-1]), axis=-1)
          return weights @ V, weights
    annotations:
      - find: "shifted = x - x.max(axis=axis, keepdims=True)"
        note: "The largest value becomes 0, so exp never overflows."
      - find: "return e / e.sum(axis=axis, keepdims=True)"
        note: "keepdims keeps the axis, so each row divides by its own sum."
      - find: "weights = softmax(Q @ K.T / np.sqrt(Q.shape[-1]), axis=-1)"
        note: "Scale by sqrt(d), then softmax across the keys of each query."
      - find: "return weights @ V, weights"
        note: "Return the weights too: they show what each position attended to."
  takeaway: |
    Scores are Q @ K.T / sqrt(d), softmax runs across keys with the row maximum subtracted, and the output is the weighted average of the values.

exercises:
  - id: B25-L3-E1
    type: mcq
    difficulty: 1
    prompt: |
      Why does attention divide the scores by `sqrt(d)`?
    options:
      - {id: a, text: "Dot products of d-dimensional vectors grow with d. Large scores saturate softmax and its gradients vanish"}
      - {id: b, text: "It makes each row of weights sum to 1"}
      - {id: c, text: "It stops exp from overflowing on any input"}
      - {id: d, text: "It normalises the values V"}
    answer: a
    reasons:
      - {id: r1, text: "The standard deviation of a dot product of unit-variance vectors is about sqrt(d), so dividing by it keeps scores near unit scale."}
      - {id: r2, text: "Square roots are cheap to compute."}
    reason_answer: r1
    wrong_answers:
      - answer: b
        feedback: "Softmax makes rows sum to 1, scaled or not."
      - answer: c
        feedback: "Scaling reduces typical scores but does not rule out overflow. Subtracting the row maximum does."
      - answer: d
        feedback: "The scale applies to the scores, not to V."
      - answer: a|r2
        feedback: "Right answer, wrong reason. It is about keeping scores at a scale where softmax trains."
    hints:
      - "How does the spread of a dot product change with d?"
      - "What does softmax do with huge inputs?"
      - "Keep scores near unit scale."
    explanation: |
      Dividing by `sqrt(d)` cancels the growth of the dot product with width, so softmax stays in a range with useful gradients.

  - id: B25-L3-E2
    type: predict_output
    difficulty: 2
    language: python
    prompt: |
      What does this print?
    code: |
      import numpy as np

      q = np.array([1.0, 0.0])
      K = np.array([[1.0, 0.0], [0.0, 1.0], [1.0, 1.0]])
      V = np.array([10.0, 20.0, 30.0])
      scores = K @ q / np.sqrt(2)
      w = np.exp(scores - scores.max())
      w = w / w.sum()
      print(w.round(4).tolist(), round(float(w @ V), 4))
    answer: |
      [0.4011, 0.1978, 0.4011] 20.0
    wrong_answers:
      - answer: "[0.5, 0.0, 0.5] 20.0"
        feedback: "Softmax never gives exactly 0. The second key scores 0, and exp(0) is 1, not 0."
      - answer: "[0.3333, 0.3333, 0.3333] 20.0"
        feedback: "The second key scores lower than the other two, so it gets less weight."
    hints:
      - "Scores: 1/sqrt(2), 0, 1/sqrt(2)."
      - "exp of 0.707 is about 2.03."
      - "Normalise 2.03, 1, 2.03."
    explanation: |
      The first and third keys match the query equally, so they share most of the weight. The weighted average of 10, 20 and 30 is 20, since the weights are symmetric.

  - id: B25-L3-E3
    type: fill_gap
    difficulty: 2
    language: python
    prompt: |
      Complete the scaled scores and the stable shift before `exp`.
    template: |
      scores = Q @ K.T / np.[[g1]](d)
      e = np.exp(scores - scores.[[g2]](axis=-1, keepdims=True))
    gaps:
      g1: {accepted: [sqrt]}
      g2: {accepted: [max]}
    wrong_answers:
      - answer: {g1: sqrt, g2: mean}
        feedback: "Subtracting the mean can still leave large positive values. The maximum makes the largest exponent 0."
    hints:
      - "Scale by the square root of the width."
      - "Which value, subtracted, makes the largest exponent 0?"
      - "`sqrt` and `max`."
    explanation: |
      `np.sqrt(d)` scales the scores, and subtracting each row's `max` makes every exponent at most 0.

  - id: B25-L3-E4
    type: write_function
    difficulty: 3
    language: python
    packages: [numpy]
    prompt: |
      Write `softmax(x, axis=-1) -> np.ndarray`, stable for large inputs.

      - Subtract the maximum along `axis` (keeping the axis) before `np.exp`.
      - Divide by the sum along the same axis, so values along it sum to 1.
    primer: |
      `keepdims=True` keeps the reduced axis with length 1, so the result broadcasts back against the original array:

      ```python
      a = np.array([[1.0, 3.0], [2.0, 6.0]])
      a.max(axis=1, keepdims=True)        # array([[3.], [6.]])
      a - a.max(axis=1, keepdims=True)    # array([[-2., 0.], [-4., 0.]])
      ```
    starter: |
      import numpy as np


      def softmax(x, axis=-1):
          e = np.exp(x)
          return e / e.sum()
    checker:
      kind: python
      setup: |
        import numpy as np
      ast_rules:
        - id: typed_documented
          kind: requires_function
          name: softmax
          typed: true
          docstring: true
          message: "Give softmax type hints and a docstring."
      tests:
        - id: stable
          code: |
            import warnings
            with warnings.catch_warnings():
                warnings.simplefilter("error")
                out = softmax(np.array([1000.0, 1001.0, 1002.0]))
            assert np.allclose(out, [0.09003, 0.24473, 0.66524], atol=1e-5), out
          message: "Subtract the maximum before exp, so large inputs do not overflow."
        - id: rows
          code: |
            x = np.array([[1.0, 2.0, 3.0], [0.0, 0.0, 0.0]])
            out = softmax(x)
            assert np.allclose(out.sum(axis=-1), 1.0) and np.allclose(out[1], 1 / 3), out
          message: "Normalise each row separately along the last axis."
        - id: other_axis
          code: |
            x = np.array([[1.0, 2.0], [3.0, 5.0]])
            out = softmax(x, axis=0)
            assert np.allclose(out.sum(axis=0), 1.0), out
            assert np.allclose(out[:, 0], [0.1192, 0.8808], atol=1e-4), out
          message: "Use the axis argument for both the maximum and the sum, with keepdims=True."
    solution: |
      import numpy as np


      def softmax(x: np.ndarray, axis: int = -1) -> np.ndarray:
          """Softmax along an axis, with the maximum subtracted for stability.

          Args:
              x: Scores.
              axis: Axis whose values become probabilities.

          Returns:
              Array of x's shape, summing to 1 along axis.
          """
          shifted = x - x.max(axis=axis, keepdims=True)
          e = np.exp(shifted)
          return e / e.sum(axis=axis, keepdims=True)
    seeded_bugs:
      - |
        import numpy as np


        def softmax(x: np.ndarray, axis: int = -1) -> np.ndarray:
            """No max subtraction: overflows."""
            with np.errstate(over="ignore", invalid="ignore"):
                e = np.exp(x)
                return e / e.sum(axis=axis, keepdims=True)
      - |
        import numpy as np


        def softmax(x: np.ndarray, axis: int = -1) -> np.ndarray:
            """Normalises over the whole array."""
            e = np.exp(x - x.max())
            return e / e.sum()
    wrong_answers:
      - answer: |
          import numpy as np


          def softmax(x: np.ndarray, axis: int = -1) -> np.ndarray:
              """Normalises over the whole array."""
              e = np.exp(x - x.max())
              return e / e.sum()
        triggers: rows
    hints:
      - "`x.max(axis=axis, keepdims=True)`."
      - "Exponentiate the shifted values."
      - "Divide by `e.sum(axis=axis, keepdims=True)`."
    explanation: |
      Shifting by the maximum leaves the result unchanged and keeps every exponent at most 1. Using the same axis with `keepdims` makes each row, not the whole array, sum to 1.

  - id: B25-L3-E5
    type: write_function
    difficulty: 3
    language: python
    packages: [numpy]
    prompt: |
      Write `attention(Q, K, V) -> tuple[np.ndarray, np.ndarray]` for one sequence. A stable `softmax(x, axis=-1)` is defined for you.

      - `Q` is `(n_queries, d)`, `K` is `(n_keys, d)` and `V` is `(n_keys, d_v)`.
      - Weights are `softmax(Q @ K.T / sqrt(d), axis=-1)`. Return `(weights @ V, weights)`.
      - Raise `ValueError` when `Q` and `K` differ in width, or `K` and `V` in length.
    starter: |
      import numpy as np


      def attention(Q, K, V):
          return Q @ K.T @ V, None
    checker:
      kind: python
      setup: |
        import numpy as np


        def softmax(x, axis=-1):
            shifted = x - x.max(axis=axis, keepdims=True)
            e = np.exp(shifted)
            return e / e.sum(axis=axis, keepdims=True)


        _rng = np.random.default_rng(0)
        _Q, _K, _V = _rng.normal(size=(4, 8)), _rng.normal(size=(6, 8)), _rng.normal(size=(6, 3))
      ast_rules:
        - id: typed_documented
          kind: requires_function
          name: attention
          typed: true
          docstring: true
          message: "Give attention type hints and a docstring."
      tests:
        - id: values
          code: |
            out, w = attention(_Q, _K, _V)
            expected_w = softmax(_Q @ _K.T / np.sqrt(8))
            assert out.shape == (4, 3) and w.shape == (4, 6), (out.shape, w.shape)
            assert np.allclose(w, expected_w) and np.allclose(out, expected_w @ _V)
          message: "Weights are softmax(Q @ K.T / sqrt(d)) across keys, and the output is weights @ V."
        - id: rows_sum
          code: |
            _, w = attention(_Q, _K, _V)
            assert np.allclose(w.sum(axis=1), 1.0), w.sum(axis=1)
          message: "Each query's weights sum to 1 across the keys."
        - id: guards
          code: |
            for q, k, v in [(_Q, _K[:, :5], _V), (_Q, _K, _V[:5])]:
                try:
                    attention(q, k, v)
                except ValueError:
                    continue
                raise AssertionError(f"no ValueError for {q.shape}, {k.shape}, {v.shape}")
          message: "Raise ValueError when Q and K differ in width or K and V in length."
    solution: |
      import numpy as np


      def attention(Q: np.ndarray, K: np.ndarray, V: np.ndarray) -> tuple[np.ndarray, np.ndarray]:
          """Scaled dot-product attention for one sequence.

          Args:
              Q: Queries, shape (n_queries, d).
              K: Keys, shape (n_keys, d).
              V: Values, shape (n_keys, d_v).

          Returns:
              Outputs (n_queries, d_v) and weights (n_queries, n_keys).

          Raises:
              ValueError: If Q and K differ in width or K and V in length.
          """
          if Q.shape[-1] != K.shape[-1] or len(K) != len(V):
              raise ValueError(f"shapes do not fit: Q {Q.shape}, K {K.shape}, V {V.shape}")
          weights = softmax(Q @ K.T / np.sqrt(Q.shape[-1]), axis=-1)
          return weights @ V, weights
    seeded_bugs:
      - |
        import numpy as np


        def attention(Q: np.ndarray, K: np.ndarray, V: np.ndarray) -> tuple[np.ndarray, np.ndarray]:
            """Forgets to scale."""
            if Q.shape[-1] != K.shape[-1] or len(K) != len(V):
                raise ValueError("shapes do not fit")
            weights = softmax(Q @ K.T, axis=-1)
            return weights @ V, weights
      - |
        import numpy as np


        def attention(Q: np.ndarray, K: np.ndarray, V: np.ndarray) -> tuple[np.ndarray, np.ndarray]:
            """Softmax across queries instead of keys."""
            if Q.shape[-1] != K.shape[-1] or len(K) != len(V):
                raise ValueError("shapes do not fit")
            weights = softmax(Q @ K.T / np.sqrt(Q.shape[-1]), axis=0)
            return weights @ V, weights
    wrong_answers:
      - answer: |
          import numpy as np


          def attention(Q: np.ndarray, K: np.ndarray, V: np.ndarray) -> tuple[np.ndarray, np.ndarray]:
              """Forgets to scale."""
              if Q.shape[-1] != K.shape[-1] or len(K) != len(V):
                  raise ValueError("shapes do not fit")
              weights = softmax(Q @ K.T, axis=-1)
              return weights @ V, weights
        triggers: values
    hints:
      - "Check `Q.shape[-1] == K.shape[-1]` and `len(K) == len(V)`."
      - "`softmax(Q @ K.T / np.sqrt(Q.shape[-1]), axis=-1)`."
      - "Return `weights @ V` and the weights."
    explanation: |
      Each query's row of weights covers all keys and sums to 1, and the output mixes the values with those weights. This is the computation `scaled_dot_product_attention` performs.

  - id: B25-L3-E6
    type: spot_bug
    difficulty: 4
    language: python
    packages: [numpy]
    prompt: |
      Plotting the attention weights shows each column summing to 1, not each row. Tap the line responsible, then fix it.
    code: |
      import numpy as np


      def attention(Q, K, V):
          scores = Q @ K.T / np.sqrt(Q.shape[-1])
          scores = scores - scores.max(axis=-1, keepdims=True)
          weights = np.exp(scores)
          weights = weights / weights.sum(axis=0, keepdims=True)
          return weights @ V, weights
    bug_lines: [8]
    fix_checker:
      kind: python
      setup: |
        import numpy as np
      tests:
        - id: rows_sum
          code: |
            rng = np.random.default_rng(1)
            Q, K, V = rng.normal(size=(3, 4)), rng.normal(size=(5, 4)), rng.normal(size=(5, 2))
            out, w = attention(Q, K, V)
            assert np.allclose(w.sum(axis=1), 1.0), w.sum(axis=1)
            s = Q @ K.T / 2.0
            ref = np.exp(s - s.max(axis=1, keepdims=True))
            ref = ref / ref.sum(axis=1, keepdims=True)
            assert np.allclose(w, ref) and np.allclose(out, ref @ V)
          message: "Normalise across the keys of each query: sum along axis -1."
    fix_solution: |
      import numpy as np


      def attention(Q, K, V):
          scores = Q @ K.T / np.sqrt(Q.shape[-1])
          scores = scores - scores.max(axis=-1, keepdims=True)
          weights = np.exp(scores)
          weights = weights / weights.sum(axis=-1, keepdims=True)
          return weights @ V, weights
    wrong_answers:
      - lines: [6]
        feedback: "Subtracting each row's maximum is right. The normalisation uses a different axis."
      - lines: [5]
        feedback: "The scaled scores are right. Look at how the weights are normalised."
    hints:
      - "Which axis of the scores runs over keys?"
      - "Which axis does the sum use?"
      - "axis=-1."
    explanation: |
      Rows are queries and columns are keys. Each query's weights must sum to 1 across the keys, so normalise along axis -1. Summing along axis 0 mixes different queries.

recap:
  - front: "Scaled dot-product attention"
    back: "weights = softmax(Q @ K.T / sqrt(d)) across keys; output = weights @ V."
  - front: "Why scale by sqrt(d)"
    back: "Dot products grow like sqrt(d): about 2, 8 and 22 at d = 4, 64, 512. Scaling keeps softmax out of saturation."
  - front: "Stable softmax"
    back: "Subtract the maximum along the axis with keepdims=True before exp, then divide by the sum along the same axis."
  - front: "Attention in PyTorch 2.15"
    back: "torch.nn.functional.scaled_dot_product_attention(q, k, v) on (..., length, d) tensors."

claims:
  - claim: "PyTorch 2.15: torch.nn.functional.scaled_dot_product_attention(query, key, value, attn_mask=None, dropout_p=0.0, is_causal=False, scale=None, enable_gqa=False) matches a NumPy softmax(QK^T/sqrt(d))V within 1e-5; the naive softmax of [1000, 1001, 1002] is nan and the stable one [0.09, 0.2447, 0.6652]; simulated dot-product standard deviations are 1.98, 7.98 and 22.46 at d = 4, 64 and 512, and about 1 after scaling."
    status: verified
    source: "Run on PyTorch 2.15.0 (PyPI wheel, CPU) and NumPy, November 2026. Signature read from the function's docstring."
