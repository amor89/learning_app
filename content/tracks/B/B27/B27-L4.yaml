id: B27-L4
title: Deploying the container to Azure Container Apps

concept: |
  Azure Container Apps runs a container image behind an HTTPS address and scales it for you. One Azure CLI command deploys from your lab folder (Microsoft Learn, November 2025):

  ```text
  az login
  az extension add --name containerapp --upgrade
  az containerapp up --name survey-topics --source . --ingress external --target-port 8000
  ```

  With `--source`, `up` creates a resource group, a Container Apps environment with a Log Analytics workspace, and an Azure Container Registry. It builds the image from your Dockerfile, pushes it, deploys it and prints the app's URL. Redeploy with the same command plus `--resource-group` and `--environment`.

  **Secrets.** Define them on the app with `--secrets "api-key=<value>"`, or better as Key Vault references. Pass them to the container as environment variables with `--env-vars "MAX_BATCH=50" "API_KEY=secretref:api-key"`. Changing a secret does not create a new revision: restart the revision or deploy a new one to pick it up.

  **Health probes.** Container Apps has startup, liveness and readiness probes. An HTTP probe passes on a status from 200 to 399. With ingress on, the default probes are TCP checks on the target port, which pass as soon as uvicorn listens, before the model has loaded. Point an HTTP readiness probe at `/health`, which answers 503 until the model is ready.

  **Scaling.** With no rule of your own, an app scales on HTTP traffic from 0 to 10 replicas, adding a replica per 10 concurrent requests: `ceil(concurrent / 10)`. At zero replicas you pay no usage charges, but the next request waits for a container to start and load the model. Set `--min-replicas 1` when that wait matters.

  **Revisions.** A change to the container template, such as a new image or scale rule, creates a new, immutable revision. Lesson B27-L6 uses revisions to roll back.

  Delete the resource group when you finish practising, or it keeps costing money.

why_it_matters: |
  A team deployed a model service with the default settings and saw the first request each morning time out. The app had scaled to zero overnight, and the cold start, including a 40-second model load, outlasted the caller's timeout. Setting a minimum of one replica for working hours removed the timeouts, and an HTTP readiness probe on `/health` stopped traffic reaching replicas whose model was still loading.

worked_example:
  language: text
  weak:
    code: |
      az containerapp up --name survey-topics --source . --ingress external --target-port 8000 --env-vars "API_KEY=sk-live-4f9a" "MAX_BATCH=100"
      # readiness: default TCP probe on port 8000
    annotations:
      - find: "--env-vars \"API_KEY=sk-live-4f9a\" \"MAX_BATCH=100\""
        note: "The key sits in plain text in the command, the shell history and the app's settings."
      - find: "# readiness: default TCP probe on port 8000"
        note: "TCP passes once the port opens, before the model loads, so early requests can fail."
  strong:
    code: |
      az containerapp up --name survey-topics --source . --ingress external --target-port 8000 --resource-group rg-survey --environment env-survey
      az containerapp secret set --name survey-topics --resource-group rg-survey --secrets "api-key=keyvaultref:<KEY_VAULT_SECRET_URI>,identityref:<IDENTITY_ID>"
      az containerapp update --name survey-topics --resource-group rg-survey --set-env-vars "MAX_BATCH=100" "API_KEY=secretref:api-key" --min-replicas 1 --max-replicas 5
      # readiness: HTTP GET /health on port 8000; 503 until the model loads
    annotations:
      - find: "--secrets \"api-key=keyvaultref:<KEY_VAULT_SECRET_URI>,identityref:<IDENTITY_ID>\""
        note: "The value lives in Key Vault. The app reads it through a managed identity."
      - find: "--set-env-vars \"MAX_BATCH=100\" \"API_KEY=secretref:api-key\" --min-replicas 1 --max-replicas 5"
        note: "secretref: points the variable at the secret; one warm replica avoids cold starts."
      - find: "# readiness: HTTP GET /health on port 8000; 503 until the model loads"
        note: "Traffic reaches a replica only when its model is ready."
  takeaway: |
    Deploy with az containerapp up, keep secrets in Key Vault references passed as secretref variables, probe /health over HTTP, and choose min replicas for your latency needs.

exercises:
  - id: B27-L4-E1
    type: mcq
    difficulty: 1
    prompt: |
      With ingress on and no probes of your own, why can the first requests to a new replica fail?
    options:
      - {id: a, text: "The default readiness probe is a TCP check, which passes when the port opens, before the model has loaded"}
      - {id: b, text: "Container Apps sends no traffic until a liveness probe fails"}
      - {id: c, text: "TCP probes count a 503 response as success"}
      - {id: d, text: "New replicas never receive traffic in single revision mode"}
    answer: a
    reasons:
      - {id: r1, text: "A TCP probe only checks that something listens. An HTTP probe on /health checks that the model is ready."}
      - {id: r2, text: "TCP probes run only once a day."}
    reason_answer: r1
    wrong_answers:
      - answer: b
        feedback: "Liveness restarts unhealthy replicas. Readiness decides when traffic arrives."
      - answer: c
        feedback: "A TCP probe never sees an HTTP status. It only opens a connection."
      - answer: d
        feedback: "In single revision mode, traffic moves to the new revision once its readiness probes pass."
      - answer: a|r2
        feedback: "Right answer, wrong reason. Probes run every few seconds. The problem is what a TCP probe checks."
    hints:
      - "What does a TCP probe check?"
      - "When does uvicorn open the port?"
      - "When does the model finish loading?"
    explanation: |
      uvicorn listens before the lifespan has finished loading the model, so a TCP probe passes too early. An HTTP readiness probe on `/health`, which answers 503 until the model is ready, holds traffic back.

  - id: B27-L4-E2
    type: predict_output
    difficulty: 2
    language: python
    prompt: |
      Container Apps sizes an HTTP-scaled app as `ceil(concurrent requests / target)`, kept between the minimum and maximum replicas. What does this print?
    code: |
      import math


      def replicas(concurrent, target=10, min_r=0, max_r=10):
          return max(min_r, min(max_r, math.ceil(concurrent / target)))


      print([replicas(c) for c in (0, 7, 35, 250)], replicas(0, min_r=1))
    answer: |
      [0, 1, 4, 10] 1
    wrong_answers:
      - answer: "[0, 0, 3, 25] 0"
        feedback: "ceil rounds up, so 7 requests need 1 replica and 35 need 4. The maximum caps 250 at 10."
      - answer: "[1, 1, 4, 10] 1"
        feedback: "The default minimum is 0, so no traffic means no replicas."
    hints:
      - "ceil rounds up."
      - "The maximum is 10."
      - "The last call sets a minimum of 1."
    explanation: |
      7 concurrent requests round up to 1 replica, 35 to 4, and 250 would need 25 but stop at 10. With a minimum of 1, an idle app keeps one warm replica.

  - id: B27-L4-E3
    type: fill_gap
    difficulty: 2
    language: text
    prompt: |
      Deploy from the current folder so the app is reachable from the internet on the port uvicorn listens on.
    template: |
      az containerapp up --name survey-topics --source . --ingress [[g1]] --target-port [[g2]]
    gaps:
      g1: {accepted: [external]}
      g2: {accepted: ["8000"]}
    wrong_answers:
      - answer: {g1: internal, g2: "8000"}
        feedback: "internal ingress is reachable only from inside the Container Apps environment."
      - answer: {g1: external, g2: "80"}
        feedback: "The target port is the port the container listens on: uvicorn uses 8000."
    hints:
      - "Who should reach the app?"
      - "Which port does the CMD give uvicorn?"
      - "`external` and `8000`."
    explanation: |
      `--ingress external` gives the app a public HTTPS address, and `--target-port 8000` sends that traffic to uvicorn's port inside the container.

  - id: B27-L4-E4
    type: write_function
    difficulty: 3
    language: python
    prompt: |
      Write `env_var_args(plain, secret_refs) -> list[str]`, the items for `--env-vars`.

      - `plain` maps variable names to values: `"MAX_BATCH=50"`.
      - `secret_refs` maps variable names to secret names: `"API_KEY=secretref:api-key"`.
      - Return all items sorted by variable name.
      - Raise `ValueError` if a variable appears in both, or any variable name is empty.
    starter: |
      def env_var_args(plain, secret_refs):
          return [f"{k}={v}" for k, v in {**plain, **secret_refs}.items()]
    checker:
      kind: python
      ast_rules:
        - id: typed_documented
          kind: requires_function
          name: env_var_args
          typed: true
          docstring: true
          message: "Give env_var_args type hints and a docstring."
      tests:
        - id: both
          code: |
            got = env_var_args({"MAX_BATCH": "50", "MODEL_DIR": "/app/model"}, {"API_KEY": "api-key"})
            assert got == ["API_KEY=secretref:api-key", "MAX_BATCH=50", "MODEL_DIR=/app/model"], got
          message: "Secrets become NAME=secretref:secret-name; sort every item by variable name."
        - id: clash
          code: |
            try:
                env_var_args({"API_KEY": "abc"}, {"API_KEY": "api-key"})
            except ValueError:
                pass
            else:
                raise AssertionError("no ValueError for a variable in both")
          message: "Raise ValueError when a variable is both plain and a secret."
        - id: empty_name
          code: |
            try:
                env_var_args({"": "x"}, {})
            except ValueError:
                pass
            else:
                raise AssertionError("no ValueError for an empty name")
          message: "Raise ValueError for an empty variable name."
    solution: |
      def env_var_args(plain: dict[str, str], secret_refs: dict[str, str]) -> list[str]:
          """Items for az containerapp --env-vars, secrets as secretref: references.

          Args:
              plain: Variable name to value.
              secret_refs: Variable name to the app secret it reads.

          Returns:
              NAME=value and NAME=secretref:secret items, sorted by name.

          Raises:
              ValueError: If a name is empty or appears in both mappings.
          """
          clash = set(plain) & set(secret_refs)
          if clash:
              raise ValueError(f"both plain and secret: {sorted(clash)}")
          if "" in plain or "" in secret_refs:
              raise ValueError("variable names must not be empty")
          items = {name: f"{name}={value}" for name, value in plain.items()}
          items |= {name: f"{name}=secretref:{secret}" for name, secret in secret_refs.items()}
          return [items[name] for name in sorted(items)]
    seeded_bugs:
      - |
        def env_var_args(plain: dict[str, str], secret_refs: dict[str, str]) -> list[str]:
            """Lets a secret silently override a plain value."""
            if "" in plain or "" in secret_refs:
                raise ValueError("empty name")
            items = {name: f"{name}={value}" for name, value in plain.items()}
            items |= {name: f"{name}=secretref:{secret}" for name, secret in secret_refs.items()}
            return [items[name] for name in sorted(items)]
      - |
        def env_var_args(plain: dict[str, str], secret_refs: dict[str, str]) -> list[str]:
            """Puts the secret name in as a plain value."""
            clash = set(plain) & set(secret_refs)
            if clash or "" in plain or "" in secret_refs:
                raise ValueError("bad names")
            merged = {**plain, **secret_refs}
            return [f"{name}={merged[name]}" for name in sorted(merged)]
    wrong_answers:
      - answer: |
          def env_var_args(plain: dict[str, str], secret_refs: dict[str, str]) -> list[str]:
              """Puts the secret name in as a plain value."""
              clash = set(plain) & set(secret_refs)
              if clash or "" in plain or "" in secret_refs:
                  raise ValueError("bad names")
              merged = {**plain, **secret_refs}
              return [f"{name}={merged[name]}" for name in sorted(merged)]
        triggers: both
    hints:
      - "Check the overlap with a set intersection."
      - "Secret items are `f\"{name}=secretref:{secret}\"`."
      - "Sort by variable name at the end."
    explanation: |
      `secretref:` makes Container Apps fill the variable from the app's secret at run time, so the value never appears in the command. A name in both mappings is a mistake to stop, not to resolve silently.

  - id: B27-L4-E5
    type: write_function
    difficulty: 3
    language: python
    prompt: |
      Write `revision_name(app, suffix) -> str`, returning `"<app>-<suffix>"` after checking the suffix against the Container Apps rules.

      - Only lower-case letters, digits and dashes.
      - Starts with a letter and ends with a letter or digit.
      - No two dashes in a row, and at most 64 characters.
      - Raise `ValueError` naming the suffix if any rule fails.
    primer: |
      `str.isalnum()` is true when every character is a letter or a digit, and `str.islower()` when no character is upper case:

      ```python
      "v2".isalnum(), "v2".islower(), "V2".islower()    # (True, True, False)
      ```
    starter: |
      def revision_name(app, suffix):
          return f"{app}-{suffix}"
    checker:
      kind: python
      ast_rules:
        - id: typed_documented
          kind: requires_function
          name: revision_name
          typed: true
          docstring: true
          message: "Give revision_name type hints and a docstring."
      tests:
        - id: valid
          code: |
            assert revision_name("survey-topics", "model-v2") == "survey-topics-model-v2"
            assert revision_name("survey-topics", "r1") == "survey-topics-r1"
          message: "Join the app name and a valid suffix with a dash."
        - id: invalid
          code: |
            for bad in ["Model-v2", "2-model", "model-", "model--v2", "model_v2", "", "a" * 65]:
                try:
                    revision_name("survey-topics", bad)
                except ValueError:
                    continue
                raise AssertionError(f"no ValueError for {bad!r}")
          message: "Reject upper case, a leading digit, a trailing dash, two dashes in a row, other characters, empty and over 64 characters."
        - id: boundary
          code: |
            assert revision_name("app", "a" * 64) == "app-" + "a" * 64
          message: "64 characters is allowed."
    solution: |
      def revision_name(app: str, suffix: str) -> str:
          """A revision name, after checking the suffix rules.

          Args:
              app: Container app name.
              suffix: Revision suffix.

          Returns:
              "<app>-<suffix>".

          Raises:
              ValueError: If the suffix breaks a naming rule.
          """
          allowed = all(ch == "-" or (ch.isalnum() and ch.isascii() and not ch.isupper()) for ch in suffix)
          if (
              not suffix
              or len(suffix) > 64
              or not allowed
              or not suffix[0].isalpha()
              or not suffix[-1].isalnum()
              or "--" in suffix
          ):
              raise ValueError(f"invalid revision suffix: {suffix!r}")
          return f"{app}-{suffix}"
    seeded_bugs:
      - |
        def revision_name(app: str, suffix: str) -> str:
            """Misses the double-dash rule."""
            allowed = all(ch == "-" or (ch.isalnum() and ch.isascii() and not ch.isupper()) for ch in suffix)
            if not suffix or len(suffix) > 64 or not allowed or not suffix[0].isalpha() or not suffix[-1].isalnum():
                raise ValueError(f"invalid revision suffix: {suffix!r}")
            return f"{app}-{suffix}"
      - |
        def revision_name(app: str, suffix: str) -> str:
            """Off by one on the length."""
            allowed = all(ch == "-" or (ch.isalnum() and ch.isascii() and not ch.isupper()) for ch in suffix)
            if not suffix or len(suffix) >= 64 or not allowed or not suffix[0].isalpha() or not suffix[-1].isalnum() or "--" in suffix:
                raise ValueError(f"invalid revision suffix: {suffix!r}")
            return f"{app}-{suffix}"
    wrong_answers:
      - answer: |
          def revision_name(app: str, suffix: str) -> str:
              """Misses the double-dash rule."""
              allowed = all(ch == "-" or (ch.isalnum() and ch.isascii() and not ch.isupper()) for ch in suffix)
              if not suffix or len(suffix) > 64 or not allowed or not suffix[0].isalpha() or not suffix[-1].isalnum():
                  raise ValueError(f"invalid revision suffix: {suffix!r}")
              return f"{app}-{suffix}"
        triggers: invalid
    hints:
      - "Check each character: a dash, or a lower-case ASCII letter or digit."
      - "Then the first and last characters, and `\"--\" in suffix`."
      - "Length at most 64."
    explanation: |
      Checking the suffix before calling Azure gives a clear error in your own deploy script, instead of a failed deployment.

  - id: B27-L4-E6
    type: design
    difficulty: 4
    prompt: |
      Plan the Container Apps deployment of the survey classifier. Callers time out after 10 seconds, and loading the model takes 15.
    slots:
      - id: replicas
        label: Minimum replicas
        options:
          - {id: one, text: "--min-replicas 1, so one replica is always warm"}
          - {id: zero, text: "The default of 0, to pay nothing when idle"}
          - {id: ten, text: "--min-replicas 10, the maximum, at all times"}
        answer: one
      - id: secret
        label: The API key the service checks
        options:
          - {id: kv, text: "A Key Vault reference, passed as API_KEY=secretref:api-key"}
          - {id: plain, text: "A plain --env-vars value"}
          - {id: image, text: "A line in the Dockerfile"}
        answer: kv
      - id: probe
        label: Readiness probe
        options:
          - {id: http, text: "HTTP GET /health on port 8000"}
          - {id: tcp, text: "The default TCP check on port 8000"}
          - {id: none, text: "No readiness probe"}
        answer: http
    model_answer: |
      - One warm replica: a cold start of over 15 seconds would exceed the 10-second timeout.
      - The key stays in Key Vault and reaches the container as a secretref variable.
      - An HTTP readiness probe on /health keeps traffic away until the model has loaded.
    wrong_answers:
      - answer: {replicas: zero}
        feedback: "After an idle spell the first caller waits for a start plus a 15-second load, past the 10-second timeout."
      - answer: {replicas: ten}
        feedback: "Ten replicas around the clock costs far more than the timeout needs. One warm replica removes the cold start."
      - answer: {secret: plain}
        feedback: "A plain value shows in the command, the shell history and the app's settings."
      - answer: {secret: image}
        feedback: "Anything in the image is readable by anyone who can pull it, and rotating the key means rebuilding."
      - answer: {probe: tcp}
        feedback: "TCP passes as soon as uvicorn listens, 15 seconds before the model is ready."
      - answer: {probe: none}
        feedback: "Without readiness, traffic can reach a replica whose model is still loading."
    hints:
      - "Compare the load time with the caller's timeout."
      - "Where can a key live outside the image and the command?"
      - "Which probe knows when the model is ready?"
    explanation: |
      Each choice follows from one fact: the model needs 15 seconds, the caller waits 10, and the key must stay out of code and commands.

recap:
  - front: "az containerapp up --source ."
    back: "Creates the resource group, environment, Log Analytics and a registry, builds from the Dockerfile, deploys and prints the URL."
  - front: "Secrets in Container Apps"
    back: "--secrets name=value or a Key Vault reference; --env-vars NAME=secretref:name. A secret change needs a restart or a new revision."
  - front: "Probes"
    back: "Startup, liveness, readiness. HTTP passes on 200 to 399. The default with ingress is TCP, which passes before the model loads."
  - front: "Default scaling"
    back: "HTTP rule, 0 to 10 replicas, 10 concurrent requests each. Scale to zero costs nothing but adds a cold start."

