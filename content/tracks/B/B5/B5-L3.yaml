        triggers: empty
      - answer: |
          from dataclasses import dataclass
          from typing import Literal

          import pandas as pd

          Severity = Literal["CRITICAL", "WARN"]


          @dataclass(frozen=True)
          class QaResult:
              """One check outcome."""

              check: str
              severity: Severity
              passed: bool
              observed: float | None


          def run_checks(df: pd.DataFrame, min_rows: int, max_missing: float) -> list[QaResult]:
              """Guarded."""
              n = len(df)
              share = None if n == 0 else float(df["weight"].isna().sum()) / n
              return [
                  QaResult("min_rows", "CRITICAL", n >= min_rows, float(n)),
                  QaResult("missing_weight", "WARN", share is not None and share <= max_missing, share),
              ]


          def enforce(results: list[QaResult]) -> None:
              """Raises on any failure, WARN included."""
              failed = [r.check for r in results if not r.passed]
              if failed:
                  raise RuntimeError(f"checks failed: {failed}")
        triggers: enforce_warn
    hints:
      - "Compute n once. The share is None when n is 0."
      - "Build one QaResult per check. Use `share is not None and share <= max_missing`."
      - "enforce filters on severity == \"CRITICAL\" and not passed."
    explanation: |
      `run_checks` measures and never raises, so every result reaches the log. `enforce` decides, and only CRITICAL failures stop the run.

  - id: B5-L3-E5
    type: design
    difficulty: 4
    prompt: |
      Assign a severity to each check on a weekly brand-tracking run.
    slots:
      - id: grain
        label: "respondent_id is unique in the input"
        options: &sev
          - {id: critical, text: "CRITICAL"}
          - {id: warn, text: "WARN"}
        answer: critical
      - id: base
        label: "A brand's subgroup base is below 50"
        options: *sev
        answer: warn
      - id: weights_sum
        label: "Weights sum to the sample size within 0.1%"
        options: *sev
        answer: critical
      - id: missing
        label: "Share of missing age is above last month's level"
        options: *sev
        answer: warn
    model_answer: |
      - Duplicate respondents and broken weights make every figure wrong: CRITICAL.
      - A small base is a reporting flag, handled by suppression: WARN.
      - A rise in missing age is worth a look but does not invalidate the run: WARN.
    wrong_answers:
      - answer: {grain: warn}
        feedback: "Duplicates double-count respondents in every total. Nothing downstream is correct."
      - answer: {weights_sum: warn}
        feedback: "If weights do not sum to the sample, every weighted figure is off. Stop the run."
      - answer: {base: critical}
        feedback: "Small bases are expected in some cells. Flag and suppress them. Do not stop the whole run."
    hints:
      - "Does the failure make every output wrong?"
      - "Or does it affect one cell, handled by a known rule?"
      - "Grain and weights are foundations."
    explanation: |
      CRITICAL for failures that invalidate the whole output. WARN for local issues with a known handling rule.

recap:
  - front: "Where to validate"
    back: "At boundaries: after reading input, before writing output."
  - front: "CRITICAL vs WARN"
    back: "CRITICAL stops the run (raise). WARN records and continues."
  - front: "Order of QA operations"
    back: "Run every check, log all results, then raise if any CRITICAL failed."
  - front: "Two coding rules for checks"
    back: "Guard every division. Test for None with is None, never truthiness."

