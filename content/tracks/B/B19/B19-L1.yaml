            with pytest.raises(Exception):
                normalise([0.0, 0.0])
    wrong_answers:
      - answer: |
          import pytest


          def normalise(weights: list[float]) -> list[float]:
              """Scale weights so they sum to 1."""
              for i, w in enumerate(weights):
                  if w < 0:
                      raise ValueError(f"negative weight at index {i}")
              total = sum(weights)
              if total == 0:
                  raise ValueError("total weight is 0")
              return [w / total for w in weights]


          def test_negative_weight_raises() -> None:
              with pytest.raises(ValueError):
                  normalise([2.0, -1.0])


          def test_zero_total_raises() -> None:
              with pytest.raises(ValueError):
                  normalise([0.0, 0.0])
        triggers: catches_wrong_reason
      - answer: |
          import pytest


          def normalise(weights: list[float]) -> list[float]:
              """Scale weights so they sum to 1."""
              for i, w in enumerate(weights):
                  if w < 0:
                      raise ValueError(f"negative weight at index {i}")
              total = sum(weights)
              if total == 0:
                  raise ValueError("total weight is 0")
              return [w / total for w in weights]


          def test_negative_weight_raises() -> None:
              with pytest.raises(ValueError, match="negative weight"):
                  normalise([2.0, -1.0])


          def test_zero_total_raises() -> None:
              with pytest.raises(Exception):
                  normalise([0.0, 0.0])
        triggers: catches_zero_division
    hints:
      - "A try/except that ignores the 'no error' case passes for broken code."
      - "`with pytest.raises(ValueError, match=\"...\"):` around the call."
      - "Use `negative weight` and `total weight is 0` as the patterns."
    explanation: |
      `pytest.raises` fails when nothing is raised and lets other exception types through. `match` rules out a ValueError raised for the wrong reason.

  - id: B19-L1-E5
    type: order
    difficulty: 3
    prompt: |
      A test fails in CI. Put the steps to fix it in order.
    items:
      - {id: a, text: "Copy the failing test's node ID from the CI log."}
      - {id: b, text: "Run that one test locally: `pytest tests/test_share.py::test_zero_total`."}
      - {id: c, text: "Read the assertion output: the values on both sides and the call that produced them."}
      - {id: d, text: "Change the code until that test passes."}
      - {id: e, text: "Run `pytest --lf` to rerun every test that failed last time."}
      - {id: f, text: "Run the whole suite, then push."}
    answer: [a, b, c, d, e, f]
    wrong_answers:
      - answer: [a, b, d, c, e, f]
        feedback: "Read the failure before you change code. The assertion output often names the bug."
      - answer: [a, b, c, d, f, e]
        feedback: "`--lf` is the quick check before the full run, not after it."
    hints:
      - "Start from what CI tells you."
      - "Reproduce and read before you change anything."
      - "Widen the run step by step: one test, last failures, everything."
    explanation: |
      Reproduce the single failure, read pytest's output, fix, then widen the run: last failures first, the whole suite last.

recap:
  - front: "What pytest collects by default"
    back: "Files test_*.py or *_test.py, functions starting with test, and test methods in Test classes without __init__."
  - front: "Test that code raises the right error"
    back: "with pytest.raises(ValueError, match=\"pattern\"): call(). match searches the message with a regular expression."
  - front: "Run one test, or only failures"
    back: "pytest path::test_name for one test. -k expr selects by name. -x stops at the first failure. --lf reruns last failures."
  - front: "pytest exit codes"
    back: "0 all passed, 1 a test failed, 5 no tests collected."

claims:
  - claim: "Default collection: test_*.py and *_test.py files, test-prefixed functions, Test-prefixed classes without __init__ (with a PytestCollectionWarning)."
    status: verified
    source: "Run on pytest 9.2.0 in this repository's scratch environment."
  - claim: "pytest.raises fails with 'DID NOT RAISE' when nothing is raised, lets other exception types through, and raises AssertionError when match does not find the pattern."
    status: verified
    source: "Run on pytest 9.0.2 (Pyodide pin) and 9.2.0."
  - claim: "Exit codes 0, 1 and 5; -k, -x, --lf and node IDs; testpaths read from [tool.pytest.ini_options] and from [tool.pytest]."
    status: verified
    source: "Run on pytest 9.0.2 and 9.2.0."
