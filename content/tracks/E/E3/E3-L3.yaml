id: E3-L3
title: Works councils and consultation before people analytics or AI
concept: |
  A people analytics tool can be lawful under UK GDPR and still stall at go-live, because nobody consulted the people it watches. Consultation duties come from employment law, not data protection law, and they differ by country.

  **United Kingdom.** There is no general works council duty. Three sources still apply:

  - The ICO's **monitoring workers** guidance (October 2023) expects you to consult workers and their representatives before monitoring, unless there is a good reason not to.
  - UK GDPR **Article 35(9)** asks you, where appropriate, to seek the views of data subjects or their representatives in a DPIA.
  - Recognised trade unions, collective agreements, or an agreement under the **Information and Consultation of Employees Regulations 2004** can set formal duties. In Great Britain, since 6 April 2020, 2% of employees, at least 15, can request such an agreement in a firm of 50 or more.

  **EU countries** go further. A few examples:

  - **Germany**: the works council has a **co-determination** right over technical systems able to monitor behaviour or performance. Courts read this widely, so most HR software is in scope.
  - **France**: the works council (CSE) must be consulted before new technology goes live. Courts have suspended AI tools deployed early.
  - **Netherlands**: the works council has a **consent right** over personnel monitoring systems and rules on employee data.

  The **EU AI Act** adds a duty for employers to inform workers' representatives before using a **high-risk AI system**, which includes most hiring and promotion tools. The 2026 amendments moved those high-risk obligations to 2 December 2027. National duties apply now.

  Treat this as a map, not advice. Ask the employment lawyers in each country before go-live.
why_it_matters: |
  A firm rolled out an attrition-risk model to managers in France and Germany on the same day as the UK. In Germany, the works council had not agreed to it. In France, the works council had not given its opinion. Both sites switched the tool off within weeks. The UK pilot, where the team had consulted staff and recorded their views in the DPIA, kept running.
worked_example:
  language: python
  weak:
    code: |
      def needs_consultation(country):
          return country in ["DE", "FR", "NL"]
    annotations:
      - find: "return country in [\"DE\", \"FR\", \"NL\"]"
        note: "Hard-coded law ignores what the tool does, and says the UK never needs consultation."
      - find: "def needs_consultation(country):"
        note: "A yes or no does not say which body to consult."
  strong:
    code: |
      CONSULTATION_RULES = {
          "DE": {"body": "works council", "triggers": {"monitoring", "high_risk_ai"}},
          "FR": {"body": "CSE", "triggers": {"new_technology", "monitoring", "high_risk_ai"}},
          "UK": {"body": "workers and representatives", "triggers": {"monitoring"}},
      }


      def consult_before_go_live(sites: list[str], features: set[str]) -> list[tuple[str, str]]:
          """Each site's body to consult, from rules the employment lawyers maintain."""
          plan = []
          for country in sorted(set(sites)):
              rule = CONSULTATION_RULES.get(country)
              if rule is None:
                  raise ValueError(f"no consultation rule for {country}: ask the lawyers")
              if rule["triggers"] & features:
                  plan.append((country, rule["body"]))
          return plan
    annotations:
      - find: "CONSULTATION_RULES = {"
        note: "The rules are data the lawyers own. In production they load from a versioned file."
      - find: "if rule is None:"
        note: "An unknown country stops the plan. Silence would read as no duty."
      - find: "if rule[\"triggers\"] & features:"
        note: "What the tool does decides the duty, not the country alone."
  takeaway: |
    Consultation turns on what the tool does and where the people are. Keep the rules as data the lawyers own, and fail loudly on a country nobody has assessed.
exercises:
  - id: E3-L3-E1
    type: mcq
    difficulty: 1
    prompt: |
      Where does a duty to consult works councils about a people analytics tool come from?
    options:
      - {id: a, text: "Employment law in each country, alongside data protection law"}
      - {id: b, text: "Only from UK GDPR"}
      - {id: c, text: "Only from the EU AI Act"}
      - {id: d, text: "From the software vendor's terms"}
    answer: a
    wrong_answers:
      - answer: b
        feedback: "UK GDPR asks for views in a DPIA, where appropriate. Works council rights come from employment law."
      - answer: c
        feedback: "The AI Act adds a duty to inform, for high-risk AI. National employment law applies more widely."
      - answer: d
        feedback: "A vendor cannot create or remove a legal duty to consult."
    hints:
      - "Which kind of law creates works councils?"
      - "Does it differ by country?"
      - "Employment law, country by country."
    explanation: |
      Works council rights are employment law, and they differ by country. Data protection law adds its own expectations.

  - id: E3-L3-E2
    type: mcq
    difficulty: 2
    prompt: |
      A UK employer with no recognised union plans to monitor how often staff open the learning platform. What should it do about consultation?
    options:
      - {id: a, text: "Consult workers before monitoring, and record their views in the DPIA"}
      - {id: b, text: "Nothing, because the UK has no works council law"}
      - {id: c, text: "Ask each worker for consent instead"}
      - {id: d, text: "Wait until a worker complains"}
    answer: a
    reasons:
      - {id: r1, text: "ICO guidance expects consultation before monitoring, and Article 35(9) asks for data subjects' views where appropriate."}
      - {id: r2, text: "UK law gives every workforce a works council with a veto."}
    reason_answer: r1
    wrong_answers:
      - answer: b
        feedback: "No works council law does not mean no consultation. ICO guidance expects it before monitoring."
      - answer: c
        feedback: "Consent is a weak basis for employers. Consultation is a different step from a lawful basis."
      - answer: d
        feedback: "Consultation comes before monitoring starts."
      - answer: a|r2
        feedback: "Right action, wrong reason. The UK has no general works council duty. The duty here comes from ICO guidance and the DPIA."
    hints:
      - "What does the ICO expect before monitoring workers?"
      - "Where do workers' views get recorded?"
      - "ICO guidance and Article 35(9)."
    explanation: |
      The ICO expects consultation before monitoring unless there is good reason not to, and the DPIA records the views.

  - id: E3-L3-E3
    type: fill_gap
    difficulty: 2
    language: text
    prompt: |
      Complete the right each works council holds over a monitoring tool.
    template: |
      Germany: works council [[g1]] over systems able to monitor behaviour or performance.
      France: the [[g2]] must be consulted before new technology goes live.
      Netherlands: works council [[g3]] right over personnel monitoring systems.
    gaps:
      g1: {accepted: [co-determination, codetermination], case_sensitive: false}
      g2: {accepted: [CSE], case_sensitive: false}
      g3: {accepted: [consent], case_sensitive: false}
    wrong_answers:
      - answer: {g3: veto}
        feedback: "The Dutch right is a consent right: the decision needs the works council's consent before it takes effect."
    hints:
      - "Germany's right means the council decides with the employer."
      - "France's works council has a three-letter name."
      - "`co-determination`, `CSE`, `consent`."
    explanation: |
      Co-determination in Germany, CSE consultation in France, a consent right in the Netherlands.

  - id: E3-L3-E4
    type: write_function
    difficulty: 3
    language: python
    prompt: |
      Write `consult_before_go_live(sites: list[str], features: set[str], rules: dict[str, dict]) -> list[tuple[str, str]]`.

      `sites` lists the country codes where affected employees work, possibly with repeats. `features` names what the tool does, such as `"monitoring"`. `rules` maps a country code to `{"body": str, "triggers": set[str]}`.

      Return `(country, body)` for each distinct country whose triggers share at least one feature with the tool, sorted by country. Raise `ValueError` for a country that has no rule.
    primer: |
      `&` on two sets gives the items in both. An empty set is falsy:

      ```python
      {"red", "blue"} & {"blue", "green"}   # {"blue"}
      bool({"red"} & {"green"})             # False
      ```

      `dict.get(key)` returns `None` for a missing key instead of raising: `{"a": 1}.get("b")` is `None`.

      `sorted(set(items))` drops repeats and sorts: `sorted(set(["b", "a", "b"]))` is `["a", "b"]`.
    starter: |
      def consult_before_go_live(sites, features, rules):
          return [(c, rules[c]["body"]) for c in sites]
    checker:
      kind: python
      ast_rules:
        - id: typed_documented
          kind: requires_function
          name: consult_before_go_live
          typed: true
          docstring: true
          message: "Give `consult_before_go_live` type hints and a docstring."
      tests:
        - id: distinct_sorted
          code: |
            rules = {"NL": {"body": "works council", "triggers": {"monitoring"}}, "DE": {"body": "works council", "triggers": {"monitoring"}}}
            got = consult_before_go_live(["NL", "DE", "NL", "DE"], {"monitoring"}, rules)
            assert got == [("DE", "works council"), ("NL", "works council")], got
          message: "List each country once, sorted by country code."
        - id: plan
          code: |
            rules = {
                "DE": {"body": "works council", "triggers": {"monitoring"}},
                "FR": {"body": "CSE", "triggers": {"new_technology", "monitoring"}},
                "UK": {"body": "workers", "triggers": {"monitoring"}},
            }
            got = consult_before_go_live(["UK", "DE", "FR"], {"new_technology"}, rules)
            assert got == [("FR", "CSE")], got
            got = consult_before_go_live(["UK", "DE"], {"monitoring", "new_technology"}, rules)
            assert got == [("DE", "works council"), ("UK", "workers")], got
          message: "Include a country only when its triggers share a feature with the tool."
        - id: unknown_country
          code: |
            try:
                consult_before_go_live(["UK", "PL"], {"monitoring"}, {"UK": {"body": "workers", "triggers": {"monitoring"}}})
            except ValueError:
                pass
            else:
                raise AssertionError("no ValueError for a country with no rule")
          message: "Raise ValueError for a country with no rule. Silence would read as no duty."
        - id: no_features
          code: |
            rules = {"DE": {"body": "works council", "triggers": {"monitoring"}}}
            got = consult_before_go_live(["DE"], set(), rules)
            assert got == [], got
          message: "A tool with no triggering features needs no consultation entry."
    solution: |
      def consult_before_go_live(
          sites: list[str], features: set[str], rules: dict[str, dict]
      ) -> list[tuple[str, str]]:
          """The body to consult in each country before go-live.

          Args:
              sites: Country codes where affected employees work. Repeats are allowed.
              features: What the tool does, such as "monitoring".
              rules: Country code to {"body": str, "triggers": set[str]}.

          Returns:
              (country, body) for each distinct country the tool triggers, sorted by country.

          Raises:
              ValueError: If a country has no rule.
          """
          plan: list[tuple[str, str]] = []
          for country in sorted(set(sites)):
              rule = rules.get(country)
              if rule is None:
                  raise ValueError(f"no consultation rule for {country}")
              if rule["triggers"] & features:
                  plan.append((country, rule["body"]))
          return plan
    seeded_bugs:
      - |
        def consult_before_go_live(sites: list[str], features: set[str], rules: dict[str, dict]) -> list[tuple[str, str]]:
            """Skips countries with no rule, so silence reads as no duty."""
            plan = []
            for country in sorted(set(sites)):
                rule = rules.get(country)
                if rule is not None and rule["triggers"] & features:
                    plan.append((country, rule["body"]))
            return plan
      - |
        def consult_before_go_live(sites: list[str], features: set[str], rules: dict[str, dict]) -> list[tuple[str, str]]:
            """Ignores what the tool does."""
            plan = []
            for country in sorted(set(sites)):
                rule = rules.get(country)
                if rule is None:
                    raise ValueError(country)
                plan.append((country, rule["body"]))
            return plan
      - |
        def consult_before_go_live(sites: list[str], features: set[str], rules: dict[str, dict]) -> list[tuple[str, str]]:
            """Keeps repeats and the input order."""
            plan = []
            for country in sites:
                rule = rules.get(country)
                if rule is None:
                    raise ValueError(country)
                if rule["triggers"] & features:
                    plan.append((country, rule["body"]))
            return plan
    wrong_answers:
      - answer: |
          def consult_before_go_live(sites: list[str], features: set[str], rules: dict[str, dict]) -> list[tuple[str, str]]:
              """Skips countries with no rule, so silence reads as no duty."""
              plan = []
              for country in sorted(set(sites)):
                  rule = rules.get(country)
                  if rule is not None and rule["triggers"] & features:
                      plan.append((country, rule["body"]))
              return plan
        triggers: unknown_country
      - answer: |
          def consult_before_go_live(sites: list[str], features: set[str], rules: dict[str, dict]) -> list[tuple[str, str]]:
              """Ignores what the tool does."""
              plan = []
              for country in sorted(set(sites)):
                  rule = rules.get(country)
                  if rule is None:
                      raise ValueError(country)
                  plan.append((country, rule["body"]))
              return plan
        triggers: plan
      - answer: |
          def consult_before_go_live(sites: list[str], features: set[str], rules: dict[str, dict]) -> list[tuple[str, str]]:
              """Keeps repeats and the input order."""
              plan = []
              for country in sites:
                  rule = rules.get(country)
                  if rule is None:
                      raise ValueError(country)
                  if rule["triggers"] & features:
                      plan.append((country, rule["body"]))
              return plan
        triggers: distinct_sorted
    hints:
      - "Loop over the distinct countries in sorted order."
      - "Use `rules.get` and raise when the result `is None`."
      - "Add the country only when `rule[\"triggers\"] & features` is not empty."
    explanation: |
      Distinct sites in order, a loud failure for any unassessed country, and the tool's features decide each duty.

  - id: E3-L3-E5
    type: design
    difficulty: 4
    prompt: |
      Plan go-live for an attrition-risk model used by managers in the UK, Germany and France.
    slots:
      - id: when
        label: "When to consult"
        options:
          - {id: before, text: "Before go-live in each country, with time for the works councils' process"}
          - {id: after, text: "After launch, once managers find it useful"}
        answer: before
      - id: rollout
        label: "Roll-out"
        options:
          - {id: staged, text: "Country by country, as each consultation or agreement completes"}
          - {id: same_day, text: "All three countries on the same day"}
        answer: staged
      - id: record
        label: "Record"
        options:
          - {id: dpia, text: "Record each body's views and the outcome in the DPIA"}
          - {id: email, text: "Keep the emails in the project inbox"}
        answer: dpia
    model_answer: |
      - Consultation comes before use. A French court can suspend a tool deployed before the CSE gives its opinion.
      - Each country's process runs at its own pace, so the roll-out follows it.
      - The DPIA is where views of data subjects and representatives belong.
    wrong_answers:
      - answer: {when: after}
        feedback: "German co-determination and French consultation both come before use."
      - answer: {rollout: same_day}
        feedback: "One country's process can take months. A single date forces a launch before some consultations finish."
      - answer: {record: email}
        feedback: "The DPIA records views of data subjects and representatives. An inbox is not a record anyone will find."
    hints:
      - "Do works council rights apply before or after use?"
      - "Do the three processes finish on the same day?"
      - "Where does Article 35(9) put the views you gather?"
    explanation: |
      Consult before go-live, roll out as each country clears, and keep the views in the DPIA.
recap:
  - front: "UK consultation sources"
    back: "ICO monitoring workers guidance, Article 35(9) views in a DPIA, and any union or ICE agreement."
  - front: "Works council rights over monitoring tools"
    back: "Germany: co-determination. France: CSE consultation before new technology. Netherlands: consent right."
  - front: "EU AI Act and employers"
    back: "Inform workers' representatives before using a high-risk AI system. Those obligations now apply from 2 December 2027."
  - front: "What decides a consultation duty?"
    back: "What the tool does, and where the affected people work. Keep the rules as data the lawyers own."
claims:
  - claim: "The ICO published final guidance on monitoring workers on 3 October 2023. It expects employers to consult workers and their representatives before monitoring, unless there is a good reason not to."
    status: search-only
    source: "Baker McKenzie, Cooley and HFW summaries of the ICO guidance, seen through search results, November 2026."
  - claim: "UK GDPR Article 35(9): where appropriate, the controller shall seek the views of data subjects or their representatives on the intended processing."
    status: verified
    source: "https://www.legislation.gov.uk/eur/2016/679/article/35, checked 7 November 2026."
  - claim: "Since 6 April 2020, a request for information and consultation arrangements under the ICE Regulations 2004 needs 2% of employees, at least 15 and at most 2,500, in an undertaking with 50 or more employees. The Regulations cover Great Britain."
    status: verified
    source: "https://www.legislation.gov.uk/uksi/2004/3426/regulation/7 and schedule 1, checked 7 November 2026."
  - claim: "Section 87(1) no. 6 BetrVG gives German works councils co-determination over technical systems objectively able to monitor employees' behaviour or performance, read widely by the Federal Labour Court."
    status: search-only
    source: "Luther, GÖRG and Rödl commentary, seen through search results, November 2026."
  - claim: "French courts (Nanterre, 14 February 2025; Créteil, 15 July 2025) suspended AI tools deployed before the CSE was consulted under article L2312-8 of the Code du travail."
    status: search-only
    source: "CMS and CFDT reports of the rulings, seen through search results, November 2026."
  - claim: "Article 27(1)(k) and (l) of the Dutch Works Councils Act give the works council a consent right over rules on processing employee personal data and over personnel monitoring systems."
    status: search-only
    source: "Rendement and Responsible AI Platform summaries, seen through search results, November 2026."
  - claim: "AI Act Article 26(7) requires deployers who are employers to inform workers' representatives and affected workers before using a high-risk AI system at the workplace. The Digital Omnibus on AI, Regulation (EU) 2026/1744, moved the Annex III high-risk obligations to 2 December 2027."
    status: unverified
    source: "Article 26(7) text from the AI Act Service Desk, seen through search results. The Omnibus regulation number and dates come from secondary sources that disagree on the adoption month, November 2026."
