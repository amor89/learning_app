id: E2-L1
title: The DAMA wheel, eleven knowledge areas around governance

concept: |
  The **DAMA-DMBOK** (Data Management Body of Knowledge, second edition, revised in 2024) gives data teams a shared map. It splits data management into **eleven knowledge areas**, drawn as a wheel.

  **Data governance** sits at the hub. It decides and oversees how the other ten are run. DMBOK2 defines it as the exercise of authority and control, planning, monitoring and enforcement, over the management of data assets.

  The ten spokes, with a talent example for each:

  | Knowledge area | Talent example |
  | --- | --- |
  | Data architecture | Bronze, silver and gold layers for HR data |
  | Data modelling and design | The person, position and organisation entities |
  | Data storage and operations | Lakehouse tables, backups, retention jobs |
  | Data security | Masking salary and health fields |
  | Data integration and interoperability | Feeds from the HR system and the learning platform |
  | Document and content management | Contracts, review forms, scanned certificates |
  | Reference and master data | One golden record per person, job codes, grades |
  | Data warehousing and business intelligence | Headcount and attrition reports |
  | Metadata management | Glossary entries, lineage, owners |
  | Data quality | Rules for missing managers or duplicate employee IDs |

  Two pairs get confused. **Reference data** is a controlled list of codes, such as grades or country codes. **Master data** is the agreed record of a core entity, such as the person. **Metadata** describes data: definitions, owners, lineage. **Master data** is the data itself.

  The wheel is a checklist, not an org chart. A talent platform touches all eleven areas. When something breaks, name the area first, then the owner. A duplicate employee is a master data problem, not a reporting bug.

why_it_matters: |
  A firm's headcount report disagreed with payroll by 312 people. The BI team spent six weeks tuning report filters. The cause was in master data: contractors re-hired through an agency got a second employee ID, and nothing matched them to their first record. Naming the knowledge area on day one would have sent the problem to the master data owner.

worked_example:
  language: yaml
  weak:
    code: |
      # Issue log, talent platform
      - issue: headcount differs from payroll by 312
        owner: BI team
        fix: adjust the report filter
    annotations:
      - find: "owner: BI team"
        note: "The report shows the symptom. The cause sits in another knowledge area."
      - find: "fix: adjust the report filter"
        note: "Fixing the symptom hides the duplicate records from every other consumer."
  strong:
    code: |
      # Issue log, talent platform
      - issue: headcount differs from payroll by 312
        knowledge_area: reference and master data
        root_cause: re-hired contractors get a second employee ID
        owner: people master data owner
        fix: match rule on national insurance number and date of birth, then merge
    annotations:
      - find: "knowledge_area: reference and master data"
        note: "Name the area first. It points at the right owner."
      - find: "owner: people master data owner"
        note: "Governance names an owner for each area and domain."
  takeaway: |
    Name the knowledge area before you name the fix. Governance at the hub assigns an owner to each area, so problems reach the person who can solve them.

exercises:
  - id: E2-L1-E1
    type: mcq
    difficulty: 1
    prompt: |
      Which knowledge area sits at the hub of the DAMA wheel?
    options:
      - {id: a, text: "Data architecture"}
      - {id: b, text: "Data governance"}
      - {id: c, text: "Data quality"}
      - {id: d, text: "Metadata management"}
    answer: b
    wrong_answers:
      - answer: a
        feedback: "Architecture is one of the ten spokes."
      - answer: c
        feedback: "Data quality is a spoke. Governance decides the quality rules and who owns them."
      - answer: d
        feedback: "Metadata management is a spoke."
    hints:
      - "One area decides and oversees how the others run."
      - "It holds authority and control over data assets."
      - "Data governance."
    explanation: |
      Data governance sits at the hub and directs the ten other knowledge areas.

  - id: E2-L1-E2
    type: mcq
    difficulty: 2
    prompt: |
      Re-hired contractors get a second employee ID, so headcount is overstated. Which knowledge area owns the root cause?
    options:
      - {id: a, text: "Data warehousing and business intelligence"}
      - {id: b, text: "Reference and master data"}
      - {id: c, text: "Document and content management"}
      - {id: d, text: "Data storage and operations"}
    answer: b
    reasons:
      - {id: r1, text: "Master data keeps one agreed record per core entity, such as a person."}
      - {id: r2, text: "Reference data controls the format of employee IDs."}
    reason_answer: r1
    wrong_answers:
      - answer: a
        feedback: "The report shows the symptom. The duplicate person records cause it."
      - answer: c
        feedback: "Documents are not involved. The problem is two records for one person."
      - answer: d
        feedback: "Storage holds the rows. The rule that decides which rows are the same person belongs to master data."
      - answer: b|r2
        feedback: "Right area, wrong reason. Reference data is a list of codes. One record per person is master data."
    hints:
      - "Where is the problem: the report or the records?"
      - "Which area keeps one golden record per person?"
      - "Reference and master data."
    explanation: |
      Duplicate people are a master data problem. The report only exposes them.

  - id: E2-L1-E3
    type: fill_gap
    difficulty: 2
    language: text
    prompt: |
      Complete the two definitions that are easy to confuse.
    template: |
      [[g1]] data: a controlled list of codes, such as grades or country codes
      [[g2]]: data about data, such as definitions, owners and lineage
    gaps:
      g1: {accepted: [Reference], case_sensitive: false}
      g2: {accepted: [Metadata], case_sensitive: false}
    wrong_answers:
      - answer: {g1: Master}
        feedback: "Master data is the agreed record of a core entity, such as a person. A list of codes is reference data."
    hints:
      - "One is a list of allowed values."
      - "The other describes data rather than being data."
      - "`Reference`, then `Metadata`."
    explanation: |
      Reference data lists allowed codes. Metadata describes data. Master data is the agreed record itself.

  - id: E2-L1-E4
    type: design
    difficulty: 3
    prompt: |
      Send each talent data problem to its knowledge area.
    slots:
      - id: salary
        label: "Analysts can read salaries they should not see"
        options:
          - {id: security, text: "Data security"}
          - {id: quality, text: "Data quality"}
          - {id: bi, text: "Data warehousing and business intelligence"}
        answer: security
      - id: definition
        label: "Two teams define 'active employee' differently"
        options:
          - {id: metadata, text: "Metadata management, through the business glossary"}
          - {id: storage, text: "Data storage and operations"}
          - {id: architecture, text: "Data architecture"}
        answer: metadata
      - id: missing
        label: "12% of records have no manager"
        options:
          - {id: quality, text: "Data quality"}
          - {id: security, text: "Data security"}
          - {id: document, text: "Document and content management"}
        answer: quality
    model_answer: |
      - Access to salary is a data security question: masking and roles.
      - A shared definition lives in the glossary, part of metadata management.
      - Missing managers break a completeness rule, owned by data quality.
    wrong_answers:
      - answer: {salary: quality}
        feedback: "The salaries are correct. The problem is who can see them."
      - answer: {definition: architecture}
        feedback: "Layers will not settle a definition. The glossary does."
      - answer: {missing: security}
        feedback: "Nothing is exposed. Records are incomplete, which is a quality rule."
    hints:
      - "Ask what kind of failure each one is: access, meaning or completeness."
      - "Where do agreed definitions live?"
      - "Completeness is a data quality dimension."
    explanation: |
      Naming the area first sends each problem to an owner who can fix it.

  - id: E2-L1-E5
    type: design
    difficulty: 4
    prompt: |
      You start a new governance role on a talent platform. Choose how to use the DAMA wheel in your first month.
    slots:
      - id: scope
        label: "Scope"
        options:
          - {id: all, text: "Map all eleven areas to the six talent domains, then pick where to start"}
          - {id: one, text: "Start with the area you know best and add others later"}
        answer: all
      - id: owners
        label: "Owners"
        options:
          - {id: named, text: "Find a named owner per area and domain, and mark the gaps"}
          - {id: team, text: "Make the data platform team the owner of every area"}
        answer: named
      - id: use
        label: "How the wheel is used"
        options:
          - {id: checklist, text: "As a checklist for scope and for routing issues"}
          - {id: org, text: "As the new org chart, one team per area"}
        answer: checklist
    model_answer: |
      - A full map first shows where the risk sits, not where you are comfortable.
      - Named owners per area and domain turn the map into accountability. Gaps are findings.
      - The wheel is a checklist. Teams can own several areas.
    wrong_answers:
      - answer: {scope: one}
        feedback: "Starting where you are comfortable can leave the riskiest area unseen."
      - answer: {owners: team}
        feedback: "A platform team cannot own the meaning of HR data. Business owners must."
      - answer: {use: org}
        feedback: "The wheel organises knowledge, not people."
    hints:
      - "Breadth first, then depth."
      - "Who can decide what a field means?"
      - "Is the wheel about knowledge or about teams?"
    explanation: |
      Map all areas, name owners, and use the wheel to route work, not to reorganise people.

recap:
  - front: "DAMA wheel"
    back: "Data governance at the hub, ten knowledge areas around it. DMBOK2, revised in 2024."
  - front: "DMBOK2 definition of data governance"
    back: "The exercise of authority and control (planning, monitoring and enforcement) over the management of data assets."
  - front: "Reference data, master data, metadata"
    back: "Reference: lists of codes. Master: the agreed record of a core entity. Metadata: data about data."
  - front: "First move on any data problem"
    back: "Name the knowledge area, then its owner, then the fix."

claims:
  - claim: "DAMA-DMBOK2 has eleven knowledge areas with data governance at the centre of the wheel: data architecture, data modelling and design, data storage and operations, data security, data integration and interoperability, document and content management, reference and master data, data warehousing and business intelligence, metadata management and data quality. A 2024 revision kept the framework and areas."
    status: search-only
    source: "Secondary summaries (Dawiso glossary, OvalEdge, a reproduced DMBOK2 table of contents), seen through search results, November 2026. www.dama.org was not reachable from the build environment, and the book was not checked."
  - claim: "DMBOK2 section 3.1 (p. 67) defines data governance as the exercise of authority and control (planning, monitoring, and enforcement) over the management of data assets. The older DAMA Dictionary adds 'shared decision making'."
    status: search-only
    source: "Government of Canada GCcollab wiki 'Data Governance' citing DMBOK2, and Perficient (2012) citing the DAMA Dictionary, seen through search results, November 2026."
