id: E2-L3
title: Governance at the hub, decision rights, policies and escalation

concept: |
  Governance and management are different jobs. **Data governance** decides and oversees: who may decide what, which rules apply, and whether they are followed. **Data management** does the work: builds the pipelines, runs the quality checks, grants the access. DMBOK2 frames governance as setting decision rights over data. A platform team that both writes the rules and marks its own work has no oversight.

  Start with **decision rights**. For each kind of decision, name who decides:

  - what a term means, such as "active employee" or "regretted leaver"
  - who may see a field, such as salary or a performance rating
  - what quality threshold a dataset must meet before it is published
  - whether a new use of data goes ahead

  Then write the rules at three levels:

  - A **policy** says what must be true, and why. "Access to performance data follows the principle of least privilege."
  - A **standard** makes it measurable. "Ratings are masked for every role except HR business partners and the employee's own line chain."
  - A **procedure** says how. "Request access through the form. The data owner approves within five working days."

  Policies change rarely and need senior sign-off. Standards change when the platform does. Procedures change often.

  Finally, an **escalation path**. Most issues end with a data steward. Those that cross domains, or set precedent, go to the data owner, then to a governance council. Each decision is written down in a decision log (lesson B18-L3), so the next person finds the reason, not only the rule.

  GOV-02 in your EY role plan turns these rights into a RACI.

why_it_matters: |
  Two directors argued for a quarter over whether contractors counted in "headcount". The data team changed the dashboard each time one of them complained. Nobody had the right to decide, so the definition flipped four times and trust in every people report fell. A named decision owner and one log entry settled it in a week.

worked_example:
  language: yaml
  weak:
    code: |
      # Governance, talent platform
      rules: the data platform team decides and enforces everything
      access_rule: be careful with sensitive data
      disputes: raise in the weekly team meeting
    annotations:
      - find: "rules: the data platform team decides and enforces everything"
        note: "The same team writes the rules and marks its own work. No oversight."
      - find: "access_rule: be careful with sensitive data"
        note: "Not measurable. Nobody can test it."
      - find: "disputes: raise in the weekly team meeting"
        note: "No owner, no record, so the same dispute comes back."
  strong:
    code: |
      # Governance, talent platform
      decision_rights:
        definitions: {decides: data owner per domain, advises: data steward}
        access_to_performance_data: {decides: performance data owner}
      policy: POL-07 least privilege for performance data
      standard: STD-07 ratings masked except HR business partners and line chain
      procedure: PRC-07 request form, owner approves within 5 working days
      escalation: [data steward, data owner, governance council]
      decisions: logged in DEC-LOG with the reason and the date
    annotations:
      - find: "definitions: {decides: data owner per domain, advises: data steward}"
        note: "One named decider per kind of decision."
      - find: "standard: STD-07 ratings masked except HR business partners and line chain"
        note: "The standard makes the policy testable."
      - find: "escalation: [data steward, data owner, governance council]"
        note: "A fixed path, so disputes end with a decision."
  takeaway: |
    Separate deciding from doing. Name a decider for each kind of decision, write rules as policy, standard and procedure, and log each decision with its reason.

exercises:
  - id: E2-L3-E1
    type: mcq
    difficulty: 1
    prompt: |
      Which of these is a data governance activity rather than a data management one?
    options:
      - {id: a, text: "Running the nightly quality checks"}
      - {id: b, text: "Deciding who may approve access to salary data"}
      - {id: c, text: "Building the silver layer for learning records"}
      - {id: d, text: "Granting a role in a workspace"}
    answer: b
    wrong_answers:
      - answer: a
        feedback: "Running checks is doing the work. Governance sets the thresholds and who owns them."
      - answer: c
        feedback: "Building a layer is management. Governance sets the rules it must meet."
      - answer: d
        feedback: "Granting is management. Governance decides who may approve the grant."
    hints:
      - "Governance decides. Management does."
      - "Which option sets a decision right?"
      - "Who may approve access."
    explanation: |
      Deciding who holds a decision right is governance. Running, building and granting are management.

  - id: E2-L3-E2
    type: mcq
    difficulty: 2
    prompt: |
      Which statement is a standard, not a policy or a procedure?
    options:
      - {id: a, text: "Access to performance data follows least privilege."}
      - {id: b, text: "Ratings are masked for every role except HR business partners and the line chain."}
      - {id: c, text: "Request access through the form, and the owner approves within five working days."}
      - {id: d, text: "Be careful with sensitive data."}
    answer: b
    reasons:
      - {id: r1, text: "A standard makes a policy measurable, so you can test whether it holds."}
      - {id: r2, text: "A standard says who signs it off."}
    reason_answer: r1
    wrong_answers:
      - answer: a
        feedback: "That is the policy: what must be true, and why."
      - answer: c
        feedback: "That is a procedure: how to do it."
      - answer: d
        feedback: "That is advice. Nobody can test it."
      - answer: b|r2
        feedback: "Right answer, wrong reason. A standard is defined by being measurable, not by who signs it."
    hints:
      - "Which one could a test check?"
      - "Policy says what, standard makes it measurable, procedure says how."
      - "The masking rule."
    explanation: |
      The masking rule is measurable: you can test which roles see unmasked ratings. That makes it a standard.

  - id: E2-L3-E3
    type: fill_gap
    difficulty: 2
    language: text
    prompt: |
      Complete the three levels of rules.
    template: |
      [[g1]]: what must be true, and why. Changes rarely, senior sign-off.
      [[g2]]: makes it measurable. Changes when the platform does.
      [[g3]]: how to do it. Changes often.
    gaps:
      g1: {accepted: [Policy], case_sensitive: false}
      g2: {accepted: [Standard], case_sensitive: false}
      g3: {accepted: [Procedure], case_sensitive: false}
    wrong_answers:
      - answer: {g1: Standard, g2: Policy}
        feedback: "The policy states the intent. The standard makes it measurable."
    hints:
      - "The top level states intent."
      - "The middle level can be tested."
      - "`Policy`, `Standard`, `Procedure`."
    explanation: |
      Policy, standard and procedure separate intent, measure and method, so each changes at its own pace.

  - id: E2-L3-E4
    type: order
    difficulty: 3
    prompt: |
      A dispute over what "regretted leaver" means affects two domains. Put the escalation steps in order.
    items:
      - {id: steward, text: "The data steward gathers the definitions in use and their impact"}
      - {id: owner, text: "The data owners of both domains try to agree"}
      - {id: council, text: "Without agreement, the governance council decides"}
      - {id: log, text: "Record the decision and its reason in the decision log"}
      - {id: glossary, text: "Update the glossary entry and tell the report owners"}
    answer: [steward, owner, council, log, glossary]
    wrong_answers:
      - answer: [council, steward, owner, log, glossary]
        feedback: "Start at the lowest level that can resolve it. The council is the last resort."
      - answer: [steward, owner, council, glossary, log]
        feedback: "Log the decision first, so the glossary change points to its reason."
    hints:
      - "Who gathers the facts?"
      - "Who decides when owners disagree?"
      - "Record before you publish."
    explanation: |
      Steward, owners, council if needed, then the log, then the glossary and the people affected.

  - id: E2-L3-E5
    type: design
    difficulty: 4
    prompt: |
      Set up governance for the talent platform's first domain, performance data.
    slots:
      - id: decider
        label: "Who decides what a performance rating means"
        options:
          - {id: owner, text: "The performance data owner, a named HR leader, advised by a steward"}
          - {id: platform, text: "The data platform team, because it builds the tables"}
        answer: owner
      - id: rule
        label: "The access rule"
        options:
          - {id: layered, text: "A least-privilege policy, a masking standard and an access procedure"}
          - {id: guidance, text: "Guidance to be careful with ratings"}
        answer: layered
      - id: disputes
        label: "Disputes"
        options:
          - {id: path, text: "Steward, owner, governance council, with every decision logged"}
          - {id: meeting, text: "Raised in the weekly platform meeting"}
        answer: path
    model_answer: |
      - The business owns meaning. The platform team builds what the owner decides.
      - Three levels of rules make access testable and changeable at the right pace.
      - A fixed path with a log ends disputes for good.
    wrong_answers:
      - answer: {decider: platform}
        feedback: "Building a table does not give the right to define a rating. That belongs to the business owner."
      - answer: {rule: guidance}
        feedback: "Guidance cannot be tested or enforced."
      - answer: {disputes: meeting}
        feedback: "Without an owner and a log, the same dispute returns."
    hints:
      - "Who owns the meaning of HR data?"
      - "Which option can be tested?"
      - "Which option ends a dispute for good?"
    explanation: |
      Named owners, layered rules and a logged escalation path turn governance from advice into decisions.

recap:
  - front: "Governance against management"
    back: "Governance decides and oversees. Management does the work."
  - front: "Decision rights to name first"
    back: "Definitions, access to sensitive fields, quality thresholds, and new uses of data."
  - front: "Policy, standard, procedure"
    back: "Policy: what and why. Standard: measurable. Procedure: how. Each changes at its own pace."
  - front: "Escalation path"
    back: "Data steward, data owner, governance council. Log every decision with its reason."

claims:
  - claim: "DMBOK2 frames data governance as authority and control over data management, establishing decision rights over data."
    status: search-only
    source: "GCcollab wiki 'Data Governance' citing DMBOK2 section 3.1, and summaries of DMBOK2 chapter 3, seen through search results, November 2026."
  - claim: "Policy, standard and procedure as three levels of rules, and the steward, owner, council escalation path, are common governance practice, not quotations from DMBOK2."
    status: unverified
    source: "General practice. Not attributed to a specific DMBOK2 passage."
