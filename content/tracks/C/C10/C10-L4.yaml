    back: "The number in its name: F2 has 2, F64 has 64. Trial capacity has 64."
  - front: "Budget per 30-second window"
    back: "CUs times 30. An F64 has 1,920 CU-seconds per window."
  - front: "The F64 licence floor"
    back: "Below F64, every Power BI viewer needs Pro or PPU. From F64, free-licence users with a viewer role can view."
  - front: "Sizing method"
    back: "Trial, read the peak in the Metrics app, pick the smallest SKU covering peak plus headroom, scale and check."
