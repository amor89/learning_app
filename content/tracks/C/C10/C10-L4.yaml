    status: verified
    source: "https://learn.microsoft.com/en-us/fabric/enterprise/licenses (ms.date 2026-06-15)"
  - claim: "Capacity planning uses 30-second windows (CUs x 30); the method is trial, Metrics app utilisation and timepoint pages, scale up, recheck; the Fabric SKU Estimator is in preview."
