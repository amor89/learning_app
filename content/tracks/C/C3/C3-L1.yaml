id: C3-L1
title: OneLake shortcuts, and the delete that goes through

concept: |
  A **shortcut** is a folder in a lakehouse (or KQL database) that points to data somewhere else. It behaves like a symbolic link. The target can be inside OneLake, such as a table in another workspace, or outside it: ADLS Gen2, Azure Blob Storage, Amazon S3 and S3-compatible storage, Google Cloud Storage, Dataverse, OneDrive or SharePoint.

  Shortcuts let every Fabric engine read the data **without copying it**. OneLake handles the connection and credentials, so each workload does not need its own.

  Where you create the shortcut matters:

  - Under **Tables**, point it at Delta data. The lakehouse recognises the folder as a table, and the SQL analytics endpoint and Direct Lake can use it.
  - Under **Files**, it can point at data in any format.

  **Deletes are the trap.** Microsoft Learn states the rule plainly:

  - Deleting the **shortcut itself** deletes only the shortcut. The target data stays.
  - Deleting a **file or folder inside** the shortcut deletes it **in the target**, if your identity has write permission there.

  So a clean-up notebook that runs `rm -r` on `Files/partner_feed/2025/` removes the partner's 2025 files from their storage account, not a local copy.

  Other points from Learn (checked September 2026):

  - Moving, renaming or deleting the target breaks the shortcut. Broken shortcuts appear in the Unidentified area.
  - For external shortcuts you can turn on **caching**. OneLake keeps files it has read for 1 to 28 days, which cuts cross-cloud egress costs.
  - With Direct Lake over SQL or T-SQL in delegated identity mode, the calling user's identity is not passed through to the target. Check which identity reaches the source before relying on its permissions.

why_it_matters: |
  A lakehouse held a shortcut `Files/finance_share` to a folder in the finance team's storage account. An analyst ran a notebook to free up space: it deleted every subfolder older than two years under `Files/`. Their identity had write access to the finance account for another project. Seven years of finance exports disappeared from the source. The storage account had no soft delete, and the files were gone.

worked_example:
  language: pyspark
  weak:
    code: |
      for path in notebookutils.fs.ls("Files/"):
          if path.name.startswith("2023"):
              notebookutils.fs.rm(path.path, True)
    annotations:
      - find: 'for path in notebookutils.fs.ls("Files/"):'
        note: "Walks every folder under Files, shortcuts included."
      - find: "notebookutils.fs.rm(path.path, True)"
        note: "Recursive delete inside a shortcut deletes the target data, if the identity can write there."
  strong:
    code: |
      OWNED_PREFIXES = ("Files/landing/", "Files/tmp/")


      def safe_to_delete(path: str, shortcut_roots: set[str]) -> bool:
          """True only for paths this lakehouse owns, never under a shortcut."""
          if any(path == root or path.startswith(root.rstrip("/") + "/") for root in shortcut_roots):
              return False
          return path.startswith(OWNED_PREFIXES)
    annotations:
      - find: 'OWNED_PREFIXES = ("Files/landing/", "Files/tmp/")'
        note: "An allowlist of folders this lakehouse owns."
      - find: "if any(path == root or path.startswith(root.rstrip(\"/\") + \"/\") for root in shortcut_roots):"
        note: "Anything under a shortcut is refused, whatever its name."
  takeaway: |
    Shortcuts save copies. Treat every path under a shortcut as someone else's data.

exercises:
  - id: C3-L1-E1
    type: mcq
    difficulty: 1
    prompt: |
      `Files/partner_feed` is a shortcut to an ADLS Gen2 folder. You delete the shortcut `Files/partner_feed` itself. What happens to the data in ADLS?
    options:
      - {id: a, text: "It is deleted too."}
      - {id: b, text: "It stays. Deleting a shortcut deletes only the shortcut object."}
      - {id: c, text: "It is moved to the lakehouse recycle bin."}
      - {id: d, text: "It is copied into OneLake before the shortcut goes."}
    answer: b
    reasons:
      - {id: r1, text: "Shortcuts do not cascade deletes. The shortcut is an independent object."}
      - {id: r2, text: "ADLS data can never be deleted from Fabric."}
    reason_answer: r1
    wrong_answers:
      - answer: a
        feedback: "Removing the shortcut removes only the link. Deleting files inside it is what reaches the target."
      - answer: c
        feedback: "There is no copy to recycle. The data was never in OneLake."
      - answer: d
        feedback: "Nothing is copied when you delete a shortcut."
      - answer: b|r2
        feedback: "Right answer, wrong reason. Deleting files inside a shortcut can delete ADLS data."
    hints:
      - "Is the shortcut the data or a pointer?"
      - "What does removing a pointer do?"
      - "Contrast it with deleting inside the pointer."
    explanation: |
      The shortcut goes, the data stays. Deleting a file or folder inside the shortcut is different.

  - id: C3-L1-E2
    type: mcq
    difficulty: 2
    prompt: |
      Your identity has write access to the target storage. You delete `Files/partner_feed/2023/` where `partner_feed` is a shortcut. What happens?
    options:
      - {id: a, text: "Only the lakehouse view of 2023 is hidden."}
      - {id: b, text: "The 2023 folder is deleted in the target storage account."}
      - {id: c, text: "The delete fails: shortcuts are read-only."}
      - {id: d, text: "The shortcut breaks, but the data stays."}
    answer: b
    reasons:
      - {id: r1, text: "Deleting a file or folder within a shortcut deletes it in the target when you have permission there."}
      - {id: r2, text: "Fabric syncs deletes back every night."}
    reason_answer: r1
    wrong_answers:
      - answer: a
        feedback: "There is no hidden view. The folder is the target folder."
      - answer: c
        feedback: "Shortcuts are not read-only when your identity can write to the target."
      - answer: d
        feedback: "The shortcut still works. It just points at data that no longer includes 2023."
      - answer: b|r2
        feedback: "Right answer, wrong reason. The delete happens immediately, not on a schedule."
    hints:
      - "Where do the files inside a shortcut live?"
      - "In the target."
      - "Your permissions there decide."
    explanation: |
      Inside a shortcut you are working on the target. Deletes go through.

  - id: C3-L1-E3
    type: fill_gap
    difficulty: 2
    language: text
    prompt: |
      Complete the rule for where to create a shortcut so the SQL analytics endpoint sees it as a table.
    template: |
      Create the shortcut under [[g1]], pointing at data in [[g2]] format.
    gaps:
      g1: {accepted: [Tables]}
      g2: {accepted: [Delta]}
    wrong_answers:
      - answer: {g1: Files}
        feedback: "Shortcuts under Files can hold any format, but they do not become tables."
    hints:
      - "Which area holds managed tables?"
      - "Which format does the endpoint read?"
      - "Tables and Delta."
    explanation: |
      A shortcut under Tables that points at Delta data is recognised as a table.

  - id: C3-L1-E4
    type: write_function
    difficulty: 3
    language: python
    prompt: |
      Write `safe_to_delete(path: str, shortcut_roots: set[str]) -> bool` for a clean-up job. Return `False` if `path` is a shortcut root or lies under one. Otherwise return `True` only if it starts with `"Files/landing/"` or `"Files/tmp/"`. Treat `"Files/partner"` and `"Files/partner_old/x"` as different folders.
    starter: |
      def safe_to_delete(path, shortcut_roots):
          return path.startswith("Files/")
    checker:
      kind: python
      ast_rules:
        - id: typed_documented
          kind: requires_function
          name: safe_to_delete
          typed: true
          docstring: true
          message: "Give `safe_to_delete` type hints and a docstring."
      tests:
        - id: shortcuts_blocked
          code: |
            roots = {"Files/partner", "Files/landing/finance_share"}
            assert safe_to_delete("Files/partner/2023/a.csv", roots) is False
            assert safe_to_delete("Files/landing/finance_share/x.csv", roots) is False
            assert safe_to_delete("Files/partner", roots) is False
          message: "Anything at or under a shortcut root must be refused."
        - id: owned_allowed
          code: |
            assert safe_to_delete("Files/landing/w14.csv", {"Files/partner"}) is True
            assert safe_to_delete("Files/tmp/scratch.parquet", set()) is True
          message: "Paths under Files/landing/ or Files/tmp/ that are not under a shortcut are safe."
        - id: prefix_trap
          code: |
            assert safe_to_delete("Files/partner_old/x", {"Files/partner"}) is False
            assert safe_to_delete("Files/landing_old/x", set()) is False
          message: "Match whole folder names: Files/partner does not contain Files/partner_old, and Files/landing_old is not owned."
    solution: |
      OWNED_PREFIXES = ("Files/landing/", "Files/tmp/")


      def safe_to_delete(path: str, shortcut_roots: set[str]) -> bool:
          """True only for owned paths that are not under a shortcut.

          Args:
              path: Lakehouse-relative path, such as Files/landing/w14.csv.
              shortcut_roots: Paths of every shortcut in the lakehouse.

          Returns:
              Whether a clean-up job may delete the path.
          """
          for root in shortcut_roots:
              base = root.rstrip("/")
              if path == base or path.startswith(base + "/"):
                  return False
          return path.startswith(OWNED_PREFIXES)
    seeded_bugs:
      - |
        def safe_to_delete(path: str, shortcut_roots: set[str]) -> bool:
            """Plain prefix match on shortcut roots."""
            if any(path.startswith(root) for root in shortcut_roots):
                return False
            return path.startswith(("Files/landing", "Files/tmp"))
      - |
        def safe_to_delete(path: str, shortcut_roots: set[str]) -> bool:
            """Ignores shortcuts."""
            return path.startswith(("Files/landing/", "Files/tmp/"))
    wrong_answers:
      - answer: |
          def safe_to_delete(path: str, shortcut_roots: set[str]) -> bool:
              """Ignores shortcuts."""
              return path.startswith(("Files/landing/", "Files/tmp/"))
        triggers: shortcuts_blocked
    hints:
      - "Check shortcuts first and refuse early."
      - "Compare against root + \"/\" so partner does not match partner_old."
      - "Allowlist owned prefixes with the trailing slash."
    explanation: |
      Refusing anything under a shortcut, and allowing only named folders, makes a clean-up job unable to reach someone else's data.

  - id: C3-L1-E5
    type: design
    difficulty: 4
    prompt: |
      Marketing's campaign data lives in an S3 bucket, updated daily. Your lakehouse needs it for Spark and SQL. Choose the set-up.
    slots:
      - id: access
        label: "How the data reaches the lakehouse"
        options:
          - {id: shortcut, text: "An S3 shortcut"}
          - {id: copy, text: "A nightly copy pipeline into Files"}
        answer: shortcut
      - id: location
        label: "Where the shortcut sits, given the data is Delta"
        options:
          - {id: tables, text: "Under Tables"}
          - {id: files, text: "Under Files"}
        answer: tables
      - id: cost
        label: "Cross-cloud reads"
        options:
          - {id: cache, text: "Turn on shortcut caching"}
          - {id: off_, text: "Leave caching off"}
        answer: cache
      - id: writes
        label: "Identity used by the connection"
        options:
          - {id: read_only, text: "A read-only identity on the bucket"}
          - {id: owner, text: "An identity with full write access"}
        answer: read_only
    model_answer: |
      - A shortcut avoids a second copy and a pipeline to maintain.
      - Under Tables, Delta data becomes a table for SQL and Direct Lake.
      - Caching cuts egress costs for repeated reads from S3.
      - A read-only identity means no delete inside the shortcut can reach the bucket.
    wrong_answers:
      - answer: {access: copy}
        feedback: "A copy doubles storage and needs a pipeline and monitoring. A shortcut reads in place."
      - answer: {writes: owner}
        feedback: "With write access, deleting inside the shortcut deletes marketing's data."
      - answer: {location: files}
        feedback: "Under Files it will not be recognised as a table."
    hints:
      - "Copy or point?"
      - "Where do shortcuts become tables?"
      - "What stops a delete from going through?"
    explanation: |
      Point, place it where it becomes a table, cache cross-cloud reads, and connect read-only.

recap:
  - front: "What a shortcut is"
    back: "A folder that points to data in OneLake or external storage, without copying it."
  - front: "Delete the shortcut vs delete inside it"
    back: "Deleting the shortcut keeps the data. Deleting files inside it deletes them in the target, if you can write there."
  - front: "Shortcut as a table"
    back: "Create it under Tables, pointing at Delta data."
  - front: "External shortcut caching"
    back: "OneLake caches read files for 1 to 28 days to cut egress."

claims:
  - claim: "Shortcut targets, Tables vs Files behaviour, no cascading deletes, deletes inside a shortcut reach the target with permission, caching 1 to 28 days, delegated identity not passed through."
    status: verified
    source: "https://learn.microsoft.com/en-us/fabric/onelake/onelake-shortcuts (updated 2026-07-13)"
  - claim: "notebookutils.fs.ls(path) lists a directory and notebookutils.fs.rm(path, recurse) deletes; MSSparkUtils was renamed NotebookUtils."
    status: verified
    source: "https://learn.microsoft.com/en-us/fabric/data-engineering/notebookutils/notebookutils-file-system and .../notebook-utilities"
