    back: "SQL for lakehouse and warehouse, DAX for semantic models, KQL for KQL databases. Up to five sources."
  - front: "Data agent security"
    back: "Read-only queries only. Runs with the asking user's permissions."
  - front: "Example queries"
    back: "Question and query pairs, validated against the schema. Not supported for semantic models."
  - front: "Measure a data agent"
    back: "Ground-truth questions with known answers, rerun after every change, accuracy recorded."

