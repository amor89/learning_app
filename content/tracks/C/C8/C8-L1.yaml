  - front: "Copilot release status"
    back: "Per experience. Notebooks and Warehouse SQL preview. Data agents, Data Factory and Power BI GA (September 2026)."
  - front: "Copilot token rates per 1,000 tokens"
    back: "Input 100, cached input 10, output 400 CU seconds. Background job, smoothed over 24 hours."
  - front: "Copilot output"
    back: "Sometimes inaccurate. A person able to judge it reviews it before use."

