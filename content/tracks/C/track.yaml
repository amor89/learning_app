id: C
title: Microsoft Fabric
summary: Unify data, analytics and Copilot in Fabric, and verify what Copilot produces.
checklist:
  - Check the status (GA or preview) of every Fabric feature before you depend on it.
  - One copy of each dataset. Use shortcuts or mirroring before you copy.
  - Lakehouse for Spark and files. Warehouse for T-SQL writes and multi-table transactions.
  - The SQL analytics endpoint is read-only for table data. Write through Spark or a Warehouse.
  - Semantic models use star schemas. DAX measures state their filter context.
  - Direct Lake models are checked for fallback to DirectQuery.
  - Every Copilot output is read, run on known data and compared against a second method.
  - Workspaces map to domains. Access uses roles and OneLake security, not item sharing.
  - Items live in Git. Changes move through deployment pipelines.
  - Capacity use is monitored, and heavy jobs are scheduled off peak.
