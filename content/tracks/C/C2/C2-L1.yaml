id: C2-L1
title: Lakehouse Tables and Files, and schemas

concept: |
  A lakehouse has two top-level areas in OneLake:

  - **Tables** holds **managed Delta tables**. Fabric registers them, the SQL analytics endpoint exposes them, and Direct Lake semantic models read them.
  - **Files** holds anything else: CSV, JSON, Parquet, images, raw deliveries.

  Only Delta tables in Tables reach the SQL engines. A Parquet or CSV file is invisible to the SQL analytics endpoint, wherever it sits. If you put a folder that is not a valid Delta table under Tables, the lakehouse explorer shows it in an **Unidentified** area. A broken shortcut also lands there.

  So the flow for a delivery is: land the raw file in **Files** (your bronze copy, as received), then read it with Spark and write a Delta table to **Tables** with `saveAsTable`.

  **Schemas.** New lakehouses created in the portal have schemas enabled by default. Every schema-enabled lakehouse has a `dbo` schema that you cannot rename or remove. A table written without a schema goes to `dbo`. Create schemas by domain (`sales`, `hr`) to keep a growing lakehouse navigable.

  In Spark SQL you reference tables with a **four-part name**: `workspace.lakehouse.schema.table`. Parts you leave out come from defaults: a bare table name means the `dbo` schema of the notebook's default lakehouse. For code that others run, name at least the lakehouse and schema, so it does not depend on which lakehouse happens to be attached.

  One change to note if you learned Fabric earlier: since 5 September 2025, Fabric no longer creates a default semantic model automatically with each new lakehouse. Create semantic models on purpose (lesson C6-L1).

why_it_matters: |
  An engineer wrote cleaned survey data as Parquet into `Files/clean/respondents/`, the way they had written to cloud storage before. The Power BI team could not find the table in the SQL analytics endpoint, so they imported the Parquet into a separate dataflow, a second copy with its own refresh. Writing a Delta table to Tables with `saveAsTable` would have exposed it to every engine with no copy.

worked_example:
  language: pyspark
  weak:
    code: |
      raw = spark.read.option("header", True).csv("Files/landing/respondents_w14.csv")
      raw.write.mode("overwrite").parquet("Files/clean/respondents")
    annotations:
      - find: 'raw = spark.read.option("header", True).csv("Files/landing/respondents_w14.csv")'
        note: "Every column read as a string, types unchecked."
      - find: 'raw.write.mode("overwrite").parquet("Files/clean/respondents")'
        note: "Parquet under Files: invisible to the SQL analytics endpoint and Direct Lake."
  strong:
    code: |
      from pyspark.sql import DataFrame, SparkSession
      from pyspark.sql import types as T

      RESPONDENT_SCHEMA = T.StructType([
          T.StructField("respondent_id", T.StringType(), False),
          T.StructField("wave", T.IntegerType(), False),
          T.StructField("weight", T.DoubleType(), True),
      ])


      def load_delivery(spark: SparkSession, path: str, table: str) -> DataFrame:
          """Read a CSV delivery from Files and append it to a managed Delta table in Tables."""
          df = spark.read.option("header", True).schema(RESPONDENT_SCHEMA).csv(path)
          df.write.mode("append").saveAsTable(table)
          return df


      load_delivery(spark, "Files/landing/respondents_w14.csv", "lh_survey.sales.respondents")
    annotations:
      - find: 'df = spark.read.option("header", True).schema(RESPONDENT_SCHEMA).csv(path)'
        note: "An explicit schema: types are decided, not inferred."
      - find: 'df.write.mode("append").saveAsTable(table)'
        note: "A managed Delta table in Tables: visible to Spark, T-SQL and Direct Lake."
      - find: 'load_delivery(spark, "Files/landing/respondents_w14.csv", "lh_survey.sales.respondents")'
        note: "Lakehouse and schema named, so the code does not depend on the attached default."
  takeaway: |
    Raw files in Files, Delta tables in Tables, and schema-qualified names in shared code.

exercises:
  - id: C2-L1-E1
    type: mcq
    difficulty: 1
    prompt: |
      A Parquet file sits at `Files/exports/orders.parquet` in a lakehouse. What can the SQL analytics endpoint do with it?
    options:
      - {id: a, text: "Query it as a table named orders."}
      - {id: b, text: "Nothing. Only Delta tables in Tables appear in the endpoint."}
      - {id: c, text: "Query it after a metadata refresh."}
      - {id: d, text: "Convert it to Delta automatically."}
    answer: b
    reasons:
      - {id: r1, text: "The endpoint exposes Delta tables only. Parquet and CSV cannot be queried through it."}
      - {id: r2, text: "Files is a private folder only the owner can see."}
    reason_answer: r1
    wrong_answers:
      - answer: a
        feedback: "Files is not scanned for tables. Write a Delta table to Tables with saveAsTable."
      - answer: c
        feedback: "Refreshing metadata picks up Delta tables. It never turns a Parquet file into a table."
      - answer: d
        feedback: "Fabric does not convert it. You write the Delta table yourself."
      - answer: b|r2
        feedback: "Right answer, wrong reason. Files is visible. It is just not tables."
    hints:
      - "Which format does the endpoint read?"
      - "Which folder holds managed tables?"
      - "Delta, in Tables."
    explanation: |
      Only Delta tables reach the SQL engines. Files is for raw and non-Delta data.

  - id: C2-L1-E2
    type: mcq
    difficulty: 2
    prompt: |
      In a notebook attached to schema-enabled lakehouse `lh_survey`, you run `spark.read.table("respondents")`. Which table does Spark read?
    options:
      - {id: a, text: "lh_survey.dbo.respondents"}
      - {id: b, text: "The first schema that has a respondents table"}
      - {id: c, text: "It raises an error: schemas require a four-part name"}
      - {id: d, text: "respondents in every schema, unioned"}
    answer: a
    reasons:
      - {id: r1, text: "A bare table name resolves to the dbo schema of the default lakehouse."}
      - {id: r2, text: "dbo is the only schema Spark can read."}
    reason_answer: r1
    wrong_answers:
      - answer: b
        feedback: "Spark does not search schemas. Missing parts come from defaults: default lakehouse, dbo schema."
      - answer: c
        feedback: "Omitted parts are allowed and filled from defaults."
      - answer: d
        feedback: "Nothing is unioned. One table is resolved."
      - answer: a|r2
        feedback: "Right answer, wrong reason. Spark reads any schema you name. dbo is only the default."
    hints:
      - "What fills in the missing parts of the name?"
      - "The default lakehouse and the default schema."
      - "dbo."
    explanation: |
      `respondents` resolves to `lh_survey.dbo.respondents`. If the table lives in `sales`, name the schema.

  - id: C2-L1-E3
    type: fill_gap
    difficulty: 2
    language: pyspark
    prompt: |
      Join two tables in different workspaces in one Spark SQL query.
    template: |
      SELECT e.name, d.dept_name
      FROM ops_ws.hr_lakehouse.[[g1]].employees AS e
      JOIN global_ws.corporate_lakehouse.company.departments AS d
        ON e.deptno = d.deptno
    gaps:
      g1: {accepted: [hrm, dbo]}
    wrong_answers:
      - answer: {g1: Tables}
        feedback: "Tables is a OneLake folder, not a schema. The third part is the schema name, such as dbo or hrm."
    hints:
      - "The four-part name is workspace.lakehouse.schema.table."
      - "The third part is a schema."
      - "The employees table lives in schema hrm in Microsoft's example, or dbo by default."
    explanation: |
      `workspace.lakehouse.schema.table` reaches any table you have permission to read, across lakehouses and workspaces.

  - id: C2-L1-E4
    type: write_function
    difficulty: 3
    language: pyspark
    prompt: |
      Write `load_delivery(spark, path, table)`. Read the CSV at `path` with a header and the given `RESPONDENT_SCHEMA`, append it to the managed table `table` with `saveAsTable`, and return the DataFrame you read. Do not write Parquet to Files.
    starter: |
      from pyspark.sql import types as T

      RESPONDENT_SCHEMA = T.StructType([
          T.StructField("respondent_id", T.StringType(), False),
          T.StructField("wave", T.IntegerType(), False),
          T.StructField("weight", T.DoubleType(), True),
      ])


      def load_delivery(spark, path, table):
          df = spark.read.option("header", True).csv(path)
          df.write.mode("overwrite").parquet("Files/clean/respondents")
          return df
    checker:
      kind: python
      ast_rules:
        - id: typed_documented
          kind: requires_function
          name: load_delivery
          typed: true
          docstring: true
          message: "Give `load_delivery` type hints and a docstring."
        - id: explicit_schema
          kind: requires_call
          name: schema
          message: "Read with the explicit schema: `.schema(RESPONDENT_SCHEMA)`."
        - id: save_as_table
          kind: requires_call
          name: saveAsTable
          message: "Write a managed Delta table with `saveAsTable(table)`."
        - id: no_parquet
          kind: forbids_call
          name: parquet
          message: "Parquet files are invisible to the SQL analytics endpoint. Write a table instead."
        - id: append
          kind: requires_pattern
          pattern: "mode\\(\\s*[\"']append[\"']\\s*\\)"
          message: "Each delivery adds rows: use mode(\"append\")."
    solution: |
      from pyspark.sql import DataFrame, SparkSession
      from pyspark.sql import types as T

      RESPONDENT_SCHEMA = T.StructType([
          T.StructField("respondent_id", T.StringType(), False),
          T.StructField("wave", T.IntegerType(), False),
          T.StructField("weight", T.DoubleType(), True),
      ])


      def load_delivery(spark: SparkSession, path: str, table: str) -> DataFrame:
          """Read a CSV delivery and append it to a managed Delta table.

          Args:
              spark: Active session.
              path: CSV path, usually under Files/landing.
              table: Target table, ideally lakehouse.schema.table.

          Returns:
              The DataFrame that was read.
          """
          df = spark.read.option("header", True).schema(RESPONDENT_SCHEMA).csv(path)
          df.write.mode("append").saveAsTable(table)
          return df
    spark_tests: |
      import os
      import tempfile
      d = tempfile.mkdtemp()
      p = os.path.join(d, "w14.csv")
      with open(p, "w") as f:
          f.write("respondent_id,wave,weight\nR1,14,1.2\nR2,14,\n")
      spark.sql("CREATE DATABASE IF NOT EXISTS c2l1_sales")
      spark.sql("DROP TABLE IF EXISTS c2l1_sales.respondents")
      load_delivery(spark, p, "c2l1_sales.respondents")
      load_delivery(spark, p, "c2l1_sales.respondents")
      t = spark.table("c2l1_sales.respondents")
      assert t.count() == 4
      assert dict(t.dtypes)["wave"] == "int"
      fmt = spark.sql("DESCRIBE DETAIL c2l1_sales.respondents").collect()[0]["format"]
      assert fmt == "delta", fmt
    seeded_bugs:
      - |
        from pyspark.sql import DataFrame, SparkSession


        def load_delivery(spark: SparkSession, path: str, table: str) -> DataFrame:
            """Writes Parquet to Files."""
            df = spark.read.option("header", True).csv(path)
            df.write.mode("overwrite").parquet("Files/clean/respondents")
            return df
      - |
        from pyspark.sql import DataFrame, SparkSession
        from pyspark.sql import types as T

        RESPONDENT_SCHEMA = T.StructType([T.StructField("respondent_id", T.StringType(), False)])


        def load_delivery(spark: SparkSession, path: str, table: str) -> DataFrame:
            """Overwrites every delivery."""
            df = spark.read.option("header", True).schema(RESPONDENT_SCHEMA).csv(path)
            df.write.mode("overwrite").saveAsTable(table)
            return df
    wrong_answers:
      - answer: |
          from pyspark.sql import DataFrame, SparkSession
          from pyspark.sql import types as T

          RESPONDENT_SCHEMA = T.StructType([T.StructField("respondent_id", T.StringType(), False)])


          def load_delivery(spark: SparkSession, path: str, table: str) -> DataFrame:
              """Overwrites every delivery."""
              df = spark.read.option("header", True).schema(RESPONDENT_SCHEMA).csv(path)
              df.write.mode("overwrite").saveAsTable(table)
              return df
        triggers: append
    hints:
      - "Read with .schema(RESPONDENT_SCHEMA) and the header option."
      - "Write with .write.mode(\"append\").saveAsTable(table)."
      - "Return the DataFrame."
    explanation: |
      A managed Delta table in Tables serves Spark, the SQL analytics endpoint and Direct Lake from one copy.

  - id: C2-L1-E5
    type: design
    difficulty: 4
    prompt: |
      Lay out a lakehouse for a survey programme with raw CSV deliveries, cleaned respondent data and reporting tables.
    slots:
      - id: raw
        label: "Raw CSV deliveries, kept as received"
        options: &places
          - {id: files, text: "Files"}
          - {id: tables_dbo, text: "Tables, dbo schema"}
          - {id: tables_schema, text: "Tables, a named schema per domain"}
        answer: files
      - id: clean
        label: "Cleaned respondent-level data"
        options: *places
        answer: tables_schema
      - id: gold
        label: "Reporting tables read by Power BI"
        options: *places
        answer: tables_schema
    model_answer: |
      - Raw deliveries in Files, as received.
      - Cleaned and reporting data as Delta tables in Tables, under schemas such as survey_silver and survey_gold.
    wrong_answers:
      - answer: {raw: tables_dbo}
        feedback: "CSV files under Tables are not Delta tables. They end up in the Unidentified area."
      - answer: {gold: files}
        feedback: "Power BI's Direct Lake and the SQL endpoint read Delta tables in Tables, not files."
      - answer: {clean: tables_dbo}
        feedback: "It works, but everything lands in one flat schema. Named schemas keep domains apart as the lakehouse grows."
    hints:
      - "Which area holds non-Delta files?"
      - "Which area do SQL and Power BI read?"
      - "Schemas organise tables by domain."
    explanation: |
      Files for raw, Tables for Delta, and schemas to keep the tables organised.

recap:
  - front: "Lakehouse Tables vs Files"
    back: "Tables: managed Delta tables, visible to SQL and Direct Lake. Files: raw and non-Delta data."
  - front: "Non-Delta folder under Tables"
    back: "Shown in the Unidentified area, not queryable."
  - front: "Lakehouse schemas"
    back: "On by default for new lakehouses. dbo is the fixed default schema."
  - front: "Spark four-part name"
    back: "workspace.lakehouse.schema.table. A bare name means dbo in the default lakehouse."

claims:
  - claim: "Lakehouse Tables holds managed Delta tables and Files holds unstructured or non-Delta data; only Delta tables appear in the SQL analytics endpoint; default semantic models are no longer created automatically since 5 September 2025."
    status: verified
    source: "https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-overview (updated 2026-05-07)"
  - claim: "Non-Delta folders under Tables and broken shortcuts appear in the Unidentified area."
    status: verified
    source: "https://learn.microsoft.com/en-us/fabric/data-engineering/navigate-lakehouse-explorer (updated 2026-05-07)"
  - claim: "Schemas are enabled by default for new lakehouses; dbo cannot be renamed or removed; Spark uses workspace.lakehouse.schema.table and resolves omitted parts from defaults."
    status: verified
    source: "https://learn.microsoft.com/en-us/fabric/data-engineering/lakehouse-schemas (updated 2026-02-24)"
