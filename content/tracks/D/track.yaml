id: D
title: Finding errors in code
summary: Find and fix errors fast, including errors in code that Claude and Copilot write.
checklist:
  - Read a traceback from the bottom up. Find the first frame in your own code.
  - Reproduce the error on the smallest data that shows it.
  - Check row counts before and after every join.
  - Test numbers with `is None`, never with truthiness, when zero is a valid value.
  - Never use a mutable object as a default argument.
  - Check every function and parameter an AI suggests against the official docs for your version.
  - Run AI code on a small input with a known answer before you trust it.
  - Write the failing test first. A test that only repeats the code proves nothing.
  - Ask the model to list its assumptions. Check each one.
  - State versions, constraints, expected outputs and tests in every prompt.
