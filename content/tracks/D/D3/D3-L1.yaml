id: D3-L1
title: Join row explosion and nulls in filters

concept: |
  Some bugs raise no error. The job succeeds and the numbers are wrong. Two of the most common come from joins and from nulls.

  **Join row explosion.** A left join of respondents to a region lookup should keep one row per respondent. If the lookup holds a key twice, say `N` for "North" and "North (old)", every respondent in `N` appears twice. Weighted totals double for that region. Nothing fails.

  Check the grain around every join:

  - Count rows before and after. A many-to-one join must not change the count.
  - In pandas, pass `validate="many_to_one"`. A duplicate key then raises `MergeError: Merge keys are not unique in right dataset`. Checked on pandas 3.0.2.
  - In Spark, count duplicate keys in the lookup before joining: `dim.groupBy(key).count().filter("count > 1")`.

  **Nulls behave differently in pandas and Spark.** Checked on pandas 3.0.2 and PySpark 4.0.4:

  | Operation | pandas | Spark and SQL |
  | --- | --- | --- |
  | Filter `region != "N"` | Keeps rows where region is missing | **Drops** rows where region is null |
  | Join on a null key | **Matches** null to null | Never matches a null key |
  | `x NOT IN (subquery)` where the subquery holds a null | Not applicable | Returns **no rows** |

  In Spark and SQL, a comparison with null gives null, not True or False, and a filter keeps only True. So `F.col("region_code") != "N"` silently drops every respondent with no region. Say what you mean:

  - Keep nulls: `(F.col("region_code") != "N") | F.col("region_code").isNull()`, or `~F.col("region_code").eqNullSafe("N")`.
  - Exclude a list that might contain nulls: use `NOT EXISTS` or a `left_anti` join, not `NOT IN`.

  In pandas, the surprise runs the other way: null keys match each other. Drop or fill null keys before a merge unless you want that.

why_it_matters: |
  A regional reach table showed the North at 118% weighted reach. The region lookup had gained a second row for code `N` when a boundary changed. The left join doubled every northern respondent. A row count check before and after the join, or `validate="many_to_one"`, would have stopped the job at the join.

worked_example:
  language: python
  weak:
    code: |
      def add_region(respondents: pd.DataFrame, regions: pd.DataFrame) -> pd.DataFrame:
          """Attach region names."""
          merged = respondents.merge(regions, on="region_code", how="left")
          return merged[merged["region"] != "Unknown"]
    annotations:
      - find: 'merged = respondents.merge(regions, on="region_code", how="left")'
        note: "No grain check. A duplicate code doubles rows, and null codes match a null row in regions."
      - find: 'return merged[merged["region"] != "Unknown"]'
        note: "A filter that also changes the row count, mixed into the join step."
  strong:
    code: |
      def add_region(respondents: pd.DataFrame, regions: pd.DataFrame) -> pd.DataFrame:
          """Attach region names. One output row per respondent.

          Raises:
              pandas.errors.MergeError: If a region code appears twice in regions.
          """
          lookup = regions.dropna(subset=["region_code"])
          merged = respondents.merge(lookup, on="region_code", how="left", validate="many_to_one")
          if len(merged) != len(respondents):
              raise ValueError(f"join changed rows: {len(respondents)} -> {len(merged)}")
          return merged
    annotations:
      - find: 'lookup = regions.dropna(subset=["region_code"])'
        note: "pandas matches null keys to each other. Drop them from the lookup."
      - find: 'merged = respondents.merge(lookup, on="region_code", how="left", validate="many_to_one")'
        note: "pandas raises MergeError if the lookup has a duplicate key."
      - find: "if len(merged) != len(respondents):"
        note: "An explicit grain check. It also works where validate is not available."
  takeaway: |
    Check row counts across every join. Know how your engine treats nulls in filters and keys, and write the null case explicitly.

exercises:
  - id: D3-L1-E1
    type: predict_output
    difficulty: 1
    language: python
    prompt: |
      What does this print? (pandas 3)
    code: |
      import pandas as pd

      resp = pd.DataFrame({"id": [1, 2, 3], "code": ["N", "S", "N"]})
      regions = pd.DataFrame({"code": ["N", "N", "S"], "name": ["North", "North (old)", "South"]})
      print(len(resp.merge(regions, on="code", how="left")))
    answer: "5"
    wrong_answers:
      - answer: "3"
        feedback: "A left join keeps every left row, but each one appears once per matching right row. Code N matches twice."
      - answer: "4"
        feedback: "Two respondents have code N, and each matches two rows: 2 x 2 + 1 = 5."
    hints:
      - "How many rows in regions match code N?"
      - "How many respondents have code N?"
      - "2 x 2 + 1."
    explanation: |
      Each N respondent matches two lookup rows. 4 rows for N, 1 for S. The left join multiplied the grain.

  - id: D3-L1-E2
    type: mcq
    difficulty: 2
    prompt: |
      In PySpark, `respondents.filter(F.col("region_code") != "N")` runs on 1,000 rows: 300 are `N`, 50 are null. How many rows remain?
    options:
      - {id: a, text: "650"}
      - {id: b, text: "700"}
      - {id: c, text: "350"}
      - {id: d, text: "1,000"}
    answer: a
    reasons:
      - {id: r1, text: "null != 'N' evaluates to null, and a filter keeps only rows where the condition is true."}
      - {id: r2, text: "Spark drops nulls from every DataFrame before filtering."}
    reason_answer: r1
    wrong_answers:
      - answer: b
        feedback: "That is pandas behaviour. In Spark the 50 null rows are dropped too."
      - answer: c
        feedback: "That keeps N and null. The filter removes N."
      - answer: d
        feedback: "The filter removes at least the 300 N rows."
      - answer: a|r2
        feedback: "Right answer, wrong reason. Spark keeps nulls in general. Only the comparison yields null here."
    hints:
      - "What is null != 'N' in SQL logic?"
      - "Null, which is not true."
      - "1,000 - 300 - 50."
    explanation: |
      Three-valued logic: comparisons with null give null. Add `| F.col("region_code").isNull()` to keep them.

  - id: D3-L1-E3
    type: mcq
    difficulty: 2
    prompt: |
      `SELECT * FROM respondents WHERE region_code NOT IN (SELECT code FROM excluded_regions)` returns no rows. `excluded_regions` holds `'N'` and one null. Why?
    options:
      - {id: a, text: "x NOT IN (..., NULL) is never true, because x <> NULL is null"}
      - {id: b, text: "NOT IN is not supported in Spark SQL"}
      - {id: c, text: "The subquery returns too many rows"}
      - {id: d, text: "Every respondent is in region N"}
    answer: a
    reasons:
      - {id: r1, text: "NOT IN expands to x <> 'N' AND x <> NULL. The second term is null, so the whole condition is never true."}
      - {id: r2, text: "Subqueries ignore nulls."}
    reason_answer: r1
    wrong_answers:
      - answer: b
        feedback: "It runs. It just returns no rows when the list contains a null."
      - answer: c
        feedback: "Two rows is fine. The null is the problem."
      - answer: d
        feedback: "Even an S respondent fails the null comparison."
      - answer: a|r2
        feedback: "Right answer, wrong reason. The subquery keeps the null, and that is what breaks NOT IN."
    hints:
      - "Expand NOT IN into ANDs."
      - "What is x <> NULL?"
      - "Use NOT EXISTS or a left_anti join."
    explanation: |
      Use `NOT EXISTS` or a `left_anti` join. Both treat a null in the exclusion list as "no match".

  - id: D3-L1-E4
    type: write_function
    difficulty: 3
    language: python
    packages: [pandas]
    prompt: |
      Write `safe_left_join(facts: pd.DataFrame, lookup: pd.DataFrame, key: str) -> pd.DataFrame`. Drop rows with a null key from `lookup` first. If a key appears more than once in the remaining lookup, raise `ValueError` naming the duplicated keys in sorted order. Return the left join, which must have exactly `len(facts)` rows. Null keys in `facts` must get missing lookup values, not match anything.
    starter: |
      import pandas as pd


      def safe_left_join(facts, lookup, key):
          return facts.merge(lookup, on=key, how="left")
    checker:
      kind: python
      ast_rules:
        - id: typed_documented
          kind: requires_function
          name: safe_left_join
          typed: true
          docstring: true
          message: "Give `safe_left_join` type hints and a docstring."
      tests:
        - id: duplicates
          code: |
            import pandas as pd
            facts = pd.DataFrame({"code": ["N", "S"]})
            lookup = pd.DataFrame({"code": ["S", "N", "N", "W", "W"], "name": list("abcde")})
            try:
                safe_left_join(facts, lookup, "code")
            except ValueError as err:
                assert "['N', 'W']" in str(err), str(err)
            else:
                raise AssertionError("no ValueError")
          message: "Raise ValueError listing duplicated keys in sorted order, like ['N', 'W']."
        - id: null_keys
          code: |
            import pandas as pd
            facts = pd.DataFrame({"id": [1, 2], "code": ["N", None]})
            lookup = pd.DataFrame({"code": ["N", None], "name": ["North", "Unknown"]})
            out = safe_left_join(facts, lookup, "code")
            assert len(out) == 2
            assert out.loc[out["id"] == 2, "name"].isna().all(), out
          message: "pandas matches null keys to each other. Drop null keys from the lookup so a null fact key gets no name."
        - id: grain
          code: |
            import pandas as pd
            facts = pd.DataFrame({"id": [1, 2, 3], "code": ["N", "S", "N"]})
            lookup = pd.DataFrame({"code": ["N", "S"], "name": ["North", "South"]})
            out = safe_left_join(facts, lookup, "code")
            assert list(out["name"]) == ["North", "South", "North"] and len(out) == 3
          message: "Return one row per fact row, in the original order."
    solution: |
      import pandas as pd


      def safe_left_join(facts: pd.DataFrame, lookup: pd.DataFrame, key: str) -> pd.DataFrame:
          """Left join that keeps the grain of facts.

          Args:
              facts: Rows to keep, one per output row.
              lookup: Attributes to attach, at most one row per key.
              key: Join column.

          Returns:
              The joined frame with len(facts) rows.

          Raises:
              ValueError: If lookup holds a key more than once, or the grain changes.
          """
          clean = lookup.dropna(subset=[key])
          counts = clean[key].value_counts()
          duplicated = sorted(counts[counts > 1].index.tolist())
          if duplicated:
              raise ValueError(f"duplicate keys in lookup: {duplicated}")
          joined = facts.merge(clean, on=key, how="left")
          if len(joined) != len(facts):
              raise ValueError(f"join changed rows: {len(facts)} -> {len(joined)}")
          return joined
    seeded_bugs:
      - |
        import pandas as pd


        def safe_left_join(facts: pd.DataFrame, lookup: pd.DataFrame, key: str) -> pd.DataFrame:
            """Keeps null keys in the lookup."""
            counts = lookup[key].value_counts()
            duplicated = sorted(counts[counts > 1].index.tolist())
            if duplicated:
                raise ValueError(f"duplicate keys in lookup: {duplicated}")
            return facts.merge(lookup, on=key, how="left")
      - |
        import pandas as pd


        def safe_left_join(facts: pd.DataFrame, lookup: pd.DataFrame, key: str) -> pd.DataFrame:
            """Silently drops duplicates instead of reporting them."""
            clean = lookup.dropna(subset=[key]).drop_duplicates(subset=[key])
            return facts.merge(clean, on=key, how="left")
    wrong_answers:
      - answer: |
          import pandas as pd


          def safe_left_join(facts: pd.DataFrame, lookup: pd.DataFrame, key: str) -> pd.DataFrame:
              """Keeps null keys in the lookup."""
              counts = lookup[key].value_counts()
              duplicated = sorted(counts[counts > 1].index.tolist())
              if duplicated:
                  raise ValueError(f"duplicate keys in lookup: {duplicated}")
              return facts.merge(lookup, on=key, how="left")
        triggers: null_keys
      - answer: |
          import pandas as pd


          def safe_left_join(facts: pd.DataFrame, lookup: pd.DataFrame, key: str) -> pd.DataFrame:
              """Silently drops duplicates instead of reporting them."""
              clean = lookup.dropna(subset=[key]).drop_duplicates(subset=[key])
              return facts.merge(clean, on=key, how="left")
        triggers: duplicates
    hints:
      - "`lookup.dropna(subset=[key])` removes null keys."
      - "`value_counts()` then `counts[counts > 1]` finds duplicates."
      - "Check `len(joined) == len(facts)` before returning."
    explanation: |
      Report duplicates, never drop them silently: which "North" is right is a business decision. Null keys leave the lookup before the merge.

  - id: D3-L1-E5
    type: spot_bug
    difficulty: 3
    language: pyspark
    prompt: |
      This step should remove test respondents (`panel == "test"`) and keep everyone else, including respondents with no panel recorded. 4% of real respondents vanish. Tap the line, then fix it.
    code: |
      from pyspark.sql import functions as F

      live = respondents.filter(F.col("panel") != "test")
      live.write.mode("overwrite").saveAsTable("research_silver.nat_live")
    bug_lines: [3]
    fix_checker:
      kind: python
      ast_rules:
        - id: null_handled
          kind: requires_pattern
          pattern: "isNull\\(\\)|eqNullSafe\\("
          message: "Keep null panels explicitly: add | F.col(\"panel\").isNull(), or use ~F.col(\"panel\").eqNullSafe(\"test\")."
    fix_solution: |
      from pyspark.sql import functions as F

      live = respondents.filter(~F.col("panel").eqNullSafe("test"))
      live.write.mode("overwrite").saveAsTable("research_silver.nat_live")
    wrong_answers:
      - lines: [4]
        feedback: "The write stores what the filter kept. The rows were lost one line earlier."
    hints:
      - "What is null != 'test' in Spark?"
      - "Null, so the row is dropped."
      - "eqNullSafe treats null as a comparable value."
    explanation: |
      `~F.col("panel").eqNullSafe("test")` is true for nulls, so respondents with no panel stay.

recap:
  - front: "Check for join row explosion"
    back: "Row counts before and after. pandas: validate='many_to_one'. Spark: count duplicate keys in the lookup first."
  - front: "col != 'x' with nulls: pandas vs Spark"
    back: "pandas keeps missing values. Spark and SQL drop nulls, because the comparison is null."
  - front: "Null join keys: pandas vs Spark"
    back: "pandas merge matches null to null. Spark and SQL never match null keys."
  - front: "NOT IN with a null in the list"
    back: "Returns no rows. Use NOT EXISTS or a left_anti join."

claims:
  - claim: "pandas 3.0.2: validate='many_to_one' raises MergeError 'Merge keys are not unique in right dataset; not a many-to-one merge'; != keeps missing values; merge matches null keys."
    status: verified
    source: "Local run on pandas 3.0.2 (Pyodide pin), September 2026."
  - claim: "PySpark 4.0.4: != filter drops nulls; eqNullSafe keeps them when negated; null join keys do not match; NOT IN with a null in the subquery returns no rows; NOT EXISTS and left_anti do not."
    status: verified
    source: "Local run on PySpark 4.0.4, September 2026."
