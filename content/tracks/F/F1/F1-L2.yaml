id: F1-L2
title: Lead with the answer, write in a pyramid
concept: |
  Leaders read the first lines of what you send and decide from those. If your conclusion sits in paragraph six, most of them never reach it. Write top-down instead.

  **The pyramid.** Put your answer, the **governing thought**, first. Under it, give three or four supporting points. Each one answers the question "why?" or "how?" that the answer raises. Under each point, put its evidence. The points form a MECE group (lesson F1-L1): no overlap, nothing missing.

  **The opening: situation, complication, question.** Before the answer, give the reader just enough context:

  - **Situation**: what the reader already knows and accepts. "We report attrition to the board each quarter."
  - **Complication**: what changed. "Voluntary attrition rose from 9% to 13% this year."
  - **Question**: what the complication raises. "What is driving it, and what should we do?"
  - **Answer**: your governing thought. "One site closure explains most of the rise. The underlying rate is flat."

  Keep the situation short. Readers skip what they already know.

  **Headings that say something.** Write each heading or slide title as a full-sentence takeaway: "First-year leavers are flat since March". A heading such as "Findings" tells the reader nothing.

  **The skim test.** Read only the first sentence of each paragraph. If the argument still holds, the structure works.

  The method is Barbara Minto's, from *The Pyramid Principle*.
why_it_matters: |
  A data scientist sent the executive team a twelve-slide deck that built up to its recommendation on slide eleven. The chief people officer read the first three slides between meetings and asked for "the bottom line". A one-line answer in the email body, with three supporting points, would have got the decision that week.
worked_example:
  language: text
  weak:
    code: |
      Subject: Attrition analysis
      Background: we report attrition to the board each quarter. We pulled
      leaver data for 2025 and 2026 and looked at grade, tenure and site.
      Findings: there were some differences by site.
      Next steps: discuss at the next meeting.
    annotations:
      - find: "Subject: Attrition analysis"
        note: "The subject names a topic, not the answer."
      - find: "Findings: there were some differences by site."
        note: "A label and a vague sentence. The reader still does not know the answer."
      - find: "Next steps: discuss at the next meeting."
        note: "No recommendation, so no decision follows."
  strong:
    code: |
      Subject: Attrition rise is the Leeds closure. Underlying rate is flat
      Voluntary attrition rose from 9% to 13% this year. The Leeds site closure
      explains 3.5 points of the 4. Excluding it, the rate is flat at 9.5%.
      1. Leeds leavers peaked in the two months after the closure was announced.
      2. First-year leavers are flat since onboarding changed in March.
      3. Exit reasons outside Leeds match last year's.
      Recommendation: report attrition with and without site closures from Q1.
    annotations:
      - find: "Subject: Attrition rise is the Leeds closure. Underlying rate is flat"
        note: "The subject line is the governing thought. A reader who stops here has the answer."
      - find: "explains 3.5 points of the 4"
        note: "The complication and the answer, with the size of the effect."
      - find: "1. Leeds leavers peaked in the two months after the closure was announced."
        note: "Three supporting points, each answering \"why do you say that?\""
      - find: "Recommendation: report attrition with and without site closures from Q1."
        note: "A decision the reader can approve."
  takeaway: |
    Put the answer first, then three or four MECE points that support it, then the evidence. Open with situation, complication and question, and write headings as takeaways.
exercises:
  - id: F1-L2-E1
    type: mcq
    difficulty: 1
    prompt: |
      Which subject line follows the pyramid principle?
    options:
      - {id: a, text: "Engagement fell 6 points, driven by two business units after the restructure"}
      - {id: b, text: "Engagement survey results"}
      - {id: c, text: "Findings from the autumn survey"}
      - {id: d, text: "Engagement: some initial thoughts"}
    answer: a
    wrong_answers:
      - answer: b
        feedback: "A topic, not an answer. The reader must open the message to learn anything."
      - answer: c
        feedback: "\"Findings\" is a label. Say what you found."
      - answer: d
        feedback: "Vague and hedged. Lead with your conclusion."
    hints:
      - "Which line gives the conclusion?"
      - "Labels such as \"findings\" say nothing."
      - "The one with a number and a cause."
    explanation: |
      The subject line carries the governing thought, so a reader who stops there has the answer.

  - id: F1-L2-E2
    type: order
    difficulty: 2
    prompt: |
      Put the opening of a summary in pyramid order.
    items:
      - {id: s, text: "We report attrition to the board each quarter."}
      - {id: c, text: "Voluntary attrition rose from 9% to 13% this year."}
      - {id: q, text: "What is driving it, and what should we do?"}
      - {id: a, text: "One site closure explains most of the rise. The underlying rate is flat."}
    answer: [s, c, q, a]
    wrong_answers:
      - answer: [c, s, q, a]
        feedback: "Start with what the reader already accepts, then the change."
      - answer: [s, c, a, q]
        feedback: "The question comes before the answer it is answered by."
    hints:
      - "Start with what the reader already knows."
      - "Then what changed, and the question it raises."
      - "Situation, complication, question, answer."
    explanation: |
      Situation, complication, question, then the answer.

  - id: F1-L2-E3
    type: fill_gap
    difficulty: 2
    language: text
    prompt: |
      Complete the pyramid rules.
    template: |
      The governing thought, your [[g1]], comes first.
      Each supporting point answers "why?" or "[[g2]]?" about the point above.
      Write each heading as a full-sentence [[g3]], never "Findings".
    gaps:
      g1: {accepted: [answer, conclusion], case_sensitive: false}
      g2: {accepted: [how], case_sensitive: false}
      g3: {accepted: [takeaway, conclusion], case_sensitive: false}
    wrong_answers:
      - answer: {g1: background}
        feedback: "Background comes last if at all. The answer goes first."
    hints:
      - "What the reader most needs."
      - "The two questions a claim raises."
      - "`answer`, `how`, `takeaway`."
    explanation: |
      Answer first, points that answer why or how, and headings that state a takeaway.

  - id: F1-L2-E4
    type: mcq
    difficulty: 3
    prompt: |
      Your summary has three supporting points: "Leavers rose in Leeds", "Leavers rose in the North" and "Leavers rose in operations". What is wrong?
    options:
      - {id: a, text: "The points overlap, because Leeds is in the North and has operations staff"}
      - {id: b, text: "Three points are too many"}
      - {id: c, text: "Nothing, each point is true"}
      - {id: d, text: "The points must be in alphabetical order"}
    answer: a
    reasons:
      - {id: r1, text: "Supporting points form a MECE group, so the same leavers must not be counted under two points."}
      - {id: r2, text: "Supporting points must each be about a different country."}
    reason_answer: r1
    wrong_answers:
      - answer: b
        feedback: "Three or four points is the usual size."
      - answer: c
        feedback: "True but overlapping. The reader cannot tell how much each explains."
      - answer: d
        feedback: "Order points by importance or by logic, not by the alphabet."
      - answer: a|r2
        feedback: "Right answer, wrong reason. The rule is MECE, not one country per point."
    hints:
      - "Could one leaver sit under two points?"
      - "Recall lesson F1-L1."
      - "The points overlap."
    explanation: |
      Supporting points form a MECE group. Pick one dimension, such as site, and split on it.

  - id: F1-L2-E5
    type: design
    difficulty: 4
    prompt: |
      You have ten minutes with the chief people officer to get approval for a new attrition measure. Design the message.
    slots:
      - id: first
        label: "What you say first"
        options:
          - {id: ask, text: "The recommendation and the one reason that matters most"}
          - {id: method, text: "How you built the dataset"}
        answer: ask
      - id: body
        label: "What follows"
        options:
          - {id: three, text: "Three supporting points, each with one number"}
          - {id: all, text: "Every chart from the analysis, so nothing is missed"}
        answer: three
      - id: titles
        label: "Slide titles"
        options:
          - {id: take, text: "Full-sentence takeaways"}
          - {id: label, text: "Labels such as \"Method\", \"Results\" and \"Next steps\""}
        answer: take
    model_answer: |
      - Lead with the recommendation, so the decision fits in the time even if you are cut short.
      - Three points with one number each are enough to support it.
      - Takeaway titles let the reader skim the argument.
    wrong_answers:
      - answer: {first: method}
        feedback: "The method matters to you. The reader needs the decision first."
      - answer: {body: all}
        feedback: "Every chart buries the three that support the decision."
      - answer: {titles: label}
        feedback: "Labels make the reader work out the point of each slide."
    hints:
      - "What if the meeting is cut to two minutes?"
      - "How much evidence does one decision need?"
      - "What do labels tell the reader?"
    explanation: |
      Recommendation first, three supporting points, takeaway titles.
recap:
  - front: "The pyramid"
    back: "The answer first, then three or four MECE points that answer why or how, then the evidence under each."
  - front: "Situation, complication, question"
    back: "What the reader accepts, what changed, the question it raises. Then the answer."
  - front: "Headings"
    back: "Full-sentence takeaways, such as \"First-year leavers are flat since March\". Never \"Findings\"."
  - front: "The skim test"
    back: "Read only the first sentence of each paragraph. The argument should still hold."
claims:
  - claim: "Barbara Minto's Pyramid Principle: lead with the answer, group supporting points in threes or fours that answer why or how, keep groups MECE, and open with situation, complication and question."
    status: search-only
    source: "Secondary summaries (BetterUp, ModelThinkers, thinkinsights.net, StrategyCase) found by search on 13 November 2026; the book itself was not checked."
