id: A0-L1
title: Spark DataFrames, the model and the core methods

concept: |
  Databricks runs **Apache Spark**, which splits work across many machines. You work with **DataFrames**: tables with named, typed columns, spread over the cluster. Examples use PySpark 4.0, as in Databricks Runtime 17.3 LTS. A notebook gives you a ready `spark` session.

  ```python
  from pyspark.sql import functions as F

  df = spark.table("research_prod.research_silver.nat_respondents")
  ```

  `spark.createDataFrame(rows, "region STRING, w DOUBLE")` builds a small DataFrame from Python tuples, which is handy in tests.

  **Transformations** describe a new DataFrame and run nothing yet:

  - `select("region", "w")` keeps columns.
  - `filter(F.col("w") > 0)` keeps rows. A boolean column filters directly: `filter(F.col("in_scope"))`.
  - `withColumn("w2", F.col("w") * 2)` adds or replaces a column. `F.lit(1)` is a constant, and `F.when(cond, a).otherwise(b)` picks a value per row.
  - `groupBy("region").agg(F.sum("w").alias("total"), F.count("*").alias("n"))` summarises per group.
  - `join(other, "region_code", "left")` and `orderBy("region")` join and sort.

  **Actions** run the plan and return a result: `show()` prints rows, `count()` counts them, `collect()` returns a list of `Row` objects to Python, and `write` saves a table. Spark is **lazy**: nothing happens until an action, so a typo in a column name may only fail at the action.

  DataFrames are **immutable**. Every transformation returns a new DataFrame and leaves the old one unchanged, so always use the result: `df = df.withColumn(...)` or `return df.withColumn(...)`.

  Import the functions module as `F`. Importing `sum` or `max` from it by name hides Python's own `sum` and `max`. Collect only small results: `collect()` pulls every row onto one machine.

why_it_matters: |
  A junior engineer wrote `df.withColumn("wave", F.lit("W14"))` on its own line and saved `df`. The wave column never existed, because the result was thrown away. Every later job that grouped by wave failed, and a morning was spent looking at the wrong notebook. Assigning the result, `df = df.withColumn(...)`, is the whole fix.

worked_example:
  language: pyspark
  weak:
    code: |
      from pyspark.sql.functions import *

      df = spark.table("research_prod.research_silver.nat_respondents")
      df.filter(col("in_scope") == True)
      rows = df.collect()
      total = sum(r.final_weight for r in rows)
    annotations:
      - find: "from pyspark.sql.functions import *"
        note: "Imports Spark's sum, max and others over Python's built-ins."
      - find: 'df.filter(col("in_scope") == True)'
        note: "The filtered DataFrame is thrown away, and == True is redundant."
      - find: "rows = df.collect()"
        note: "Pulls every row onto the driver, then adds them up in Python."
  strong:
    code: |
      from pyspark.sql import DataFrame
      from pyspark.sql import functions as F


      def weighted_base(df: DataFrame) -> DataFrame:
          """Weighted base and respondent count per region, in-scope rows only."""
          return (
              df.filter(F.col("in_scope"))
              .groupBy("region")
              .agg(F.sum("final_weight").alias("weighted_base"), F.count("*").alias("n"))
          )
    annotations:
      - find: "from pyspark.sql import functions as F"
        note: "Spark functions stay behind F., so Python's built-ins keep their meaning."
      - find: 'df.filter(F.col("in_scope"))'
        note: "A boolean column filters directly, and the result is used."
      - find: '.agg(F.sum("final_weight").alias("weighted_base"), F.count("*").alias("n"))'
        note: "The cluster does the summing. Only the small result ever needs collecting."
  takeaway: |
    Chain transformations and use their results, let Spark aggregate, and run an action only when you need the answer.

exercises:
  - id: A0-L1-E1
    type: mcq
    difficulty: 1
    prompt: |
      Which line makes Spark read data and compute?
    options:
      - {id: a, text: "`kept = df.filter(F.col(\"w\") > 0)`"}
      - {id: b, text: "`totals = kept.groupBy(\"region\").agg(F.sum(\"w\").alias(\"total\"))`"}
      - {id: c, text: "`totals.count()`"}
      - {id: d, text: "`totals = totals.orderBy(\"region\")`"}
    answer: c
    reasons:
      - {id: r1, text: "count() is an action. The other lines are transformations that only describe the plan."}
      - {id: r2, text: "count() is the last line."}
    reason_answer: r1
    wrong_answers:
      - answer: a
        feedback: "filter is a transformation. It returns a new DataFrame and runs nothing yet."
      - answer: b
        feedback: "groupBy and agg are transformations too. Spark waits for an action."
      - answer: d
        feedback: "orderBy is a transformation. The plan grows, nothing runs."
      - answer: c|r2
        feedback: "Right line, wrong reason. Position does not matter. count() is an action."
    hints:
      - "Spark is lazy."
      - "Which call returns a result to Python instead of a new DataFrame?"
      - "count returns a number."
    explanation: |
      Transformations build a plan. An action such as `count()`, `show()`, `collect()` or a write runs it.

  - id: A0-L1-E2
    type: predict_output
    difficulty: 2
    language: pyspark
    prompt: |
      What does this print? (PySpark 4.0)
    code: |
      from pyspark.sql import functions as F

      df = spark.createDataFrame([("N", 1.0), ("N", 2.0), ("S", 4.0)], "region STRING, w DOUBLE")
      out = df.filter(F.col("w") > 1).groupBy("region").agg(F.sum("w").alias("total")).orderBy("region")
      print([(r.region, r.total) for r in out.collect()])
    answer: |
      [('N', 2.0), ('S', 4.0)]
    wrong_answers:
      - answer: "[('N', 3.0), ('S', 4.0)]"
        feedback: "The filter runs first: w > 1 drops the row with 1.0, so N totals 2.0."
      - answer: "[('S', 4.0), ('N', 2.0)]"
        feedback: "orderBy(\"region\") sorts N before S."
    hints:
      - "Apply the filter first."
      - "Which rows have w above 1?"
      - "Then add up w per region."
    explanation: |
      The filter keeps 2.0 for N and 4.0 for S, the groupBy sums them, and orderBy puts N first.

  - id: A0-L1-E3
    type: fill_gap
    difficulty: 2
    language: pyspark
    prompt: |
      Total the positive weights per region.
    template: |
      totals = df.filter(F.col("w") > 0).groupBy("region").[[g1]](F.[[g2]]("w").alias("total"))
    gaps:
      g1: {accepted: [agg]}
      g2: {accepted: [sum]}
    wrong_answers:
      - answer: {g1: agg, g2: count}
        feedback: "F.count counts rows. The task asks for the total weight: F.sum."
      - answer: {g1: select, g2: sum}
        feedback: "After groupBy, summarise with agg."
    hints:
      - "The method that follows groupBy."
      - "The function that adds values."
      - "`agg` and `sum`."
    explanation: |
      `groupBy(...).agg(...)` summarises each group. `F.sum("w")` adds the weights, and `alias` names the result.

  - id: A0-L1-E4
    type: write_function
    difficulty: 3
    language: pyspark
    prompt: |
      Write `region_totals(df: DataFrame) -> DataFrame`. Keep rows that are in scope (the boolean column `in_scope`) and have a positive `w`. Return one row per `region` with `n`, the number of rows, and `total_weight`, the sum of `w`. Use type hints and a docstring. Do not collect.

      Spark does not run in the browser: the checker reads your code, and the CI runs the reference solution on real Spark.
    starter: |
      def region_totals(df):
          rows = df.collect()
          out = {}
          for r in rows:
              if r.in_scope == True and r.w > 0:
                  out[r.region] = out.get(r.region, 0) + r.w
          return out
    checker:
      kind: python
      ast_rules:
        - id: typed_documented
          kind: requires_function
          name: region_totals
          typed: true
          docstring: true
          message: "Define region_totals(df: DataFrame) -> DataFrame with a docstring."
        - id: no_collect
          kind: forbids_call
          name: collect
          message: "Do not collect. Let Spark filter and aggregate on the cluster."
        - id: no_eq_true
          kind: forbids_compare_to_bool
          message: "Filter on F.col(\"in_scope\") directly. `== True` trips ruff E712."
        - id: groups
          kind: requires_pattern
          pattern: "groupBy\\(\\s*[\"']region[\"']\\s*\\)"
          message: "Group by region with groupBy(\"region\")."
        - id: sums
          kind: requires_call
          name: sum
          message: "Add up the weights with F.sum(\"w\")."
        - id: counts
          kind: requires_call
          name: count
          message: "Count rows with F.count(\"*\")."
        - id: names
          kind: requires_pattern
          pattern: "alias\\(\\s*[\"']total_weight[\"']\\s*\\)"
          message: "Name the sum total_weight with .alias(\"total_weight\")."
    solution: |
      from pyspark.sql import DataFrame
      from pyspark.sql import functions as F


      def region_totals(df: DataFrame) -> DataFrame:
          """Row count and weight total per region, for in-scope rows with a positive weight.

          Args:
              df: Respondents with region, in_scope and w columns.

          Returns:
              One row per region with n and total_weight.
          """
          return (
              df.filter(F.col("in_scope") & (F.col("w") > 0))
              .groupBy("region")
              .agg(F.count("*").alias("n"), F.sum("w").alias("total_weight"))
          )
    spark_tests: |
      rows = [("N", True, 2.0), ("N", False, 5.0), ("N", True, 0.0), ("S", True, 1.0), ("S", True, 3.0)]
      df = spark.createDataFrame(rows, "region STRING, in_scope BOOLEAN, w DOUBLE")
      out = {(r.region, r.n, r.total_weight) for r in region_totals(df).collect()}
      assert out == {("N", 1, 2.0), ("S", 2, 4.0)}, out
    seeded_bugs:
      - |
        from pyspark.sql import DataFrame
        from pyspark.sql import functions as F


        def region_totals(df: DataFrame) -> DataFrame:
            """Compares to True."""
            return (
                df.filter((F.col("in_scope") == True) & (F.col("w") > 0))
                .groupBy("region")
                .agg(F.count("*").alias("n"), F.sum("w").alias("total_weight"))
            )
      - |
        from pyspark.sql import DataFrame
        from pyspark.sql import functions as F


        def region_totals(df: DataFrame) -> DataFrame:
            """Collects to the driver."""
            rows = df.filter(F.col("in_scope") & (F.col("w") > 0)).collect()
            return spark.createDataFrame(rows).groupBy("region").agg(F.count("*").alias("n"), F.sum("w").alias("total_weight"))
    wrong_answers:
      - answer: |
          from pyspark.sql import DataFrame
          from pyspark.sql import functions as F


          def region_totals(df: DataFrame) -> DataFrame:
              """Compares to True."""
              return (
                  df.filter((F.col("in_scope") == True) & (F.col("w") > 0))
                  .groupBy("region")
                  .agg(F.count("*").alias("n"), F.sum("w").alias("total_weight"))
              )
        triggers: no_eq_true
    hints:
      - "Filter with `F.col(\"in_scope\") & (F.col(\"w\") > 0)`, brackets around the comparison."
      - "Then `.groupBy(\"region\")`."
      - "`.agg(F.count(\"*\").alias(\"n\"), F.sum(\"w\").alias(\"total_weight\"))`."
    explanation: |
      One chain of transformations: filter, group, aggregate. The cluster does the work, and the function returns a DataFrame for the caller to write or show.

  - id: A0-L1-E5
    type: spot_bug
    difficulty: 3
    language: pyspark
    prompt: |
      The returned DataFrame never has a `weight_band` column. Tap the line with the bug, then fix the function.
    code: |
      def add_weight_band(df: DataFrame) -> DataFrame:
          """Add weight_band: high above 3, otherwise normal."""
          df.withColumn("weight_band", F.when(F.col("w") > 3, "high").otherwise("normal"))
          return df
    bug_lines: [3]
    fix_checker:
      kind: python
      ast_rules:
        - id: uses_result
          kind: requires_pattern
          pattern: "return\\s+df\\.withColumn\\(|df\\s*=\\s*df\\.withColumn\\("
          message: "Use the new DataFrame: return df.withColumn(...), or assign it back to df first."
        - id: still_defined
          kind: requires_function
          name: add_weight_band
          typed: true
          docstring: true
          message: "Keep add_weight_band with its type hints and docstring."
    fix_solution: |
      def add_weight_band(df: DataFrame) -> DataFrame:
          """Add weight_band: high above 3, otherwise normal."""
          return df.withColumn("weight_band", F.when(F.col("w") > 3, "high").otherwise("normal"))
    spark_tests: |
      df = spark.createDataFrame([(1.0,), (5.0,)], "w DOUBLE")
      out = [r.weight_band for r in add_weight_band(df).orderBy("w").collect()]
      assert out == ["normal", "high"], out
    wrong_answers:
      - lines: [4]
        feedback: "Returning df is right once df holds the new DataFrame. Which line throws the new DataFrame away?"
    hints:
      - "What does withColumn return?"
      - "DataFrames never change in place."
      - "`return df.withColumn(...)`."
    explanation: |
      `withColumn` returns a new DataFrame. Line 3 discards it, so the function returns the original. Return the new DataFrame, or assign it back to `df`.

recap:
  - front: "Transformation against action"
    back: "Transformations (select, filter, withColumn, groupBy, join) describe a new DataFrame. Actions (show, count, collect, write) run the plan."
  - front: "Why df.withColumn(...) on its own line does nothing"
    back: "DataFrames are immutable. Use the result: df = df.withColumn(...)."
  - front: "Summarise per group"
    back: "df.groupBy(\"region\").agg(F.sum(\"w\").alias(\"total\"), F.count(\"*\").alias(\"n\"))."
  - front: "How to import Spark functions"
    back: "from pyspark.sql import functions as F. Never import sum, max or min from it by name."

claims:
  - claim: "Transformations return DataFrames without running; count and collect run the plan; withColumn leaves the original DataFrame unchanged; the E2 code prints [('N', 2.0), ('S', 4.0)]."
    status: verified
    source: "Run on PySpark 4.0.4 locally."
