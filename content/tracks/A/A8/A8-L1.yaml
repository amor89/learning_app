    hints:
      - "Build the bronze waves for the tracker first."
      - "Return them all if silver does not exist."
      - "Otherwise filter silver the same way and left-anti-join."
    explanation: |
      Scoping both sides by tracker, handling the missing table and anti-joining gives the exact set of new waves. Sorting keeps runs deterministic.

  - id: A8-L1-E5
    type: mcq
    difficulty: 5
    prompt: |
      Silver already holds wave W14. The supplier redelivers W14 with corrected weights. Your job processes "waves in bronze that are not in silver". What happens to the redelivery?
    options:
      - {id: a, text: "It is processed, because bronze has a new ingestion_id."}
      - {id: b, text: "It is skipped, because W14 is already in silver."}
      - {id: c, text: "The job fails with a duplicate key error."}
      - {id: d, text: "It is processed twice."}
    answer: b
    reasons:
      - {id: r1, text: "The detection compares wave IDs only, and W14 exists on both sides."}
      - {id: r2, text: "Bronze rejects redeliveries."}
    reason_answer: r1
    wrong_answers:
      - answer: a
        feedback: "The detection never looks at ingestion_id. It compares wave IDs, and W14 is in silver."
      - answer: c
        feedback: "Nothing runs for W14, so nothing can fail."
      - answer: d
        feedback: "W14 is not selected at all."
      - answer: b|r2
        feedback: "Right outcome, wrong reason. Bronze appends every redelivery. The detection is what skips it."
    hints:
      - "What does the detection compare?"
      - "Is W14 on both sides?"
      - "Redeliveries need a signal beyond the wave ID."
    explanation: |
      Wave-ID detection cannot see redeliveries. Compare the latest ingestion timestamp per wave, or read bronze incrementally with change data feed or Auto Loader.

recap:
  - front: "Rule for incremental wave detection"
    back: "Filter bronze and silver by the same keys, such as tracker_id, then left-anti-join."
  - front: "Join type for 'in A but not in B'"
    back: "left_anti."
  - front: "First run, silver missing"
    back: "spark.catalog.tableExists(silver) is False: every bronze wave is new."
  - front: "What does wave-ID detection miss?"
    back: "Redeliveries of waves silver already holds. Use ingestion timestamps, change data feed or Auto Loader."

claims:
  - claim: "left_anti joins and spark.catalog.tableExists work as described on PySpark 4.0."
    status: verified
    source: "spark_tests for A8-L1-E3 and E4 run on PySpark 4.0.4 with Delta."
