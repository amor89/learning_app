id: A8-L1
title: Process only the waves you have not processed, correctly

concept: |
  Incremental loading means each run handles only new work: waves in bronze that silver does not have yet. It saves compute, and it keeps reruns cheap. It is also easy to get subtly wrong.

  The pattern:

  ```python
  def unprocessed_waves(spark, bronze, silver, tracker_id) -> list[str]:
      source = spark.table(bronze).filter(F.col("tracker_id") == tracker_id).select("wave_id").distinct()
      done = spark.table(silver).filter(F.col("tracker_id") == tracker_id).select("wave_id").distinct()
      return sorted(r.wave_id for r in source.join(done, "wave_id", "left_anti").collect())
  ```

  Four rules:

  1. **Filter both sides the same way.** Your reference `get_unprocessed_waves` filters bronze by tracker but reads silver for every tracker. If tracker B already has wave `W14` in silver, tracker A's `W14` is treated as done and never loads. Scope both sides with the same keys.
  2. **Use a left anti join** (`"left_anti"`): rows on the left with no match on the right. It says exactly what you mean, and it works for multi-column keys.
  3. **Handle the first run.** When silver does not exist yet, every bronze wave is new. Check with `spark.catalog.tableExists(silver)`.
  4. **Keep each wave's load idempotent.** Detection can be wrong after a partial failure, for example if silver has half a wave. Because the silver MERGE is idempotent (A3-L1), reprocessing a wave is always safe. Design for "process again", not "process exactly once".

  Deciding by "waves not in silver" misses redeliveries of a wave silver already has. Either compare the latest `ingestion_timestamp` per wave in bronze with the one recorded when silver loaded it, or read bronze incrementally with change data feed (A8-L3) or Auto Loader (A8-L2).

why_it_matters: |
  Two trackers share one silver table. Tracker B loads wave `W14` on Monday. Tracker A's `W14` arrives on Tuesday. The reference `get_unprocessed_waves` compares tracker A's bronze waves against silver waves for all trackers, finds `W14` already present, and skips it. Tracker A's dashboard shows no `W14`, and no job fails. The gap is found nine days later, by a client.

  Filtering silver by `tracker_id` too makes the comparison correct, and a reconciliation of bronze keys against silver rows (A6-L3) would have flagged it on Tuesday.

worked_example:
  language: pyspark
  weak:
    code: |
      def get_unprocessed_waves(bronze_table, silver_table, tracker_id):
          bronze_waves = (
              spark.table(bronze_table)
              .filter(col("tracker_id") == tracker_id)
              .select("wave_id").distinct()
          )
          silver_waves = spark.table(silver_table).select("wave_id").distinct()
          return [row.wave_id for row in bronze_waves.subtract(silver_waves).collect()]
    annotations:
      - find: 'silver_waves = spark.table(silver_table).select("wave_id").distinct()'
        note: "No tracker filter: another tracker's wave counts as done (reference defect 10)."
      - find: "def get_unprocessed_waves(bronze_table, silver_table, tracker_id):"
        note: "Uses a global spark and has no type hints."
      - find: "return [row.wave_id for row in bronze_waves.subtract(silver_waves).collect()]"
        note: "Unsorted output, and it fails if silver does not exist yet."
  strong:
    code: |
      def unprocessed_waves(spark: SparkSession, bronze: str, silver: str, tracker_id: str) -> list[str]:
          """Wave ids in bronze for this tracker that silver does not hold for this tracker."""
          source = (
              spark.table(bronze)
              .filter(F.col("tracker_id") == tracker_id)
              .select("wave_id")
              .distinct()
          )
          if not spark.catalog.tableExists(silver):
              return sorted(r.wave_id for r in source.collect())
          done = (
              spark.table(silver)
              .filter(F.col("tracker_id") == tracker_id)
              .select("wave_id")
              .distinct()
          )
          return sorted(r.wave_id for r in source.join(done, "wave_id", "left_anti").collect())
    annotations:
      - find: "if not spark.catalog.tableExists(silver):"
        note: "First run: silver does not exist, so every wave is new."
      - find: "spark.table(silver)"
        note: "Silver is read with the same tracker filter as bronze."
      - find: 'return sorted(r.wave_id for r in source.join('
        note: "Left anti join: waves with no match in silver. Sorted, so waves load in order and logs are predictable."
  takeaway: |
    Same filters on both sides, an explicit anti join, a first-run branch, and an idempotent load behind it.

exercises:
  - id: A8-L1-E1
    type: mcq
    difficulty: 1
    prompt: |
      Bronze for tracker A holds waves W13 and W14. Silver holds W13 for tracker A and W14 for tracker B. The reference function compares A's bronze waves with all of silver's waves. Which waves does it return?
    options:
      - {id: a, text: "W14"}
      - {id: b, text: "None"}
      - {id: c, text: "W13 and W14"}
      - {id: d, text: "W13"}
    answer: b
    reasons:
      - {id: r1, text: "Tracker B's W14 in silver makes tracker A's W14 look done."}
      - {id: r2, text: "subtract removes all waves when silver is not empty."}
    reason_answer: r1
    wrong_answers:
      - answer: a
        feedback: "That is the correct answer to the question the function should ask. Because silver is not filtered by tracker, B's W14 hides A's."
      - answer: c
        feedback: "W13 is in silver for tracker A, so it is correctly excluded. W14 is wrongly excluded too."
      - answer: d
        feedback: "W13 is already loaded for tracker A."
      - answer: b|r2
        feedback: "Right outcome, wrong reason. subtract removes only matching values. Here every value matches, because silver mixes trackers."
    hints:
      - "Which silver waves does the function compare against?"
      - "Is W14 in silver, for any tracker?"
      - "Both of A's waves appear in silver."
    explanation: |
      Without a tracker filter on silver, any tracker's wave counts as done. A's W14 never loads, and nothing fails.

  - id: A8-L1-E2
    type: fill_gap
    difficulty: 2
    language: pyspark
    prompt: |
      Keep only bronze waves that silver does not have, and handle a missing silver table.
    template: |
      if not spark.catalog.[[g1]](silver):
          return sorted(r.wave_id for r in source.collect())
      new = source.join(done, "wave_id", "[[g2]]")
    gaps:
      g1: {accepted: [tableExists]}
      g2: {accepted: [left_anti, leftanti, anti]}
    wrong_answers:
      - answer: {g2: left}
        feedback: "A left join keeps every bronze wave, matched or not. You want the ones with no match: left_anti."
      - answer: {g2: left_semi}
        feedback: "left_semi keeps the waves that do match: the ones already done. You want the opposite."
      - answer: {g1: exists}
        feedback: "The Catalog method is `tableExists`."
    hints:
      - "The Catalog method that checks whether a table exists."
      - "The join type that keeps left rows without a match."
      - "`tableExists` and `left_anti`."
    explanation: |
      `spark.catalog.tableExists` covers the first run. A `left_anti` join keeps bronze waves with no matching silver wave.

