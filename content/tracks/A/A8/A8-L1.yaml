          done = spark.table(silver).select("wave_id").distinct()
          return sorted(r.wave_id for r in source.join(done, "wave_id", "left_anti").collect())
    bug_lines: [4]
    fix_checker:
      kind: python
      ast_rules:
        - id: filters_silver
          kind: requires_pattern
          pattern: "spark\\.table\\(\\s*silver\\s*\\)\\s*\\.filter\\(\\s*F\\.col\\(\\s*[\"']tracker_id[\"']\\s*\\)\\s*==\\s*tracker_id\\s*\\)"
          message: "Filter silver by tracker_id, the same way as bronze."
    fix_solution: |
      def unprocessed_waves(spark: SparkSession, bronze: str, silver: str, tracker_id: str) -> list[str]:
          """Waves in bronze for this tracker that silver does not hold for this tracker."""
          source = spark.table(bronze).filter(F.col("tracker_id") == tracker_id).select("wave_id").distinct()
          done = spark.table(silver).filter(F.col("tracker_id") == tracker_id).select("wave_id").distinct()
          return sorted(r.wave_id for r in source.join(done, "wave_id", "left_anti").collect())
    spark_tests: |
      schema = "tracker_id STRING, wave_id STRING"
      spark.createDataFrame([("A", "W13"), ("A", "W14")], schema).write.mode("overwrite").saveAsTable("a8_bronze")
      spark.createDataFrame([("A", "W13"), ("B", "W14")], schema).write.mode("overwrite").saveAsTable("a8_silver")
      assert unprocessed_waves(spark, "a8_bronze", "a8_silver", "A") == ["W14"]
      spark.sql("DROP TABLE a8_bronze")
      spark.sql("DROP TABLE a8_silver")
    wrong_answers:
      - lines: [3]
        feedback: "Bronze is filtered by tracker, which is right. Compare it with how silver is read."
      - lines: [5]
        feedback: "The left anti join is correct once both sides cover the same tracker."
    hints:
      - "Compare lines 3 and 4."
      - "Which side lacks the tracker filter?"
      - "Add `.filter(F.col(\"tracker_id\") == tracker_id)` to silver."
    explanation: |
      Silver is read for all trackers, so another tracker's wave hides this tracker's wave. Filter both sides by the same keys.

  - id: A8-L1-E4
    type: write_function
    difficulty: 4
    language: pyspark
    prompt: |
      Write `unprocessed_waves(spark, bronze, silver, tracker_id)`. Return the sorted wave IDs present in bronze for the tracker and absent from silver for the same tracker. When silver does not exist, return every bronze wave for the tracker. Use a left anti join.
    starter: |
      from pyspark.sql import SparkSession
      from pyspark.sql import functions as F


      def unprocessed_waves(spark: SparkSession, bronze: str, silver: str, tracker_id: str) -> list[str]:
          ...
    checker:
      kind: python
      ast_rules:
        - id: typed_documented
          kind: requires_function
          name: unprocessed_waves
          typed: true
          docstring: true
          message: "Give `unprocessed_waves` type hints and a docstring."
        - id: first_run
          kind: requires_call
          name: tableExists
          message: "Handle the first run with `spark.catalog.tableExists(silver)`."
        - id: anti_join
          kind: requires_pattern
          pattern: "[\"']left_?anti[\"']"
          message: "Use a left anti join to find waves with no match in silver."
        - id: both_filtered
          kind: requires_call
          name: filter
          min: 2
          message: "Filter both bronze and silver by tracker_id."
        - id: sorted_out
          kind: requires_call
          name: sorted
          message: "Return the waves sorted."
    solution: |
      from pyspark.sql import SparkSession
      from pyspark.sql import functions as F


      def unprocessed_waves(spark: SparkSession, bronze: str, silver: str, tracker_id: str) -> list[str]:
          """Wave ids in bronze for this tracker that silver does not hold for this tracker.

          Args:
              spark: Active session.
              bronze: Bronze table name.
              silver: Silver table name. May not exist yet.
              tracker_id: Tracker to scope both sides to.

          Returns:
              Sorted wave ids to process.
          """
          source = spark.table(bronze).filter(F.col("tracker_id") == tracker_id).select("wave_id").distinct()
          if not spark.catalog.tableExists(silver):
              return sorted(r.wave_id for r in source.collect())
          done = spark.table(silver).filter(F.col("tracker_id") == tracker_id).select("wave_id").distinct()
          return sorted(r.wave_id for r in source.join(done, "wave_id", "left_anti").collect())
    spark_tests: |
      schema = "tracker_id STRING, wave_id STRING"
      spark.createDataFrame([("A", "W14"), ("A", "W13"), ("B", "W15")], schema).write.mode("overwrite").saveAsTable("a8e4_bronze")
      spark.sql("DROP TABLE IF EXISTS a8e4_silver")
      assert unprocessed_waves(spark, "a8e4_bronze", "a8e4_silver", "A") == ["W13", "W14"]
      spark.createDataFrame([("A", "W13"), ("B", "W14")], schema).write.mode("overwrite").saveAsTable("a8e4_silver")
      assert unprocessed_waves(spark, "a8e4_bronze", "a8e4_silver", "A") == ["W14"]
      spark.sql("DROP TABLE a8e4_bronze")
      spark.sql("DROP TABLE a8e4_silver")
    seeded_bugs:
