    explanation: |
      `pyspark.testing` provides the helpers. `checkRowOrder=True` makes order part of the comparison, which matters for ranked output.

  - id: A9-L3-E4
    type: write_function
    difficulty: 4
    language: pyspark
    prompt: |
      Write `check_idempotent(spark, load, table)`. `load` is a function that takes no arguments and loads a fixed source into `table`. Run it once, snapshot the table with `collect()`, run it again, and assert the table still equals the snapshot with `assertDataFrameEqual`.
    primer: |
      `Callable` from `collections.abc` types a parameter that holds a function. `Callable[[], None]` is a function that takes no arguments and returns nothing. You run it by calling the parameter, like any function:

      ```python
      from collections.abc import Callable

      def twice(step: Callable[[], None]) -> None:
          step()
          step()
      ```

      `.collect()` returns a list of rows, a snapshot that does not change when the table changes later.
    starter: |
      from collections.abc import Callable

      from pyspark.sql import SparkSession
      from pyspark.testing import assertDataFrameEqual


      def check_idempotent(spark: SparkSession, load: Callable[[], None], table: str) -> None:
          ...
    checker:
      kind: python
      ast_rules:
        - id: typed_documented
          kind: requires_function
          name: check_idempotent
          typed: true
          docstring: true
          message: "Give `check_idempotent` type hints and a docstring."
        - id: runs_twice
          kind: requires_call
          name: load
          min: 2
          message: "Call `load()` twice."
        - id: snapshot
          kind: requires_pattern
          pattern: "=\\s*spark\\.table\\(\\s*table\\s*\\)\\.collect\\(\\)"
          message: "Snapshot the table after the first run: `first = spark.table(table).collect()`."
        - id: uses_helper
          kind: requires_call
          name: assertDataFrameEqual
          message: "Compare with `assertDataFrameEqual`."
        - id: no_manual_compare
          kind: forbids_pattern
          pattern: "\\.collect\\(\\)\\s*=="
          message: "Do not compare collect() results with ==. Use assertDataFrameEqual."
    solution: |
      from collections.abc import Callable

      from pyspark.sql import SparkSession
      from pyspark.testing import assertDataFrameEqual


      def check_idempotent(spark: SparkSession, load: Callable[[], None], table: str) -> None:
          """Assert that running load twice leaves table as one run did.

          Raises:
              AssertionError: If the second run changed the table.
          """
          load()
          first = spark.table(table).collect()
          load()
          assertDataFrameEqual(spark.table(table), first)
    spark_tests: |
      schema = "respondent_id STRING, wave_id STRING, final_weight DOUBLE"
      source = spark.createDataFrame([("R1", "W1", 1.2), ("R2", "W1", 0.8)], schema)
      spark.sql("DROP TABLE IF EXISTS a9_idem")
      spark.sql(f"CREATE TABLE a9_idem ({schema}) USING DELTA")

      def merge_load() -> None:
          (DeltaTable.forName(spark, "a9_idem").alias("t")
           .merge(source.alias("s"), "t.respondent_id = s.respondent_id AND t.wave_id = s.wave_id")
           .whenMatchedUpdateAll().whenNotMatchedInsertAll().execute())

      def append_load() -> None:
          source.write.format("delta").mode("append").saveAsTable("a9_idem")

      check_idempotent(spark, merge_load, "a9_idem")
      try:
          check_idempotent(spark, append_load, "a9_idem")
      except AssertionError:
          pass
      else:
          raise AssertionError("append load was not caught")
      spark.sql("DROP TABLE a9_idem")
    seeded_bugs:
      - |
        from collections.abc import Callable

        from pyspark.sql import SparkSession
        from pyspark.testing import assertDataFrameEqual


        def check_idempotent(spark: SparkSession, load: Callable[[], None], table: str) -> None:
            """Only runs once."""
            load()
            assertDataFrameEqual(spark.table(table), spark.table(table))
      - |
        from collections.abc import Callable

        from pyspark.sql import SparkSession


        def check_idempotent(spark: SparkSession, load: Callable[[], None], table: str) -> None:
            """Order-dependent comparison."""
            load()
            first = spark.table(table).collect()
            load()
            assert spark.table(table).collect() == first
    wrong_answers:
      - answer: |
          from collections.abc import Callable

          from pyspark.sql import SparkSession
          from pyspark.testing import assertDataFrameEqual


          def check_idempotent(spark: SparkSession, load: Callable[[], None], table: str) -> None:
              """Only runs once."""
              load()
              assertDataFrameEqual(spark.table(table), spark.table(table))
        triggers: runs_twice
      - answer: |
          from collections.abc import Callable

          from pyspark.sql import SparkSession


          def check_idempotent(spark: SparkSession, load: Callable[[], None], table: str) -> None:
              """Order-dependent comparison."""
              load()
              first = spark.table(table).collect()
              load()
              assert spark.table(table).collect() == first
        triggers: uses_helper
    hints:
      - "load(), snapshot, load() again."
      - "The snapshot must be materialised with collect(), or it re-reads the changed table."
      - "`assertDataFrameEqual(spark.table(table), first)`."
    explanation: |
      `collect()` freezes the first state. A DataFrame would be lazy and re-read the table after the second run, so the comparison would always pass. `assertDataFrameEqual` then compares without caring about order.

  - id: A9-L3-E5
    type: spot_bug
    difficulty: 5
    language: pyspark
    prompt: |
      This test fails about one CI run in five, though the code under test is correct. Tap the line, then fix the test.
    code: |
      def test_gold_metrics(spark: SparkSession) -> None:
          silver = spark.createDataFrame([("R1", "W1", "N", 1.0), ("R2", "W1", "S", 1.0)], "respondent_id STRING, wave_id STRING, region STRING, final_weight DOUBLE")
          expected = spark.createDataFrame([("N", 1.0), ("S", 1.0)], "region STRING, weighted_base DOUBLE")
          actual = aggregate_base(silver).select("region", "weighted_base")
          assert actual.collect() == expected.collect()
    bug_lines: [5]
    fix_checker:
      kind: python
      ast_rules:
        - id: uses_helper
          kind: requires_call
          name: assertDataFrameEqual
          message: "Compare with `assertDataFrameEqual(actual, expected)`."
        - id: no_collect_eq
          kind: forbids_pattern
          pattern: "\\.collect\\(\\)\\s*=="
          message: "The order-dependent collect() comparison is still there."
    fix_solution: |
      def test_gold_metrics(spark: SparkSession) -> None:
          silver = spark.createDataFrame([("R1", "W1", "N", 1.0), ("R2", "W1", "S", 1.0)], "respondent_id STRING, wave_id STRING, region STRING, final_weight DOUBLE")
          expected = spark.createDataFrame([("N", 1.0), ("S", 1.0)], "region STRING, weighted_base DOUBLE")
          actual = aggregate_base(silver).select("region", "weighted_base")
          assertDataFrameEqual(actual, expected)
    wrong_answers:
      - lines: [4]
        feedback: "Selecting the columns to compare is fine. The flakiness comes from how they are compared."
    hints:
      - "Does a groupBy return rows in a fixed order?"
      - "collect() lists keep that order."
      - "Use assertDataFrameEqual, which ignores order."
    explanation: |
      Aggregation output has no guaranteed order, so the two lists match only when the partitions happen to line up. `assertDataFrameEqual` compares the rows as a multiset.

recap:
  - front: "Compare two DataFrames in a test"
    back: "pyspark.testing.assertDataFrameEqual(actual, expected). Ignores order, tolerates float rounding, checks schema."
  - front: "When should row order matter?"
    back: "Only for ranked output. Pass checkRowOrder=True."
  - front: "Idempotence test for a MERGE"
    back: "Load, snapshot with collect(), load again, assertDataFrameEqual(table, snapshot)."
  - front: "Why collect() for the snapshot?"
    back: "A DataFrame is lazy and would re-read the table after the second run."

claims:
  - claim: "assertDataFrameEqual ignores row order by default, uses rtol=1e-5 and atol=1e-8, fails on schema differences and duplicates, accepts a list of Rows as expected, and raises PySparkAssertionError (a subclass of AssertionError)."
    status: verified
    source: "Run on PySpark 4.0.4 with pandas 2.3.3 in this repository."
  - claim: "PySpark 4.0.4 fails to import assertDataFrameEqual with pandas 3.x."
    status: verified
    source: "ImportError: cannot import name '_builtin_table' from 'pandas.core.common', reproduced with pandas 3.0.6."
