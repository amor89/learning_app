id: A9-L3
title: Compare DataFrames properly, and test that MERGE is idempotent

concept: |
  Comparing DataFrames by hand is harder than it looks. `actual.collect() == expected.collect()` fails when the rows come back in a different order, which Spark never guarantees. It also fails when a float is `0.30000000000000004` instead of `0.3`. Sorting both sides fixes the order but not the floats, and neither checks the schema.

  `pyspark.testing` (PySpark 3.5 and later) handles all of this:

  ```python
  from pyspark.testing import assertDataFrameEqual, assertSchemaEqual

  assertDataFrameEqual(actual, expected)
  ```

  Tested on PySpark 4.0.4:

  - Row order is ignored by default. Pass `checkRowOrder=True` when order is the point, as in a top-10 list.
  - Floats compare with a tolerance (`rtol=1e-5`, `atol=1e-8` by default).
  - Schemas must match: INT against BIGINT fails with `DIFFERENT_SCHEMA`.
  - Duplicates count: two identical rows do not equal one.
  - `expected` can be a list of `Row` objects, which is handy for snapshots.
  - Failures raise `PySparkAssertionError`, a subclass of `AssertionError`, so pytest reports them as ordinary test failures, with a diff.

  `assertSchemaEqual(actual.schema, expected.schema)` checks only the structure.

  **Testing MERGE.** The property that matters is idempotence. The test:

  1. Create an empty Delta table with the target schema.
  2. Run the load once, and take a snapshot: `first = spark.table(t).collect()`.
  3. Run the same load again.
  4. `assertDataFrameEqual(spark.table(t), first)`.

  Add cases for the failures you fear: a repeated key in the source, a redelivery with a newer version, and the same respondent in two waves. Each one takes a few rows and a second or two.

  In the practice harness, PySpark 4.0.4 needs pandas 2.x. With pandas 3.x, `assertDataFrameEqual` fails to import.

why_it_matters: |
  A silver test compares `actual.collect() == expected.collect()`. It passes on a developer's laptop and fails one CI run in five, because the order of rows varies with partitioning. The team marks it flaky and skips it. A month later a real regression in the MERGE, duplicate rows after a retry, ships untested.

  `assertDataFrameEqual` ignores order, so the test is stable, and an idempotence test that runs the load twice catches the regression.

worked_example:
  language: pyspark
  weak:
    code: |
      def test_silver_load(spark):
          upsert_silver(spark, source, "silver", ["respondent_id", "wave_id"], "delivery_version")
          assert spark.table("silver").collect() == expected.collect()
    annotations:
      - find: 'assert spark.table("silver").collect() == expected.collect()'
        note: "Order-dependent and exact on floats: flaky, and a failure shows no useful diff."
      - find: 'upsert_silver(spark, source, "silver", ["respondent_id", "wave_id"], "delivery_version")'
        note: "One run only. It never checks what a retry does."
  strong:
    code: |
      from pyspark.testing import assertDataFrameEqual

      KEYS = ["respondent_id", "wave_id"]
      SCHEMA = "respondent_id STRING, wave_id STRING, final_weight DOUBLE, delivery_version INT"


      def test_silver_load_is_idempotent(spark: SparkSession, empty_silver: str) -> None:
          source = spark.createDataFrame(
              [("R1", "W1", 1.2, 1), ("R1", "W1", 1.5, 2), ("R2", "W1", 0.8, 1)], SCHEMA
          )
          upsert_silver(spark, source, empty_silver, KEYS, "delivery_version")
          first = spark.table(empty_silver).collect()

          upsert_silver(spark, source, empty_silver, KEYS, "delivery_version")

          assertDataFrameEqual(spark.table(empty_silver), first)
          expected = spark.createDataFrame([("R1", "W1", 1.5, 2), ("R2", "W1", 0.8, 1)], SCHEMA)
          assertDataFrameEqual(spark.table(empty_silver), expected)
    annotations:
      - find: '[("R1", "W1", 1.2, 1), ("R1", "W1", 1.5, 2), ("R2", "W1", 0.8, 1)], SCHEMA'
        note: "The source includes a repeated key, the case that breaks a naive MERGE."
      - find: "first = spark.table(empty_silver).collect()"
        note: "A snapshot of the table after one run, as a list of Rows."
      - find: "assertDataFrameEqual(spark.table(empty_silver), first)"
        note: "Second run leaves the table unchanged: idempotence, order-independent."
      - find: "assertDataFrameEqual(spark.table(empty_silver), expected)"
        note: "And the content is right: the newest version of R1 won."
  takeaway: |
    One helper compares DataFrames the right way, and one small test proves a MERGE survives a retry and a repeated key.

exercises:
  - id: A9-L3-E1
    type: mcq
    difficulty: 1
    prompt: |
      `actual` holds rows (1, 0.3) and (2, 1.0). `expected` holds (2, 1.0) and (1, 0.1 + 0.2). Both have the schema `id INT, w DOUBLE`. What does `assertDataFrameEqual(actual, expected)` do on PySpark 4.0?
    options:
      - {id: a, text: "Passes"}
      - {id: b, text: "Fails because the rows are in a different order"}
      - {id: c, text: "Fails because 0.1 + 0.2 is not exactly 0.3"}
      - {id: d, text: "Fails because it needs checkRowOrder=True"}
    answer: a
    reasons:
      - {id: r1, text: "It ignores row order by default and compares floats with a relative tolerance."}
      - {id: r2, text: "It only compares schemas."}
    reason_answer: r1
    wrong_answers:
      - answer: b
        feedback: "checkRowOrder is False by default, so order is ignored."
      - answer: c
        feedback: "Floats compare with rtol=1e-5 by default, so 0.30000000000000004 equals 0.3."
      - answer: d
        feedback: "checkRowOrder=True would make it stricter. The default ignores order."
      - answer: a|r2
        feedback: "Right outcome, wrong reason. It compares rows too. assertSchemaEqual compares only schemas."
    hints:
      - "What is the default for checkRowOrder?"
      - "How are floats compared?"
      - "Both differences are tolerated."
    explanation: |
      `assertDataFrameEqual` ignores row order unless you set `checkRowOrder=True`, and compares floats within `rtol=1e-5`. Tested on PySpark 4.0.4.

  - id: A9-L3-E2
    type: predict_output
    difficulty: 2
    language: python
    prompt: |
      A hand-written comparison sorts both sides first. What does it print?
    code: |
      actual = [(1, 0.1 + 0.2), (2, 1.0)]
      expected = [(2, 1.0), (1, 0.3)]
      print(sorted(actual) == sorted(expected))
    answer: "False"
    wrong_answers:
      - answer: "True"
        feedback: "Sorting fixes the order, but 0.1 + 0.2 is 0.30000000000000004, so the tuples differ."
    hints:
      - "Sorting handles the order."
      - "What is 0.1 + 0.2 exactly?"
      - "Exact equality on floats."
    explanation: |
      Sorting fixes the order but not floating-point rounding. That is why a helper with tolerances beats hand-written comparisons.

