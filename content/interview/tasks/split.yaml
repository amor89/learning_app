hints:
  - "Start without `stratify`: shuffle the positions once, then slice the shuffled array into test and train."
  - "Stratification is the same slice, done per class: loop over `np.unique(stratify)`, shuffle that class's positions, slice, then join the pieces with `np.concatenate`."
  - "Treat the unstratified case as one class: `labels = np.zeros(n_rows, dtype=int)` when `stratify` is None. Check the share first and the empty sets last."
explanation: |
  Shuffle positions, not rows: the function never touches the data, so the same split applies to `X`, `y` and any group columns. Treating "no stratify" as a single class keeps one code path. `math.ceil` on the test count matches the rule in the prompt, and the guards turn silent nonsense, such as an empty training set, into an error you see at once.
follow_ups:
  - question: Your rows repeat per customer. What breaks, and what do you change?
    answer: |
      A random split puts the same customer in train and test, so the model scores well by recognising people. Split by group instead: shuffle the unique customer IDs, assign whole customers to a set, as GroupShuffleSplit does. In B11-L1, random CV scored 0.995 against 0.468 for GroupKFold on a label unrelated to the features.
  - question: Why stratify, and when is it not enough?
    answer: |
      With a rare class, an unstratified split can leave the test set with a handful of positives, or none, so its metrics swing. Stratifying keeps the class share in each set. It does not help when rows are not independent: grouped rows need a group split, and forward-looking models need a split by time.
  - question: When is a random split the wrong choice altogether?
    answer: |
      When the model predicts the future. Train before a cut-off date and test after it, so no feature or row from the future leaks into training (B10-L3). Use TimeSeriesSplit for cross-validation.
