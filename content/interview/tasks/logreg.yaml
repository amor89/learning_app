hints:
  - "Write `sigmoid` first and test it on -1000, 0 and 1000. The trick is to take `exp` of `-abs(z)` only."
  - "Each step: `p = sigmoid(X @ w + b)`, then the gradients `X.T @ (p - y) / n` and `mean(p - y)`. The `p - y` term comes from the chain rule through the sigmoid and the log loss."
  - "Move against the gradient: `w = w - lr * grad_w` and `b = b - lr * grad_b`. Divide by n, or the step size grows with the data."
explanation: |
  The stable sigmoid never exponentiates a large positive number, so it returns exact 0s and 1s at the extremes instead of overflow warnings. The gradient `X.T @ (p - y) / n` is the same shape as for linear regression with `p` in place of the prediction, because the sigmoid's derivative cancels against the log loss. Dividing by n keeps one learning rate valid for any number of rows.
follow_ups:
  - question: Why not train logistic regression with mean squared error?
    answer: |
      With a sigmoid output, squared error is not convex in the weights, and its gradient carries a factor p(1 - p) that vanishes when the model is confidently wrong. Log loss is convex and its gradient, X.T @ (p - y) / n, stays large for confident mistakes.
  - question: How do you know your gradient is right without a library?
    answer: |
      Compare it with central differences: (loss(w + h) - loss(w - h)) / (2h) for each weight, with h around 1e-5 in float64. Agreement to about 1e-6 means the formula is right (B23-L2).
  - question: Training is slow, or the loss turns into nan. What do you check?
    answer: |
      The learning rate first: too high and the loss grows or becomes nan, too low and it barely falls (B23-L3). Then feature scales: unscaled features need different step sizes, so standardise with statistics from training rows. Then the sigmoid and loss for overflow.
  - question: The positive class is 2% of rows. What changes?
    answer: |
      Train normally and choose the decision threshold from the cost or the review capacity, not 0.5 (B12-L1, B12-L3). Class weights push the probabilities towards 0.5, so recalibrate if the probability itself is used (B12-L2).
