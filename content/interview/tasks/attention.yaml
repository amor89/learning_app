hints:
  - "Get the unmasked version right first: scores, a stable softmax along the last axis, then `weights @ v`. Use `np.swapaxes(k, -1, -2)` so batches work."
  - "Mask the scores, not the weights: `np.where(mask, scores, -np.inf)` before the softmax. `exp(-inf)` is exactly 0, and the other weights still sum to 1."
  - "Check for empty rows before the softmax: `np.broadcast_to(mask, scores.shape).any(axis=-1).all()` must be True, or the row is `-inf - -inf`, which is `nan`."
explanation: |
  The scale keeps the scores' spread near 1 whatever `d` is, so the softmax does not saturate. Subtracting the row maximum changes nothing mathematically, because softmax ignores a constant shift, and it keeps `exp` at or below 1. Masking with minus infinity before the softmax gives exact zeros and renormalises the rest. Multiplying weights by the mask afterwards leaves rows that no longer sum to 1.
follow_ups:
  - question: Why divide by sqrt(d)?
    answer: |
      For independent entries with unit variance, a dot product of length d has variance d, so its typical size grows like sqrt(d): about 2, 8 and 22 at d = 4, 64 and 512 (B25-L3). Large scores push the softmax towards one-hot, where gradients vanish. Dividing by sqrt(d) keeps the spread near 1.
  - question: What is the cost of attention in time and memory?
    answer: |
      The score matrix is L_q by L_k, so time and memory grow with the square of the sequence length for self-attention, times d for the products. That limits context length. Recurrent models are linear in length but cannot run the steps in parallel (B25-L2).
  - question: How do you test that a causal mask works?
    answer: |
      Change a later token and check that earlier outputs stay the same, and add padding and check that outputs at real positions stay the same (B25-L4). Also assert masked weights are exactly 0.
  - question: Why several heads instead of one?
    answer: |
      Each head attends in its own d / h-dimensional projection, so heads can track different relations at the same cost as one full-size head. The outputs are concatenated and projected back to d (B25-L5).
