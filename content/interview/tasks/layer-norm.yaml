hints:
  - "Everything happens along the last axis: use `axis=-1` with `keepdims=True` for the mean and the variance."
  - "`x.var` without `ddof` is the population variance, which is what layer norm uses."
  - "Put eps inside the square root: `np.sqrt(var + eps)`. Check the shapes of gamma and beta before you compute anything."
explanation: |
  Layer norm works per token, across its features, so it does not depend on the batch and behaves the same in training and at prediction. Batch norm, by contrast, normalises each feature across the batch. Eps inside the square root is the standard form, as in PyTorch's `nn.LayerNorm`, and keeps a constant token finite.
follow_ups:
  - question: How does layer norm differ from batch norm?
    answer: |
      Batch norm normalises each feature across the batch and keeps running statistics for prediction, so it behaves differently in train and eval mode and depends on batch size. Layer norm normalises each token across its features, with no running statistics, which suits variable-length sequences and small batches.
  - question: Where does layer norm sit in a pre-norm transformer block, and why does it matter?
    answer: |
      Before each sub-layer, inside the residual: x = x + attention(norm_1(x)), then x = x + feed_forward(norm_2(x)) (B25-L6). The residual path stays an identity, which keeps gradients flowing through deep stacks and makes training more stable than post-norm.
  - question: Why learn gamma and beta at all?
    answer: |
      Normalising forces mean 0 and variance 1, which might not suit the next layer. Gamma and beta let the model learn the scale and shift it needs, including undoing the normalisation.
