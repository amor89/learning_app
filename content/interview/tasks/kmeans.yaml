hints:
  - "Write the assign step on its own first: a `(n_rows, k)` array of squared distances, then `argmin(axis=1)`."
  - "Loop: assign, compare the new labels with the old ones and stop if nothing changed, then update each centroid from its members."
  - "Guard the update: compute `members = X[labels == j]` and move the centroid only when `len(members) > 0`. Start `labels` at -1 so the first round never stops early."
explanation: |
  Each round lowers or keeps the total squared distance, so the labels settle after a finite number of rounds. Stopping when the labels repeat also guarantees the returned labels match the returned centroids. The empty-cluster guard matters on real data with duplicates or outliers: without it one bad start fills the result with `nan`.
follow_ups:
  - question: How do you choose k?
    answer: |
      From the use first: a fixed number of segments a team can act on. Then check candidates with an internal measure such as silhouette, stability across seeds with the adjusted Rand index, and by reading samples from each cluster (B15-L3). Plotting inertia against k shows diminishing returns, but the "elbow" is often unclear.
  - question: What are k-means' assumptions, and when does it fail?
    answer: |
      It assumes roughly round clusters of similar size, because it splits space by nearest centroid. It puts every point in a cluster, so noise and outliers drag centroids. For uneven densities, odd shapes or real noise, use a density method such as HDBSCAN, which labels sparse points -1 (B15-L2).
  - question: Your result changes from run to run. Why, and what do you do?
    answer: |
      k-means finds a local optimum that depends on the starting centroids. Seed the generator, run several starts and keep the one with the lowest total squared distance, and use a spread-out start such as k-means++. Measure the stability across seeds with the adjusted Rand index.
  - question: Do you scale features first?
    answer: |
      Yes, when features use different units. Distances are dominated by the feature with the largest range, so standardise with statistics from the data you fit on, and keep those statistics to transform new data.
