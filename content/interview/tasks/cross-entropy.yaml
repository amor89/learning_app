hints:
  - "Drop the ignored rows first with a boolean mask, then work on what is left."
  - "Log-softmax in two lines: subtract the row maximum, then subtract the log of the row's sum of `exp`. Never take `log` of a softmax you computed with raw `exp`."
  - "Pick each row's target with `log_probs[np.arange(len(t)), t]`, negate, and take the mean over the kept rows only."
explanation: |
  Working in log space avoids two failures: `exp(1000)` overflows, and `log` of a probability that underflowed to 0 is minus infinity. The mean runs over kept rows, which is PyTorch's default `reduction="mean"` with `ignore_index`: padding and the later pieces of split words then add nothing (B26-L5).
follow_ups:
  - question: Why does a classifier output logits instead of probabilities?
    answer: |
      The loss applies log-softmax itself, in a stable form. A softmax in the model would be applied twice, squeezing the outputs and shrinking the gradients (B16-L2, B23-L5). Apply softmax only when you need probabilities at prediction time.
  - question: What is the gradient of this loss with respect to the logits?
    answer: |
      softmax(logits) minus the one-hot target, divided by the number of kept rows. Ignored rows get a gradient of zero.
  - question: The loss starts near log(n_classes) and stays there. What does that tell you?
    answer: |
      The model predicts close to uniform probabilities and is not learning. Check the learning rate, that zero_grad runs every step, that the targets match the inputs, and that the model is in train mode.
